# Serves the built single-page app (research R10). No node_modules in the runtime image.
server {
  listen 5175;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;

  # Compose health check.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Never cache the page shell, so the back button refetches it after logout (spec 001 SC-007).
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # SPA fallback: every client-side route serves index.html.
  location / {
    try_files $uri /index.html;
  }
}
