# QueuePass sign-in look (spec 021, research R1, R2). One login theme for the realm; each app's
# name, audience line, and accent are chosen in template.ftl from the client that started sign-in.
#
# Parent base: the form templates (login.ftl, error.ftl, info.ftl, logout-confirm.ftl, and the
# rest) with no styling, so the shared theme's classes apply. No PatternFly stylesheet is loaded.
parent=base
import=common/keycloak
locales=en

# css/theme.css is packages/shared/src/web/theme.css, copied in by keycloak/Dockerfile (R4, R6).
styles=css/theme.css css/login.css
stylesCommon=
# Phone width (FR-012): base's template.ftl writes each name==content pair as a <meta> tag.
meta=viewport==width=device-width,initial-scale=1

# Keycloak's class hooks, mapped to the shared theme's classes (R2).
kcFormGroupClass=field
kcButtonClass=btn
kcButtonPrimaryClass=btn--primary
kcButtonBlockClass=
kcButtonLargeClass=
kcAlertClass=banner
kcAlertTitleClass=banner__body
# The shared theme has no field error class; login.css styles this one with var(--danger).
kcInputErrorMessageClass=qp-field-error

# The show-password toggle stays (FR-011, FR-012): a ghost button whose icon login.css draws as
# the visible word "Show" or "Hide". Its accessible name is base's aria-label, unchanged.
kcFormPasswordVisibilityButtonClass=btn btn--ghost qp-reveal
kcFormPasswordVisibilityIconShow=qp-reveal--show
kcFormPasswordVisibilityIconHide=qp-reveal--hide
kcInputGroup=qp-input-group

# Hooks base's templates use that the QueuePass look does not need: empty, so no PatternFly or
# stray class reaches the page.
kcHtmlClass=
kcBodyClass=
kcLoginClass=
kcHeaderClass=
kcHeaderWrapperClass=
kcFormCardClass=
kcFormHeaderClass=
kcContentWrapperClass=
kcLabelWrapperClass=
kcLabelClass=
kcInputClass=
kcFormSettingClass=
kcFormOptionsWrapperClass=
kcInfoAreaWrapperClass=
kcSignUpClass=
kcResetFlowIcon=
kcFeedbackErrorIcon=
kcFeedbackInfoIcon=
kcFeedbackSuccessIcon=
kcFeedbackWarningIcon=
kcLocaleMainClass=
kcLocaleWrapperClass=
kcLocaleDropDownClass=
kcLocaleListClass=
kcLocaleListItemClass=
kcLocaleItemClass=
kcCommonLogoIdP=
kcFormSocialAccountSectionClass=
kcFormSocialAccountListClass=
kcFormSocialAccountListGridClass=
kcFormSocialAccountListButtonClass=
kcFormSocialAccountGridItem=
kcFormSocialAccountNameClass=
