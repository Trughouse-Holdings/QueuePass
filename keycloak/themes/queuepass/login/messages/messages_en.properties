# QueuePass sign-in screens (spec 021, research R3, R9). Keycloak's own messages come from the
# parent theme; these are added.

# The tab title and the one heading on every sign-in page: "Sign in to {app name}" (FR-001).
qpSignInTo=Sign in to {0}

# Who each app is for (FR-005), keyed by the client ID that started sign-in. A client with no
# line here shows none (FR-008).
qpAudience.admin-app=For administrators managing venues, events, and sales.
qpAudience.customer-app=For customers buying and viewing tickets.
qpAudience.booth-app=For gate agents checking tickets in at the door.
