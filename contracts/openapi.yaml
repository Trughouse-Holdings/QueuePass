        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tiers]
      summary: Remove a ticket tier
      description: |
        Permanent. Clients MUST ask the user to confirm first. A tier with orders cannot be
        removed (`409 TIER_HAS_ORDERS`); a cancelled event's tiers cannot change (`409
        EVENT_CANCELLED`). Feature 015: the tier's seat reservations are deleted with it, and
        their seats become open at once.
      operationId: deleteTicketTier
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Tier removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: Tickets left and whether sales are open
      description: |
        Tickets left for the event and for each of its tiers, counting valid tickets only, and
        whether sales are closed and why, decided by the Backend's clock (feature 006). The
        counts are guidance: `createOrder` decides under its own lock, so a count can be out of
        date by the time an order arrives.

        Feature 016: for a signed-in customer and an event with a `maxTicketsPerCustomer`,
        `customerLimit` gives the limit, the caller's own valid tickets for the event, and how many
        more they may get; otherwise it is `null`. It never describes another customer.

        Feature 034: sales close at `endsAt`, not `startsAt`, so `salesClosed` is `ENDED` from
        `endsAt` on (`STARTED` is no longer sent), and `inProgress` says whether the event is
        between its `startsAt` and its `endsAt`, by the same clock in the same answer. The Customer
        app shows its "already started" notice from these two values, never from its own clock.
      operationId: getEventAvailability
      x-required-roles: []
      responses:
        '200':
          description: The event's availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/venue-map:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: The event's venue map, without seats
      description: |
        Feature 038. The event's layout drawn as sections (size, floor object, each section's
        outline and label point), its levels with this event's prices (`null` for a level with no
        seats on sale), and for each section and level how many seats are `open`, `reserved`
        (held), `sold` and `offSale`. Seats come one section at a time from `getVenueMapSection`.
        The same for every caller; it never says who holds or bought a seat. `streamSeatMap` sends
        this map first and then every change. A general-admission event has no venue map (`404`).
      operationId: getVenueMap
      x-planned: '038'
      x-required-roles: []
      responses:
        '200':
          description: The venue map.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/venue-map/sections/{sectionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: sectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: A section of the event's layout (`404` otherwise).
    get:
      tags: [seating]
      summary: One section of the venue map, seat by seat
      description: |
        Feature 038. The section's rows front first and each seat with its label, place, level and
        state for this event. Never says who holds or bought a seat. Apply `streamSeatMap`'s
        changes to it to keep it current.
      operationId: getVenueMapSection
      x-planned: '038'
      x-required-roles: []
      responses:
        '200':
          description: The section's seats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueMapSection' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seats/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: Live updates of the event's seat map
      description: |
        A Server-Sent Events stream of the event's seat map (feature 015). After the first event,
        each `event: seats` carries a `SeatMapChange`: seats that became open, reserved, sold, or
        off sale, sent within 2 seconds of the change. `event: ping` (`data: {}`) arrives every 15
        seconds. No event ever names a customer. A client that loses the stream reconnects and
        gets a fresh map. The stream ends when the access token expires; reconnect at once with a
        current one. It also ends when the event is deleted; a reconnect then gets `404`.

        Feature 038: the stream begins with `event: venueMap`, whose `data` is the `VenueMap`, as
        from `getVenueMap`. Each `seats` message carries the
        event's seat-change sequence number `seq`, and each change the seat's `levelId` and the
        state it left (`from`). A client keeps the venue map's counts by adding 1 to `state` and
        taking 1 from `from` for that level, for messages whose `seq` is greater than the map's
        `seq` only (a message read while the map was being read may already be in it), and a
        loaded section's seats the same way against that section's `seq`. Seats taken off sale or
        put back by an event save are `seats` messages (`offSale`, `open`). The stream **ends**
        when the event's layout or level prices change, or a layout it uses is edited; a client
        reconnects at once, reads the new map, and reloads the section it had open.
      operationId: streamSeatMap
      x-required-roles: []
      x-sse-events:
        venueMap:
          $ref: '#/components/schemas/VenueMap'
          x-planned: '038'
        seats: { $ref: '#/components/schemas/SeatMapChange' }
        ping: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: |
            The event stream. `data` is a `VenueMap` for `venueMap` and a `SeatMapChange` for
            `seats`.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: venueMap
                  data: {"eventId":"7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40","seq":41,"layoutId":"0b7f2a7e-3c55-4a63-9f1e-5e0c8b4d2a11","layoutName":"Basketball","size":{"width":1000,"height":640},"floorKind":"COURT","floorOutline":[[350,230],[650,230],[650,410],[350,410]],"levels":[],"sections":[]}

                  event: seats
                  data: {"eventId":"7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40","seq":42,"changes":[{"sectionId":"5b0d3c1e-8f2a-4c6b-9d1e-2a3b4c5d6e7f","row":1,"seat":3,"state":"reserved","from":"open","levelId":"9a1c0e4b-2d3f-4a5b-8c6d-7e8f9a0b1c2d"}]}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seating:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: An event's layout, level prices and seats off sale
      description: |
        Feature 038. What the Admin app's Seating section edits: the event's layout, each of its
        levels with its seats, seats on sale and this event's price (`null` when not set), and the
        seats off sale as selectors, compacted: a whole section as `{sectionId}`, then whole rows
        as `{sectionId, row}`, then single seats. A general-admission event answers with
        `layoutId: null` and empty lists.
      operationId: getEventSeating
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: The event's seating.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSeating' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{id}/reservation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [seating]
      summary: Reserve seats
      description: |
        Reserves seats for the signed-in customer for 5 minutes (feature 015). With no active
        reservation for the event, it makes one (`201`) that ends at `expiresAt`, 5 minutes later;
        with one, it adds the seats to it (`200`) without changing `expiresAt`. All or nothing:
        any refusal reserves no seat. Feature 033: the Customer app sends one seat per request, as
        each seat is clicked, one request at a time.

        Each seat follows the rules of `createOrder`'s seats: a seat of the event's layout (`400`),
        on sale (`409 SEAT_OFF_SALE`), and not repeated (`400`). Added seats must not already be in
        the reservation (`400`). A reservation holds at most 10 seats (`400`), and no more than the customer may
        still get under the event's `maxTicketsPerCustomer`, counting valid tickets only
        (`409 TICKET_LIMIT_REACHED`; `details.requested` is the seats the reservation would then
        hold).

        Refused when the event has no reserved seating (`400`), is cancelled (`409
        EVENT_CANCELLED`), or has ended (`409 SALES_CLOSED`; feature 034, before which it was
        refused once started); for seats with a valid ticket or in
        another customer's active reservation (`409 SEAT_TAKEN`, `details.seats`, with
        `details.reserved` listing the reserved ones); and for seats that left one of this
        customer's reservations released, run out, or on logout, when that reservation ended less
        than 2 minutes ago (`409 SEAT_COOLDOWN`, `details.seats`, `details.availableAt`: the
        reservation's end plus 2 minutes). Feature 033: the wait counts from the end of the
        reservation, not of the seat's hold, so a seat released from the active reservation while it
        keeps other seats can be reserved again at once, into it, with `expiresAt` unchanged; bought
        seats, and seats ended by an admin change or cancellation, never wait. A seat that is both
        taken and waiting is refused as `SEAT_TAKEN`. No seat is ever in two active reservations, or
        in one and on a valid ticket, including under concurrent requests.

        Feature 038: one reservation may hold seats of several price levels, still at most 10.
        `tierId` is always `null`. Each reserved seat says its labels, level and current price.

        Feature 026: a seat-hold attempt (`x-attempt-limit: HOLD`), new or adding seats, however
        many seats it names. Over the caller's hold allowance it is refused with `429 RATE_LIMITED`
        (`details.action: HOLD`) before any rule above is checked: no seat is reserved, and the
        caller's active reservation keeps its seats and `expiresAt`.
      operationId: reserveSeats
      x-required-roles: [customer]
      x-attempt-limit: HOLD
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '200':
          description: The seats were added to the caller's active reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '201':
          description: A new reservation, ending 5 minutes from now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /events/{id}/reservation/release:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [seating]
      summary: Release reserved seats
      description: |
        Releases seats from the signed-in customer's active reservation for the event (feature 015):
        the listed `seats`, or all of them when `seats` is omitted. Released seats are open to
        others at once. The rest keep their `expiresAt`. Releasing the last seat ends the
        reservation; this customer can't then reserve any seat that left it released, run out, or on
        logout until 2 minutes after that end (bought seats, and seats ended by an admin change or
        cancellation, never wait), while a seat released as others stay reserved can be reserved
        again at once (feature 033; `reserveSeats`). A seat not in the reservation is `400`. With no
        active reservation, nothing happens and `reservation` is `null`, so a repeat is harmless.
        Feature 026: never limited and never counted toward the attempt limits.
      operationId: releaseSeats
      x-required-roles: [customer]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRelease' }
      responses:
        '200':
          description: What is left of the reservation; `null` once no seat is left.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationReleaseResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/orders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Get tickets for an event
      description: |
        Places an order for the signed-in customer and issues one ticket per seat, each with a
        unique code. Payment is simulated and always succeeds. Prices are fixed on the order.

        For an event with tiers, `tierId` is required and must be one of its tiers; for an event
        without tiers, `tierId` must be omitted and the base price applies (`400` otherwise).
        Refused when the event is cancelled (`409 EVENT_CANCELLED`) or when fewer tickets are
        left than requested, in the tier or in the event (`409 SOLD_OUT`, with
        `details.available`). Sales never exceed a tier's quantity or the event's capacity,
        including under concurrent requests.

        Feature 006, as changed by feature 034: sales close when the event ends; an order at or after
        `endsAt` is refused (`409 SALES_CLOSED`), and one after `startsAt` but before `endsAt` is
        placed like any other. A `requestId` makes a confirmation safe to repeat: if this
        customer already placed an order with the same `requestId`, that order is returned with
        `200` and nothing new is recorded, even if the event has since sold out, ended, or been
        cancelled. The same `requestId` with a different event, tier, or quantity is refused
        (`409 REQUEST_ID_REUSED`). Without a `requestId`, every request places a new order.

        Feature 007: an event with reserved seating requires `seats`, exactly `quantity` distinct
        seats of its layout (`400` otherwise); an event without reserved seating forbids them. Seats
        already taken by valid tickets are refused (`409 SEAT_TAKEN`, `details.seats`). No seat is
        ever held by two valid tickets, including under concurrent requests. A repeated
        `requestId` must also name the same seats.

        Feature 016: for an event with a `maxTicketsPerCustomer`, an order is refused when the
        customer's valid tickets for the event, across all their orders, plus `quantity` would
        exceed it (`409 TICKET_LIMIT_REACHED`, with `details.limit`, `details.held`,
        `details.remaining`, and `details.requested`). Void tickets do not count. When fewer
        tickets are left than the customer may still get, `SOLD_OUT` is returned instead, so the
        refusal always names the smaller number. A customer never holds more than the limit,
        including under concurrent requests. A repeated `requestId` is returned as before and
        counts once.

        Feature 015: for an event with reserved seating, every seat must be in the caller's
        active reservation for the event (`reserveSeats`). A seat with a valid ticket or in another
        customer's reservation is `409 SEAT_TAKEN` (with `details.reserved`); any other seat is
        `409 RESERVATION_REQUIRED` (`details.seats`; `details.expired` is `true` when the
        caller's reservation ran out). Bought seats leave the reservation; seats not bought stay
        reserved until it ends. A repeated `requestId` is returned before this check.

        Feature 038: for a seated event, `tierId` must be left out (`400`); the seats may be of
        several price levels. Each ticket costs its seat's level price at the moment the order is
        placed, under the event's lock, and says it (`Ticket.price`, `Ticket.levelName`);
        `totalPrice` is their sum; `unitPrice` is `null` when the tickets' prices differ. A seat off sale is `409 SEAT_OFF_SALE`.

        Feature 017: `holderName` is the buyer's own name, printed on every ticket of the order
        and checked against their ID at the gate. It is trimmed of leading and trailing spaces,
        and must then be 1 to 100 characters, contain at least one letter in any script, and
        contain no control characters; otherwise `400 HOLDER_NAME_INVALID` (`details.reason`).
        It cannot be changed after the order is placed. A repeated `requestId` must also name the
        same `holderName`.

        Feature 026: a buy attempt (`x-attempt-limit: BUY`), a repeated `requestId` included. Over
        the caller's buy allowance it is refused with `429 RATE_LIMITED` (`details.action: BUY`)
        before any rule above is checked, so nothing is recorded and the caller's seat reservations
        are unchanged; a later repeat of the same `requestId` is handled as above.
      operationId: createOrder
      x-required-roles: [customer]
      x-attempt-limit: BUY
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200':
          description: |
            A repeat of an earlier request with the same `requestId`; the earlier order is
            returned unchanged and nothing new is recorded (feature 006).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Order placed; its tickets are included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/OrderRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }

  /events/{id}/attendees:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: List an event's orders and tickets
      description: Every order for the event, oldest first, refunded ones included.
      operationId: listAttendees
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: The event's orders, each with its tickets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Cancel an event
      description: |
        Irreversible: clients MUST ask the user to confirm first. In one all-or-nothing step,
        voids every valid ticket, marks every confirmed order refunded (simulated), and marks the
        event cancelled. A cancelled event no longer blocks its venue's time, and refuses edits,
        tier changes, orders, and a second cancellation (`409 EVENT_CANCELLED`). Feature 015:
        every active seat reservation for the event ends too, and every seat freed, reserved or
        sold, is sent as open on `streamSeatMap`.
      operationId: cancelEvent
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Event cancelled, with how many orders and tickets were affected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/entry/lookup:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event the gate agent is working.
    post:
      tags: [entry]
      summary: Look a ticket up at the gate
      description: |
        Feature 017. Finds the ticket with this code and says whether it can be admitted at this
        event's gate now. The code is sent in the body, not the path, so it stays out of request
        logs. Letter case, spaces, and dashes are ignored; anything that is not then a ticket
        code, or matches no ticket, is `404 TICKET_NOT_FOUND`.

        Feature 018: `code` may instead be a **live code** from the Customer app, which starts
        with `QP1:` and changes every 30 seconds. A live code that QueuePass did not make, or that
        names no ticket, is `404 LIVE_CODE_INVALID`. A genuine live code is accepted from 5
        seconds before its 30-second window starts until 5 seconds after it ends, on the
        Backend's clock; outside that it is `409 LIVE_CODE_EXPIRED`, with nothing about its
        ticket. An accepted live code then answers exactly like its ticket's code would, with
        `verifiedBy: LIVE_CODE`; a ticket code answers `verifiedBy: TICKET_CODE`. A verified live
        code needs no ID check; a ticket code always does.

        A ticket that exists is always `200`, with `state` saying what the agent may do:
        `ADMITTABLE`; `USED` (with `usedAt`); `VOID` (its order was refunded, for example because
        the event was cancelled); `OTHER_EVENT` (the ticket's own event is in `event`); `NOT_OPEN`
        (entry opens at `entryOpensAt`, 1 hour before the event's `doorsOpenAt`, feature 025); or
        `ENDED`. The window is half-open, `[doorsOpenAt - 1 hour, endsAt)`, on the database's clock,
        for ticket codes and live codes alike (until feature 025, `[startsAt - 2 hours, endsAt)`;
        events from before 025 have `doorsOpenAt` 1 hour before the start, so their window is the
        same). Nothing is recorded.

        `unusedOnOrder` counts the valid, unused tickets of this ticket's order for this event,
        including this one, so the agent can offer to admit them all after one ID check.
      operationId: lookupEntryTicket
      x-required-roles: [gate-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryLookupInput' }
      responses:
        '200':
          description: The ticket and whether it can be admitted here now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryTicket' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409':
          description: Feature 018. A genuine live code outside its window and grace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: LIVE_CODE_EXPIRED
                  message: This live code has expired.

  /events/{id}/entry/admit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event the gate agent is working.
    post:
      tags: [entry]
      summary: Admit a ticket, or every unused ticket of its order
      description: |
        Feature 017. Records an entry for the ticket: the time (the database's clock) and the
        signed-in gate agent. A ticket is admitted at most once, including when any number of
        admit requests for it arrive at the same moment; every later one is refused. Admitting
        cannot be undone, and there is no re-entry.

        With `wholeOrder: true`, every valid, unused ticket of the same order for this event is
        admitted, each as its own entry under the same rule, and tickets of that order already
        used by then are listed in `alreadyUsed` instead. It never admits another order's tickets.

        Refused with `409 ENTRY_REFUSED` when nothing could be admitted. `details.reason` is
        `USED` (with `details.usedAt`), `VOID`, `OTHER_EVENT` (with `details.event`), `NOT_OPEN`
        (with `details.entryOpensAt`), or `ENDED`, the same states `lookupEntryTicket` reports, in
        the same window (feature 025: `[doorsOpenAt - 1 hour, endsAt)`).
        Feature 020: `details.event` also carries the event's venue `timeZone`, as
        `EntryTicket.event` does.
        A refused ID check is not sent to the Backend: the client simply does not call this.
      operationId: admitTicket
      x-required-roles: [gate-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdmitInput' }
      responses:
        '200':
          description: At least one ticket was admitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [images]
      summary: Add an image to an event
      description: |
        Feature 014.
        Adds one picture after the event's existing images. The body is `multipart/form-data` with
        exactly one part, `file`, and nothing else. The type is decided from the file's first
        bytes (its signature), never from its file name or the part's `Content-Type`: only JPEG
        (`FF D8 FF`), PNG (`89 50 4E 47 0D 0A 1A 0A`), and WebP (`RIFF`, 4 bytes, `WEBP`) are
        accepted. The stored and served `contentType` is the detected one. The width and height
        are read from the header (PNG `IHDR`, WebP `VP8 `/`VP8L`/`VP8X`, JPEG `SOFn`); a file
        whose header gives no size is treated as not a picture.

        Before storing, location, camera, and text metadata are removed: JPEG Exif and XMP `APP1`
        segments, `APP2` `MPF` and `APP13` segments, and `COM` comments (a JPEG's orientation is
        kept in a minimal Exif segment of its own); PNG `eXIf`, `tEXt`, `iTXt`, `zTXt`, and `tIME`
        chunks; WebP `EXIF` and `XMP ` chunks; and anything after a JPEG's first `EOI`, after a
        PNG's `IEND`, or past a WebP's declared `RIFF` length. The picture data is not changed.
        `byteSize` is the stored size; the 5 MB limit applies to the file as sent.

        Refused, in this order: `401` and `403` (before the body is read); a file over 5 MB,
        5,242,880 bytes (`413 IMAGE_TOO_LARGE`, while the body is read); a body without exactly
        one `file` part, or with other parts (`400 VALIDATION_FAILED`); a malformed event id
        (`400 VALIDATION_FAILED`); a file that is not a JPEG, PNG, or WebP, an animated PNG or WebP,
        or one whose size in pixels cannot be read or whose segments or chunks run past the end of
        the file (`415 IMAGE_TYPE_NOT_ALLOWED`); a picture wider or taller than 16,384
        pixels or of more than 40,000,000 pixels (`400 IMAGE_DIMENSIONS_TOO_LARGE`, with
        `details.width`, `details.height`, `details.maxSide`, `details.maxPixels`); an unknown
        event (`404`); a cancelled event (`409 EVENT_CANCELLED`); and an event that already has 5
        images (`409 IMAGE_LIMIT_REACHED`, with `details.limit` and `details.count`). An event
        never has more than 5 images, including under concurrent requests. Nothing is stored when
        refused.
      operationId: uploadEventImage
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/EventImageUpload' }
      responses:
        '201':
          description: Image added, last in the event's order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ImageRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ImageTooLarge' }
        '415': { $ref: '#/components/responses/ImageTypeNotAllowed' }

  /events/{id}/images/order:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    put:
      tags: [images]
      summary: Set the order of an event's images
      description: |
        Feature 014.
        `imageIds` lists every image of the event, each once, in the new order; the first becomes
        the cover (`position` 1). A list that is malformed, repeats an id, or has more than 5 ids is
        `400`. A list that does not name exactly the event's current images, because another
        request added or removed one meanwhile, is `409 IMAGES_CHANGED`, with the current order in
        `details.imageIds`; nothing changes. A cancelled event is `409 EVENT_CANCELLED`.
      operationId: reorderEventImages
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventImageOrder' }
      responses:
        '200':
          description: The event's images in their new order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: An image of that event. An image of a different event is `404`.
    get:
      tags: [images]
      summary: An image's content
      description: |
        Feature 014.
        The picture's bytes as stored (as uploaded, with its metadata removed), with
        `Content-Type` set to its detected type. Like every operation except `getHealth`, it needs a
        bearer token, so a browser cannot load it with a plain `<img src>`: the apps fetch it with the
        token and show it from a local object URL. An image's content never changes, so the response
        carries `Cache-Control: private, max-age=31536000, immutable`, and
        `X-Content-Type-Options: nosniff`.
      operationId: getEventImage
      x-required-roles: []
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [images]
      summary: Remove an image from an event
      description: |
        Feature 014.
        Permanent. The event's other images keep their order and close the gap, so positions stay
        1 to n. A cancelled event's images cannot change (`409 EVENT_CANCELLED`).
      operationId: deleteEventImage
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Image removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reports/sales:
    get:
      tags: [reports]
      summary: Sales report
      description: |
        Computed on request, so it is always current. Totals cover all events; `ticketCapacity`
        and `events` in the totals count scheduled events only. Refunded orders and void tickets
        are excluded from sold, revenue, and check-ins. Events ordered by `startsAt`.
      operationId: getSalesReport
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Totals and per-event, per-tier figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak access token from one of the three app realms (feature 028), obtained by a front
        end through the OIDC Authorization Code flow with PKCE. Audience must include
        `queuepass-api`.

  schemas:
    Role:
      type: string
      enum: [queuepass-admin, gate-agent, customer]

    Me:
      type: object
      required: [sub, username, roles]
      additionalProperties: false
      properties:
        sub:
          type: string
          description: Keycloak subject identifier (the token's `sub`).
          example: 3f0c1e9a-5b7d-4c2e-9f1a-2b3c4d5e6f70
        username:
          type: string
          description: The token's `preferred_username`.
          example: admin1
        roles:
          type: array
          description: The caller's QueuePass role, the one its app's realm grants (feature 028). Other realm roles are omitted.
          items: { $ref: '#/components/schemas/Role' }
          uniqueItems: true
          example: [queuepass-admin]

    Hello:
      type: object
      required: [app, appName, username, message]
      additionalProperties: false
      properties:
        app: { type: string, enum: [admin, customer, booth] }
        appName: { type: string }
        username: { type: string }
        message: { type: string }

    VenueHasEvents:
      description: The `409` for deleting a venue that still has events. An `ErrorEnvelope`.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: VENUE_HAS_EVENTS }
            message: { type: string }
            details:
              type: object
              properties:
                eventCount:
                  type: integer
                  minimum: 1
                  description: Omitted only when a concurrent insert made the database refuse.

    Location:
      description: |
        A venue. Feature 013: when `street`, `city`, `state`, and `zip` are set, `address` is
        built from them as `STREET, CITY, ST ZIP`. Three kinds of venue:

        - `addressVerified: true`: the address service matched it; the four fields are its
          standard (upper-case) form. From 1.18.0 (#36), a suite or unit the admin typed at the
          end of the street, which the service leaves out, is kept at the end of `street`, upper
          case (`430 W VINE ST STE 2`). From 1.20.0 (#25), also an address verified by
          OpenStreetMap (`createLocation`, `updateLocation`); its four fields are as sent.
        - `addressVerified: false` with the four fields set: saved with
          `acceptUnverifiedAddress` because the address service did not match it or, feature
          024, could not be asked; the fields are as the admin sent them.
        - `addressVerified: false` with the four fields `null`: saved before feature 013 and not
          re-addressed since; `address` is the one-line text it was saved with.

        The five fields are always sent from feature 013 on, and required from 1.18.0 (#36;
        feature 013 research R11 left them optional until the Backend sent them). The four
        parts stay nullable.

        Feature 020: `timeZone` and `timeZoneSource` are always sent, and required from 1.14.0
        (#88; feature 020 research R18 left them optional until every app read them).
      type: object
      required:
        [
          id,
          name,
          address,
          street,
          city,
          state,
          zip,
          addressVerified,
          timeZone,
          timeZoneSource,
          seatingCapacity,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: 'KFC Yum! Center' }
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: The full one-line address. Shown by every client and matched by `q`.
          example: '430 W VINE ST, LEXINGTON, KY 40507'
        street:
          type: [string, 'null']
          maxLength: 200
          example: '430 W VINE ST'
        city:
          type: [string, 'null']
          maxLength: 100
          example: LEXINGTON
        state:
          oneOf:
            - { $ref: '#/components/schemas/UsState' }
            - { type: 'null' }
        zip:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          example: '40507'
        addressVerified:
          type: boolean
          description: Whether the address service matched this address. Clients mark `false` as "Address not verified".
        timeZone: { $ref: '#/components/schemas/UsTimeZone' }
        timeZoneSource: { $ref: '#/components/schemas/TimeZoneSource' }
        seatingCapacity: { type: integer, minimum: 1, example: 22090 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocationInput:
      type: object
      required: [name, street, city, state, zip, seatingCapacity]
      description: |
        Feature 013: the address is sent as four fields and checked with the address service.
        `address` is not accepted; the Backend builds it.

        `street`, `city`, `state`, and `zip` are required: the Backend refuses a create without
        any of them with `400 VALIDATION_FAILED`. Listed in `required` from 1.18.0 (#36; feature
        013 research R11 left them out until the Admin app sent them).
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: Rejected when empty or whitespace-only after trimming.,
          }
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: House number and street. Trimmed; rejected when empty.
          example: '430 W Vine St'
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; rejected when empty.
          example: Lexington
        state: { $ref: '#/components/schemas/UsState' }
        zip:
          type: string
          pattern: '^[0-9]{5}(-[0-9]{4})?$'
          description: 5 digits, or ZIP+4. The saved value is the address service's 5-digit ZIP.
          example: '40507'
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. Optional: the admin's explicit choice of the venue's time zone, used
            instead of the zone worked out from the address or state (`timeZoneSource: ADMIN`).
            Needed for an address saved anyway in a state with more than one zone
            (`400 TIME_ZONE_REQUIRED` otherwise). Feature 024: the Admin app always sends it.
        seatingCapacity:
          { type: integer, minimum: 1, description: Must be a positive whole number. }

    LocationUpdate:
      type: object
      minProperties: 1
      description: |
        Partial update; supply only the fields being changed. Feature 013: `street`, `city`,
        `state`, and `zip` are sent all together or not at all, and `acceptUnverifiedAddress`
        only with them (`400` otherwise).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        street: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { $ref: '#/components/schemas/UsState' }
        zip: { type: string, pattern: '^[0-9]{5}(-[0-9]{4})?$' }
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. The admin's explicit choice of the venue's time zone (`timeZoneSource:
            ADMIN`). A change of zone moves the venue's events to keep their local times, and is
            refused as described in `updateLocation`.
        seatingCapacity: { type: integer, minimum: 1 }

    AcceptUnverifiedAddress:
      type: boolean
      default: false
      description: |
        Feature 013 "save anyway", feature 024 "save even if unverified": save the address even
        if the address service cannot verify it. The Admin app sends it with every address
        (feature 024); feature 013's Admin app sent it after an `ADDRESS_NOT_FOUND` or
        `ADDRESS_AMBIGUOUS` refusal. The address service is still asked. With no match, several
        matches, or one match at a different ZIP code or house number, or (feature 024) when the
        service cannot be reached, does not answer within 5 seconds, or answers with an error, the
        venue is saved as sent (trimmed, runs of whitespace collapsed to one space, ZIP cut to 5
        digits) with `addressVerified: false`. With exactly one match that keeps the ZIP code and
        house number, it is saved verified, as without the flag.

    UsState:
      type: string
      description: A US state or the District of Columbia, by its two-letter postal code (feature 013).
      enum:
        [
          AL,
          AK,
          AZ,
          AR,
          CA,
          CO,
          CT,
          DE,
          DC,
          FL,
          GA,
          HI,
          ID,
          IL,
          IN,
          IA,
          KS,
          KY,
          LA,
          ME,
          MD,
          MA,
          MI,
          MN,
          MS,
          MO,
          MT,
          NE,
          NV,
          NH,
          NJ,
          NM,
          NY,
          NC,
          ND,
          OH,
          OK,
          OR,
          PA,
          RI,
          SC,
          SD,
          TN,
          TX,
          UT,
          VT,
          VA,
          WA,
          WV,
          WI,
          WY,
        ]

    UsTimeZone:
      type: string
      description: |
        Feature 020. A venue's time zone, by its IANA name: Eastern (`America/New_York`), Central
        (`America/Chicago`), Mountain (`America/Denver`), Arizona, Mountain without daylight saving
        (`America/Phoenix`), Pacific (`America/Los_Angeles`), Alaska (`America/Anchorage`),
        Hawaii-Aleutian (`America/Adak`), and Hawaii (`Pacific/Honolulu`).
      enum:
        [
          America/New_York,
          America/Chicago,
          America/Denver,
          America/Phoenix,
          America/Los_Angeles,
          America/Anchorage,
          America/Adak,
          Pacific/Honolulu,
        ]
      example: America/New_York

    TimeZoneSource:
      type: string
      description: |
        Feature 020. How a venue's `timeZone` was set: `ADDRESS`, worked out from the place the
        address service matched; `STATE`, from the venue's state, which has one zone; `ADMIN`,
        chosen by an admin; `DEFAULT`, `America/New_York` by default: a venue that existed before
        feature 020, or a demo-data venue saved while the address service was unavailable.
      enum: [ADDRESS, STATE, ADMIN, DEFAULT]

    Event:
      type: object
      required:
        [
          id,
          name,
          locationId,
          location,
          startsAt,
          endsAt,
          doorsOpenAt,
          entryOpensAt,
          totalTicketCapacity,
          basePrice,
          status,
          cancelledAt,
          reservedSeating,
          layoutId,
          priceMax,
          checkInDetailsRemovedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: Season Opener }
        reservedSeating:
          type: boolean
          description: |
            Feature 007. Whether customers choose seats. Feature 038: `true` exactly when
            `layoutId` is set.
        layoutId:
          type: [string, 'null']
          format: uuid
          description: |
            Feature 038. The venue layout the event's seats come from; `null` for general
            admission.
        priceMax:
          type: [string, 'null']
          pattern: '^\d+\.\d{2}$'
          description: |
            Feature 038. For a seated event, the highest price of a level with seats on sale
            (`basePrice` is the lowest), so its price shows as a range; `null` for general
            admission.
          example: '95.00'
        status:
          type: string
          enum: [SCHEDULED, CANCELLED]
          description: Feature 005. A cancelled event stays on record but is read-only.
        cancelledAt:
          type: [string, 'null']
          format: date-time
          description: When the event was cancelled; `null` while scheduled.
        locationId: { type: string, format: uuid }
        location:
          allOf: [{ $ref: '#/components/schemas/Location' }]
          description: The venue, embedded so lists need no second request.
        startsAt: { type: string, format: date-time, example: '2026-10-01T18:00:00-04:00' }
        endsAt: { type: string, format: date-time, example: '2026-10-01T21:00:00-04:00' }
        doorsOpenAt:
          type: string
          format: date-time
          example: '2026-10-01T17:00:00-04:00'
          description: |
            Feature 025. When the venue's doors open: from 6 hours before `startsAt` to `startsAt`.
            Events from before feature 025 have `startsAt` minus 1 hour. Required from 1.18.1.
            Clients of an older Backend treat a missing value as not known and show nothing for it.
        entryOpensAt:
          type: string
          format: date-time
          example: '2026-10-01T16:00:00-04:00'
          description: |
            Feature 025. When gate check-in opens: 1 hour before `doorsOpenAt`. Tickets can be
            admitted in `[entryOpensAt, endsAt)`. Worked out by the Backend, never sent to it.
            Required from 1.18.1. The Ticket Booth app treats a missing value (an older Backend)
            as already open.
        totalTicketCapacity: { type: integer, minimum: 1, example: 18000 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          example: 8
          description: |
            Feature 016. The most valid tickets one customer may hold for this event, across all
            their orders; `null` for no limit. Never more than `totalTicketCapacity`. Always sent
            once 016 is implemented; not listed as required so this contract can merge ahead of
            the implementation with the suite green. Clients treat a missing value as `null`.
        images:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/EventImage' }
          description: |
            Feature 014. The event's images in order, `position` 1 (the cover) first; empty when it
            has none. Metadata only: load each image's content with `getEventImage`. Always sent
            once 014 is implemented; not listed as required so this contract can merge ahead of the
            implementation with the suite green. Clients treat a missing value as empty.
        basePrice:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number, so no client loses precision.
          example: '45.00'
        checkInDetailsRemovedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Feature 032. When the Backend removed the check-in details of this event's tickets, at
            or after `endsAt` plus 7 days; `null` until then. Required from 1.24.0 once implemented
            (feature 032's implementation); clients of an older Backend treat a missing value as
            `null`.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventInput:
      type: object
      required: [name, locationId, startsAt, endsAt, basePrice]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId:
          {
            type: string,
            format: uuid,
            description: Must reference an existing venue; otherwise 404.,
          }
        startsAt:
          type: string
          format: date-time
          example: '2026-10-01T19:00:00-04:00'
          description: |
            Feature 020: the venue's local date and time with the venue's UTC offset at that time
            (`400 LOCAL_TIME_SKIPPED` or `400 UTC_OFFSET_MISMATCH` otherwise).
        endsAt:
          type: string
          format: date-time
          example: '2026-10-01T22:00:00-04:00'
          description: |
            Must be strictly after `startsAt`. Feature 020: stated like `startsAt`, in the venue's
            local time and offset.
        doorsOpenAt:
          type: string
          format: date-time
          example: '2026-10-01T18:00:00-04:00'
          description: |
            Feature 025. Optional; left out, `startsAt` minus 1 hour. Stated like `startsAt`, in
            the venue's local time and offset. From 6 hours before `startsAt` to `startsAt`, both
            allowed (`400 DOORS_OPEN_OUT_OF_RANGE` otherwise). The Admin app always sends it.
        totalTicketCapacity:
          type: integer
          minimum: 1
          description: |
            Must not exceed the venue's `seatingCapacity`. Feature 007: optional; when left out it
            is the venue's `seatingCapacity`.
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: |
            Feature 016. Optional; left out or `null` means no limit. Must not exceed the event's
            `totalTicketCapacity` (`400` otherwise).
        basePrice:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }
        tiers:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/EventTierInput' }
          description: |
            Feature 031. Optional. The event's ticket types, saved with it in one transaction, all
            or nothing (`createEvent`). Left out or empty, the event has none, as before. At most
            50, as many as a layout's sections. May be left out but not sent as `null` (`400`).
        layoutId:
          type: [string, 'null']
          format: uuid
          description: |
            Feature 038. One of the venue's layouts for reserved seating, or `null` for general
            admission. With a layout, `tiers` must be empty and `totalTicketCapacity` left out
            (`400`): the capacity is the seats on sale and `basePrice` the lowest level price, both
            set by the Backend (a `basePrice` sent is ignored). A layout of another venue is `400`.
            On `updateEvent`, changing or clearing it is refused while the event has valid tickets
            or live holds (`409 EVENT_HAS_ORDERS`), and replaces its `levelPrices` and `offSale`
            with those sent in the same request (none when not sent). Clearing it keeps the
            event's `totalTicketCapacity` and `basePrice` as they were unless sent, as general
            admission then types them. With `locationId` in the same request, the layout must be
            of the new venue; a venue change without `layoutId` clears the layout (refused, as
            above, while the event has sales). Left out on `updateEvent`, unchanged.
        levelPrices:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LevelPriceInput' }
          description: |
            Feature 038. With a layout: a price for every level of it that has seats on sale (`400
            VALIDATION_FAILED`, `details.field: levelPrices`, naming the levels without one), each
            level at most once, each a level of the layout (`400`). Replaces the event's prices; a
            ticket already sold keeps its price. Left out on `updateEvent`, unchanged.
        offSale:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/OffSaleSelector' }
          description: |
            Feature 038. With a layout: the seats this event does not sell, by whole section, row,
            or seat. Replaces the event's set (`[]` puts every seat on sale). A selector naming no
            seat of the layout is `400`; a sold or held seat is `409 SEAT_TAKEN` (`details.seats`);
            no seat left on sale is `400`; a `maxTicketsPerCustomer` above the seats on sale is
            `409 CAPACITY_EXCEEDED` with `details.field` `maxTicketsPerCustomer` when the limit
            was sent in the request, else `offSale`. Putting an event that has ticket types on a
            layout removes them by the rules of `tiers` (`409 TIER_HAS_ORDERS` when one has
            orders). Left out on `createEvent`, none; on `updateEvent`,
            unchanged.

    EventTierInput:
      type: object
      required: [name, price]
      description: |
        Feature 031. One ticket type in `createEvent`: the fields of `TicketTierInput`. Any other
        field is `400 VALIDATION_FAILED`. Feature 038: only for general admission; with a
        `layoutId`, `tiers` must be empty.
        Feature 035: optional `id` (a UUID) is allowed only on `updateEvent`, where it names an
        existing ticket type of that event to keep and update. On `createEvent` it is
        `400 VALIDATION_FAILED` (`tiers.<i>.id`). Not `null`.
      properties:
        id:
          type: string
          format: uuid
          description: |
            Feature 035. Optional. On `updateEvent`, the id of an existing ticket type of this
            event. On `createEvent`, refused. Left out, the type is created. Not `null`.
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: Trimmed; unique within the request ignoring case.,
          }
        price:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }
        quantity:
          type: integer
          minimum: 1
          description: |
            Required. The ticket types together may not exceed the event's
            `totalTicketCapacity`. Never `null`.
    EventUpdate:
      type: object
      minProperties: 1
      description: |
        Partial update; supply only the fields being changed. From 1.19.0 (#117), a field may be
        left out but not sent as `null` (`400 VALIDATION_FAILED` naming it, nothing changed),
        except `maxTicketsPerCustomer` (`null` clears the limit), `doorsOpenAt` (`null` counts
        as left out) and, feature 038, `layoutId` (`null` makes the event general admission).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId:
          type: string
          format: uuid
          description: |
            Feature 020: moving to a venue in a different time zone must also send `startsAt` and
            `endsAt`.
        startsAt:
          type: string
          format: date-time
          description: Feature 020. In the destination venue's local time and offset.
        endsAt:
          type: string
          format: date-time
          description: Feature 020. In the destination venue's local time and offset.
        doorsOpenAt:
          type: [string, 'null']
          format: date-time
          description: |
            Feature 025. In the destination venue's local time and offset; checked against the
            `startsAt` in force after the update. Left out while `startsAt` changes, it moves by
            the same amount. `null` counts as left out (feature 025 accepted it; listed in the type
            from 1.19.0, #117).
        totalTicketCapacity: { type: integer, minimum: 1 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: Feature 016. `null` clears the limit.
        basePrice: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        tiers:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/EventTierInput' }
          description: |
            Feature 035. Optional. The event's complete ticket types after this update, saved with
            the event and its reserved seating in one step, all or nothing. An entry with `id` is
            an existing type of this event; an entry without is created; an existing type left
            out is removed. Left out, ticket types and seating are not changed. At most 50. Not
            `null`.
        layoutId:
          type: [string, 'null']
          format: uuid
          description: |
            Feature 038. One of the venue's layouts for reserved seating, or `null` for general
            admission. With a layout, `tiers` must be empty and `totalTicketCapacity` left out
            (`400`): the capacity is the seats on sale and `basePrice` the lowest level price, both
            set by the Backend (a `basePrice` sent is ignored). A layout of another venue is `400`.
            On `updateEvent`, changing or clearing it is refused while the event has valid tickets
            or live holds (`409 EVENT_HAS_ORDERS`), and replaces its `levelPrices` and `offSale`
            with those sent in the same request (none when not sent). Clearing it keeps the
            event's `totalTicketCapacity` and `basePrice` as they were unless sent, as general
            admission then types them. With `locationId` in the same request, the layout must be
            of the new venue; a venue change without `layoutId` clears the layout (refused, as
            above, while the event has sales). Left out on `updateEvent`, unchanged.
        levelPrices:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LevelPriceInput' }
          description: |
            Feature 038. With a layout: a price for every level of it that has seats on sale (`400
            VALIDATION_FAILED`, `details.field: levelPrices`, naming the levels without one), each
            level at most once, each a level of the layout (`400`). Replaces the event's prices; a
            ticket already sold keeps its price. Left out on `updateEvent`, unchanged.
        offSale:
          type: array
          maxItems: 5000
          items: { $ref: '#/components/schemas/OffSaleSelector' }
          description: |
            Feature 038. With a layout: the seats this event does not sell, by whole section, row,
            or seat. Replaces the event's set (`[]` puts every seat on sale). A selector naming no
            seat of the layout is `400`; a sold or held seat is `409 SEAT_TAKEN` (`details.seats`);
            no seat left on sale is `400`; a `maxTicketsPerCustomer` above the seats on sale is
            `409 CAPACITY_EXCEEDED` with `details.field` `maxTicketsPerCustomer` when the limit
            was sent in the request, else `offSale`. Putting an event that has ticket types on a
            layout removes them by the rules of `tiers` (`409 TIER_HAS_ORDERS` when one has
            orders). Left out on `createEvent`, none; on `updateEvent`,
            unchanged.

    EventImage:
      description: |
        Feature 014. One picture of an event: what a client needs to load it from
        `getEventImage` and to order it, never its content.
      type: object
      required: [id, position, contentType, byteSize]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Never reused. An image's content never changes; a new picture is a new id.
        position:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the event's cover. An event's positions are always 1 to n, no gaps.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: Detected from the file's content when it was added.
        byteSize:
          type: integer
          minimum: 1
          maximum: 5242880
          description: The stored size in bytes, after metadata was removed.

    EventImageUpload:
      description: Feature 014. The `multipart/form-data` body of `uploadEventImage`.
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: |
            One JPEG, PNG, or WebP picture, at most 5,242,880 bytes, 16,384 pixels a side, and
            40,000,000 pixels. Its file name and declared type are ignored.

    EventImageOrder:
      description: Feature 014. Every image of the event, each once, in the new order.
      type: object
      required: [imageIds]
      additionalProperties: false
      properties:
        imageIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }

    TicketTier:
      description: One kind of ticket for an event, such as General or VIP (feature 004).
      type: object
      required: [id, eventId, name, price, quantity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, example: VIP }
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number.
          example: '120.00'
        quantity:
          type: integer
          minimum: 0
          example: 500
          description: |
            Typed for a general-admission event (feature 038: seated events have no tiers).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketTierInput:
      type: object
      required: [name, price]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: Trimmed; unique within the event ignoring case.,
          }
        price:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }
        quantity:
          type: integer
          minimum: 1
          description: |
            The event's tiers together may not exceed its `totalTicketCapacity`. Required without
            reserved seating; omitted with it (feature 007). Never `null` (`400`, from 1.19.0,
            #117).

    TicketTierUpdate:
      type: object
      minProperties: 1
      description: |
        Partial update; supply only the fields being changed. From 1.19.0 (#117), a field may be
        left out but not sent as `null` (`400 VALIDATION_FAILED` naming it, nothing changed).
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        quantity: { type: integer, minimum: 1 }

    Ticket:
      description: One seat. The code is unique and unguessable (feature 005).
      type: object
      required: [id, code, status, checkedInAt, seat, price, levelName]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$', example: 7KQ2M9XWAB4C }
        status: { type: string, enum: [VALID, VOID] }
        checkedInAt:
          type: [string, 'null']
          format: date-time
          description: |
            When the ticket was admitted; `null` while unused. Feature 032: also `null` once its
            event's check-in details have been removed (`checkInDetailsRemovedAt`), whether or not
            it was used.
        seat:
          description: Feature 007. The seat this ticket is for; `null` for general admission.
          oneOf:
            - $ref: '#/components/schemas/SeatLabel'
            - type: 'null'
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: |
            Feature 038. What this ticket cost: its seat's level price when bought, or its order's
            `unitPrice`.
          example: '60.00'
        levelName:
          type: [string, 'null']
          description: |
            Feature 038. The seat's price level as sold (for a ticket from before 038, its ticket
            type's name); `null` for general admission.
          example: Lower sideline

    Order:
      description: One customer's purchase for one event (feature 005).
      type: object
      required:
        [
          id,
          eventId,
          tierId,
          tierName,
          customerUsername,
          holderName,
          quantity,
          unitPrice,
          totalPrice,
          status,
          createdAt,
          refundedAt,
          tickets,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        tierId:
          type: [string, 'null']
          format: uuid
          description: '`null` for an event sold without tiers.'
        tierName: { type: [string, 'null'] }
        customerUsername: { type: string, example: customer1 }
        holderName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          example: Jordan Lee
          description: |
            Feature 017. The buyer's name, on every ticket of the order; `null` for orders placed
            before feature 017.
        quantity: { type: integer, minimum: 1, maximum: 10 }
        unitPrice:
          type: [string, 'null']
          pattern: '^\d+\.\d{2}$'
          example: '45.00'
          description: |
            The price of each ticket. Feature 038: `null` when the order's tickets have different
            prices (seats of several levels); each ticket's `price` says its own.
        totalPrice: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        status: { type: string, enum: [CONFIRMED, REFUNDED] }
        createdAt: { type: string, format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }

    OrderInput:
      type: object
      required: [quantity, holderName]
      properties:
        tierId:
          type: string
          format: uuid
          description: Required for an event with tiers; omitted for one without.
        quantity: { type: integer, minimum: 1, maximum: 10 }
        requestId:
          type: string
          format: uuid
          description: |
            Feature 006. A new random id for each confirmation the customer makes, reused only to
            repeat that same confirmation. Optional; see `createOrder`.
        seats:
          type: array
          minItems: 1
          maxItems: 10
          description: Feature 007. Required for reserved seating, one per ticket; see `createOrder`.
          items: { $ref: '#/components/schemas/SeatChoice' }
        holderName:
          type: string
          maxLength: 400
          example: Jordan Lee
          description: |
            Feature 017. The buyer's own name, for every ticket of the order; see `createOrder` for
            the rules. `maxLength` only bounds the request: the name itself is at most 100
            characters after trimming.

    MyOrder:
      description: One of the signed-in customer's orders, with a summary of its event (feature 006).
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [event]
          properties:
            event: { $ref: '#/components/schemas/OrderEvent' }

    OrderEvent:
      description: The parts of an event My tickets shows next to an order (feature 006).
      type: object
      required: [id, name, startsAt, endsAt, doorsOpenAt, status, checkInDetailsRemovedAt, location]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Season Opener }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        doorsOpenAt:
          type: string
          format: date-time
          description: |
            Feature 025. When the venue's doors open, as `Event.doorsOpenAt`, shown on My tickets
            and the printed ticket. Required from 1.18.1.
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        checkInDetailsRemovedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Feature 032. As `Event.checkInDetailsRemovedAt`. When set, My tickets shows the order's
            valid tickets as "Event over", with no entry code or printable ticket. Required from
            1.24.0 once implemented; clients of an older Backend treat a missing value as `null`.
        location:
          type: object
          required: [id, name, address, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: KFC Yum! Center }
            address:
              type: string
              minLength: 1
              maxLength: 500
              description: Feature 019. The venue's full one-line address, the same as its `Location.address`, for the customer's calendar entry.
              example: '1 ARENA PLAZA, LOUISVILLE, KY 40202'
            timeZone:
              allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
              description: |
                Feature 020. The venue's time zone, for showing the event's times. Required from
                1.14.0 (#88).

    Availability:
      description: |
        Tickets left for an event and its tiers, whether sales are closed (feature 006), and
        whether the event is in progress (feature 034). Valid tickets only. Guidance, not a
        reservation.
      type: object
      required: [eventId, ticketsLeft, salesClosed, inProgress, tiers]
      properties:
        eventId: { type: string, format: uuid }
        customerLimit:
          oneOf:
            - $ref: '#/components/schemas/CustomerLimit'
            - type: 'null'
          description: |
            Feature 016. The caller's standing against the event's `maxTicketsPerCustomer`;
            `null` when the event has no limit or the caller is not a customer. Always sent once
            016 is implemented; optional for the same reason as `Event.maxTicketsPerCustomer`.
            Clients treat a missing value as `null`.
        ticketsLeft:
          type: integer
          minimum: 0
          description: The event's ticket capacity minus its valid tickets.
        salesClosed:
          type: [string, 'null']
          enum: [CANCELLED, ENDED, null]
          description: |
            `null` while tickets can be ordered; otherwise why they cannot: `CANCELLED` for a
            cancelled event (whatever the time), else `ENDED` from the event's `endsAt` on
            (half-open; feature 034).
        inProgress:
          type: boolean
          description: |
            Feature 034. `true` from the event's `startsAt` until its `endsAt` (half-open: `false` at
            `endsAt` exactly), by the Backend's clock when it answers, the same clock as
            `salesClosed`; whatever the event's `status`. Always sent.
        tiers:
          type: array
          description: One entry per tier, in the order `listTicketTiers` returns; empty without tiers.
          items: { $ref: '#/components/schemas/TierAvailability' }

    CustomerLimit:
      type: object
      description: Feature 016. One customer's own standing against an event's limit.
      required: [limit, held, remaining]
      properties:
        limit: { type: integer, minimum: 1, description: The event's `maxTicketsPerCustomer`. }
        held:
          type: integer
          minimum: 0
          description: The caller's valid tickets for the event, across all their orders.
        remaining:
          type: integer
          minimum: 0
          description: |
            How many more the caller may get under the limit, `limit - held`, never below 0. Tickets
            left for the event may still be fewer.

    TierAvailability:
      type: object
      required: [tierId, ticketsLeft]
      properties:
        tierId: { type: string, format: uuid }
        ticketsLeft:
          type: integer
          minimum: 0
          description: The tier's quantity minus its valid tickets, never more than the event has left.

    SeatChoice:
      description: |
        A seat a customer chooses when ordering (feature 007). Feature 038: `row` is the row's
        number in its section (1 = front) and `seat` the seat's number in its row, as
        `getVenueMapSection` gives them; not their labels.
      type: object
      required: [sectionId, row, seat]
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }

    SeatLabel:
      description: |
        A sold seat, by its section's name when sold (feature 007). Feature 038: `row` and `seat`
        are numbers; show `rowLabel` and `seatLabel`, the labels when sold ("Row AA, Seat 101").
      type: object
      required: [section, row, seat, rowLabel, seatLabel]
      properties:
        section: { type: string, example: A }
        row: { type: integer, minimum: 1, example: 3 }
        seat: { type: integer, minimum: 1, example: 7 }
        rowLabel:
          type: string
          minLength: 1
          maxLength: 5
          description: Feature 038.
          example: F
        seatLabel:
          type: string
          minLength: 1
          maxLength: 5
          description: Feature 038.
          example: '7'

    SeatMapChange:
      description: Seats of one event that changed state, as sent by `streamSeatMap` (feature 015).
      type: object
      required: [eventId, seq, changes]
      properties:
        eventId: { type: string, format: uuid }
        seq:
          type: integer
          minimum: 1
          description: |
            Feature 038. The event's seat-change sequence number after this change: one more for
            each transaction that changed a seat, assigned under the event's lock. A change whose `seq` is not greater than
            the `seq` of the map or section it would apply to is already in it and is skipped.
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SeatStateChange' }

    SeatStateChange:
      description: One seat's new state. Never says who reserved or bought it (feature 015).
      type: object
      required: [sectionId, row, seat, state, from, levelId]
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/SeatState' }
        from:
          $ref: '#/components/schemas/SeatState'
          description: Feature 038. The state the seat left.
        levelId:
          type: string
          format: uuid
          description: Feature 038. The seat's price level.

    SeatState:
      type: string
      description: |
        A seat's state for one event: `reserved` is held by a customer (feature 015); `offSale` is
        not sold at this event (feature 038).
      enum: [open, reserved, sold, offSale]

    ReservedSeat:
      description: A seat in a reservation, by section id and by its section's name (feature 015).
      type: object
      required: [sectionId, section, row, seat, rowLabel, seatLabel, levelName, price]
      properties:
        sectionId: { type: string, format: uuid }
        section: { type: string, example: A }
        row: { type: integer, minimum: 1, example: 1 }
        seat: { type: integer, minimum: 1, example: 5 }
        rowLabel:
          type: string
          description: Feature 038.
          example: F
        seatLabel:
          type: string
          description: Feature 038.
          example: '7'
        levelName:
          type: string
          description: Feature 038. The seat's price level.
          example: Lower sideline
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: |
            Feature 038. The level's price now; the purchase is at the price when bought.
          example: '60.00'

    Reservation:
      description: |
        The caller's active hold on seats of one event, for 5 minutes (feature 015). It ends at
        `expiresAt` (exclusive) unless bought or released first; it is never extended.
      type: object
      required: [eventId, tierId, seats, createdAt, expiresAt, secondsLeft]
      properties:
        eventId: { type: string, format: uuid }
        tierId:
          type: [string, 'null']
          format: uuid
          description: Always `null` (feature 038; seated events have no ticket types).
        seats:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ReservedSeat' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Exactly 5 minutes after `createdAt`.
        secondsLeft:
          type: integer
          minimum: 0
          maximum: 300
          description: |
            Whole seconds until `expiresAt`, by the Backend's clock when it answered. Clients count
            down from this, not from `expiresAt`, so their own clock can't skew it.

    ReservationInput:
      type: object
      required: [seats]
      additionalProperties: false
      properties:
        seats:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/SeatChoice' }

    ReservationRelease:
      type: object
      additionalProperties: false
      properties:
        seats:
          type: array
          minItems: 1
          maxItems: 10
          description: The seats to release; omit to release all of them.
          items: { $ref: '#/components/schemas/SeatChoice' }

    ReservationReleaseResult:
      type: object
      required: [reservation]
      properties:
        reservation:
          oneOf:
            - $ref: '#/components/schemas/Reservation'
            - type: 'null'
          description: What is left; `null` once no seat is left.

    ReleasedSeats:
      type: object
      required: [released]
      properties:
        released:
          type: integer
          minimum: 0
          description: How many reserved seats were released, across every event.

    LevelColor:
      type: string
      description: |
        Feature 038. One of the shared theme's 12 price-level colors; the apps draw it from the
        theme, so the look stays one (Constitution VII).
      enum: [violet, blue, cyan, teal, green, lime, yellow, orange, red, pink, purple, brown]

    FloorKind:
      type: string
      description: Feature 038. What is drawn on the floor of a layout.
      enum: [COURT, END_STAGE, CENTER_STAGE, RING, NONE]

    MapPoint:
      type: array
      description: Feature 038. `[x, y]` in the layout's map units; `y` grows downward.
      prefixItems: [{ type: number, minimum: 0 }, { type: number, minimum: 0 }]
      items: false
      minItems: 2
      maxItems: 2
      example: [205, 195]

    MapOutline:
      type: array
      description: Feature 038. A closed polygon, its points in order.
      minItems: 3
      maxItems: 64
      items: { $ref: '#/components/schemas/MapPoint' }

    MapSize:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, minimum: 1, maximum: 5000 }
        height: { type: integer, minimum: 1, maximum: 5000 }

    PriceLevel:
      description: Feature 038. A group of seats of a layout of similar desirability.
      type: object
      required: [id, name, rank, color, seatCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50, example: Lower sideline }
        rank: { type: integer, minimum: 1, maximum: 50, description: 1 is the most desirable. }
        color: { $ref: '#/components/schemas/LevelColor' }
        seatCount: { type: integer, minimum: 0 }

    LayoutSummary:
      description: Feature 038. One layout of a venue, as the venue page lists it.
      type: object
      required:
        [
          id,
          locationId,
          name,
          source,
          floorKind,
          seatCount,
          sectionCount,
          levelCount,
          eventsUsing,
          locked,
        ]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50, example: Basketball }
        source:
          type: string
          enum: [FILE, LINES]
          description: Imported from a file, or made from section lines (only these take lines).
        floorKind: { $ref: '#/components/schemas/FloorKind' }
        seatCount:
          type: integer
          minimum: 1
          example: 22090
          description: |
            At most 30,000 for a layout imported or made from lines; a layout carried over from
            before 038 ("Standard") may have more, up to the old limits (50 × 100 × 200).
        sectionCount: { type: integer, minimum: 1, example: 54 }
        levelCount: { type: integer, minimum: 1, example: 4 }
        eventsUsing:
          type: integer
          minimum: 0
          description: Scheduled events using it.
        locked:
          type: boolean
          description: |
            Used by a scheduled event that has valid tickets or live holds: it cannot be changed
            or deleted, only duplicated.

    LayoutDetail:
      description: Feature 038. A layout's map without its seats.
      allOf:
        - $ref: '#/components/schemas/LayoutSummary'
        - type: object
          required: [size, floorOutline, levels, sections, latestPrices]
          properties:
            size: { $ref: '#/components/schemas/MapSize' }
            floorOutline:
              oneOf:
                - $ref: '#/components/schemas/MapOutline'
                - type: 'null'
              description: '`null` with `floorKind: NONE`.'
            levels:
              type: array
              description: By rank.
              items: { $ref: '#/components/schemas/PriceLevel' }
            sections:
              type: array
              description: In drawing order.
              items: { $ref: '#/components/schemas/LayoutSectionSummary' }
            latestPrices:
              oneOf:
                - $ref: '#/components/schemas/LatestPrices'
                - type: 'null'

    LayoutSectionSummary:
      type: object
      required: [id, name, levelId, outline, labelAt, rowCount, seatCount, levelIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50, example: '104' }
        levelId:
          type: string
          format: uuid
          description: The section's own level, for rows and seats without one.
        outline: { $ref: '#/components/schemas/MapOutline' }
        labelAt: { $ref: '#/components/schemas/MapPoint' }
        rowCount: { type: integer, minimum: 1, maximum: 100 }
        seatCount: { type: integer, minimum: 1 }
        levelIds:
          type: array
          description: Every level its seats are in, by rank.
          items: { type: string, format: uuid }

    LatestPrices:
      description: Feature 038. The level prices of the most recently created scheduled event on a layout.
      type: object
      required: [eventId, eventName, startsAt, prices]
      properties:
        eventId: { type: string, format: uuid }
        eventName: { type: string }
        startsAt: { type: string, format: date-time }
        prices:
          type: array
          items: { $ref: '#/components/schemas/LevelPriceInput' }

    LayoutSectionSeats:
      description: Feature 038. One section of a layout, seat by seat.
      type: object
      required: [layoutId, sectionId, name, rows]
      properties:
        layoutId: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        name: { type: string }
        rows:
          type: array
          description: Front first.
          items:
            type: object
            required: [number, label, seats]
            properties:
              number: { type: integer, minimum: 1, maximum: 100 }
              label: { type: string, minLength: 1, maxLength: 5, example: F }
              seats:
                type: array
                items: { $ref: '#/components/schemas/LayoutSeat' }

    LayoutSeat:
      type: object
      required: [number, label, at, levelId, accessible]
      properties:
        number: { type: integer, minimum: 1, maximum: 200 }
        label: { type: string, minLength: 1, maxLength: 5, example: '7' }
        at: { $ref: '#/components/schemas/MapPoint' }
        levelId:
          type: string
          format: uuid
          description: Its level, resolved (its own, else its row's, else its section's).
        accessible:
          type: boolean
          description: Marked accessible; no other behavior yet (#57).

    LayoutLinesInput:
      description: |
        Feature 038. A layout made from section lines (`createVenueLayout`). Names are trimmed.
      type: object
      required: [name, levels, sections]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        levels:
          type: array
          minItems: 1
          maxItems: 12
          description: In rank order; names unique ignoring case.
          items: { $ref: '#/components/schemas/LayoutLevelLine' }
        sections:
          type: array
          minItems: 1
          maxItems: 100
          description: In drawing order; names unique ignoring case.
          items: { $ref: '#/components/schemas/LayoutSectionLine' }

    LayoutLevelLine:
      type: object
      required: [name, color]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { $ref: '#/components/schemas/LevelColor' }

    LayoutSectionLine:
      type: object
      required: [name, rows, seatsPerRow, level]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        rows: { type: integer, minimum: 1, maximum: 100 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 200 }
        level: { type: string, minLength: 1, maxLength: 50, description: A name in `levels`. }

    LayoutUpdate:
      description: |
        Feature 038. `name` alone renames; `levels` and `sections` together replace a
        `LINES` layout's lines.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        levels:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            At most 12, or, for a carried-over layout with more, at most as many as it has now
            (`400` otherwise).
          items: { $ref: '#/components/schemas/LayoutLevelLine' }
        sections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/LayoutSectionLine' }

    LayoutDuplicate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }

    LayoutImport:
      type: object
      required: [file]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Used in place of the file's `name`.
        file: { $ref: '#/components/schemas/LayoutFile' }

    LayoutFile:
      description: |
        Feature 038. A venue layout as data, format 1. At most 100 sections, 100 rows a section,
        200 seats a row, 30,000 seats, 12 levels. Every place is inside `size`.
      type: object
      required: [format, name, floor, size, levels, sections]
      properties:
        format: { type: integer, enum: [1] }
        name: { type: string, minLength: 1, maxLength: 50 }
        floor:
          type: object
          required: [kind]
          properties:
            kind: { $ref: '#/components/schemas/FloorKind' }
            outline:
              $ref: '#/components/schemas/MapOutline'
              description: Required unless `kind` is `NONE`.
        size: { $ref: '#/components/schemas/MapSize' }
        levels:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            required: [key, name, rank, color]
            properties:
              key:
                type: string
                pattern: '^[a-z0-9-]{1,30}$'
                description: How sections, rows and seats of this file name the level.
              name: { type: string, minLength: 1, maxLength: 50 }
              rank: { type: integer, minimum: 1, maximum: 12 }
              color: { $ref: '#/components/schemas/LevelColor' }
        sections:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/LayoutFileSection' }

    LayoutFileSection:
      type: object
      required: [name, level, outline, rows]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        level: { type: string, description: A level `key`. }
        outline: { $ref: '#/components/schemas/MapOutline' }
        labelAt:
          $ref: '#/components/schemas/MapPoint'
          description: Where the name is drawn; left out, the outline's centroid.
        rows:
          type: array
          minItems: 1
          maxItems: 100
          description: Front first; the order gives each row its number.
          items:
            type: object
            required: [label, seats]
            properties:
              label: { type: string, minLength: 1, maxLength: 5 }
              level: { type: string, description: A level `key`, overriding the section's. }
              seats:
                oneOf:
                  - type: array
                    minItems: 1
                    maxItems: 200
                    description: Each seat, in order.
                    items: { $ref: '#/components/schemas/LayoutFileSeat' }
                  - $ref: '#/components/schemas/LayoutFileSeatRun'

    LayoutFileSeat:
      type: object
      required: [label, at]
      properties:
        label: { type: string, minLength: 1, maxLength: 5 }
        at: { $ref: '#/components/schemas/MapPoint' }
        level: { type: string, description: A level `key`, overriding the row's. }
        accessible: { type: boolean }

    LayoutFileSeatRun:
      description: |
        `count` seats labelled `first`, `first + 1`, … spaced evenly from `from` to `to`, along a
        curve through `bend` when given; in that order.
      type: object
      required: [first, count, from, to]
      properties:
        first: { type: integer, minimum: 1, maximum: 9999 }
        count: { type: integer, minimum: 1, maximum: 200 }
        from: { $ref: '#/components/schemas/MapPoint' }
        to: { $ref: '#/components/schemas/MapPoint' }
        bend: { $ref: '#/components/schemas/MapPoint' }

    LevelPriceInput:
      type: object
      required: [levelId, price]
      additionalProperties: false
      properties:
        levelId: { type: string, format: uuid }
        price:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: Non-negative decimal string in USD.
          example: '60.00'

    OffSaleSelector:
      description: |
        Feature 038. Seats not sold at one event: a whole section (`sectionId` alone), one row
        (with `row`), or one seat (with `row` and `seat`), by numbers as in `SeatChoice`.
      type: object
      required: [sectionId]
      additionalProperties: false
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1, description: Only with `row`. }

    EventSeating:
      description: Feature 038. An event's layout, prices and seats off sale (`getEventSeating`).
      type: object
      required: [eventId, layoutId, levels, offSale, seatsOnSale, seatsOffSale]
      properties:
        eventId: { type: string, format: uuid }
        layoutId: { type: [string, 'null'], format: uuid }
        levels:
          type: array
          items:
            type: object
            required: [levelId, name, rank, color, seatCount, seatsOnSale, price]
            properties:
              levelId: { type: string, format: uuid }
              name: { type: string }
              rank: { type: integer, minimum: 1 }
              color: { $ref: '#/components/schemas/LevelColor' }
              seatCount: { type: integer, minimum: 0 }
              seatsOnSale: { type: integer, minimum: 0 }
              price: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        offSale:
          type: array
          items: { $ref: '#/components/schemas/OffSaleSelector' }
        seatsOnSale: { type: integer, minimum: 0 }
        seatsOffSale: { type: integer, minimum: 0 }

    VenueMap:
      description: Feature 038. An event's venue map, by section (`getVenueMap`).
      type: object
      required:
        [eventId, seq, layoutId, layoutName, size, floorKind, floorOutline, levels, sections]
      properties:
        eventId: { type: string, format: uuid }
        seq:
          type: integer
          minimum: 0
          description: |
            The event's seat-change sequence number this map was read at. Apply only the
            `SeatMapChange`s with a greater `seq` to it.
        layoutId: { type: string, format: uuid }
        layoutName: { type: string }
        size: { $ref: '#/components/schemas/MapSize' }
        floorKind: { $ref: '#/components/schemas/FloorKind' }
        floorOutline:
          oneOf:
            - $ref: '#/components/schemas/MapOutline'
            - type: 'null'
        levels:
          type: array
          description: By rank.
          items:
            type: object
            required: [levelId, name, rank, color, price]
            properties:
              levelId: { type: string, format: uuid }
              name: { type: string }
              rank: { type: integer, minimum: 1 }
              color: { $ref: '#/components/schemas/LevelColor' }
              price:
                type: [string, 'null']
                pattern: '^\d+\.\d{2}$'
                description: This event's price; `null` when the level has no seats on sale.
        sections:
          type: array
          items:
            type: object
            required: [sectionId, name, outline, labelAt, counts]
            properties:
              sectionId: { type: string, format: uuid }
              name: { type: string }
              outline: { $ref: '#/components/schemas/MapOutline' }
              labelAt: { $ref: '#/components/schemas/MapPoint' }
              counts:
                type: array
                description: One entry per level the section has seats in.
                items: { $ref: '#/components/schemas/LevelSeatCounts' }

    LevelSeatCounts:
      type: object
      required: [levelId, open, reserved, sold, offSale]
      properties:
        levelId: { type: string, format: uuid }
        open: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        sold: { type: integer, minimum: 0 }
        offSale: { type: integer, minimum: 0 }

    VenueMapSection:
      description: Feature 038. One section of an event's venue map, seat by seat.
      type: object
      required: [eventId, seq, sectionId, name, rows]
      properties:
        eventId: { type: string, format: uuid }
        seq:
          type: integer
          minimum: 0
          description: |
            As `VenueMap.seq`: apply only the changes with a greater `seq` to this section.
        sectionId: { type: string, format: uuid }
        name: { type: string }
        rows:
          type: array
          description: Front first.
          items:
            type: object
            required: [number, label, seats]
            properties:
              number: { type: integer, minimum: 1 }
              label: { type: string, example: F }
              seats:
                type: array
                items:
                  type: object
                  required: [number, label, at, levelId, state, accessible]
                  properties:
                    number: { type: integer, minimum: 1 }
                    label: { type: string, example: '7' }
                    at: { $ref: '#/components/schemas/MapPoint' }
                    levelId: { type: string, format: uuid }
                    state: { $ref: '#/components/schemas/SeatState' }
                    accessible: { type: boolean }

    LevelSales:
      description: Feature 038. One price level's sales at a seated event.
      type: object
      required: [levelId, name, price, seatsOnSale, ticketsSold, revenue]
      properties:
        levelId:
          {
            type: [string, 'null'],
            format: uuid,
            description: '`null` once the level was deleted.',
          }
        name: { type: string }
        price: { type: [string, 'null'], pattern: '^\d+\.\d{2}$' }
        seatsOnSale: { type: integer, minimum: 0 }
        ticketsSold: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$' }

    Cancellation:
      type: object
      required: [event, ordersRefunded, ticketsVoided]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        ordersRefunded: { type: integer, minimum: 0 }
        ticketsVoided: { type: integer, minimum: 0 }

    TierSales:
      type: object
      required: [tierId, name, price, quantity, ticketsSold, revenue]
      properties:
        tierId: { type: string, format: uuid }
        name: { type: string }
        price: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        quantity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }

    EventSales:
      type: object
      required:
        [
          eventId,
          name,
          venueName,
          startsAt,
          timeZone,
          status,
          ticketCapacity,
          ticketsSold,
          checkedIn,
          checkInDetailsRemovedAt,
          revenue,
          tiers,
          levels,
        ]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        venueName: { type: string }
        startsAt: { type: string, format: date-time }
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. The venue's time zone, for showing `startsAt`. Required from 1.14.0
            (#88).
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        ticketCapacity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        checkedIn:
          type: integer
          minimum: 0
          description: |
            Valid tickets admitted at the gate; 0 for a cancelled event. Feature 032: once the
            event's check-in details have been removed, the count kept at that moment, so the
            figure does not change.
        checkInDetailsRemovedAt:
          type: [string, 'null']
          format: date-time
          description: |
            Feature 032. As `Event.checkInDetailsRemovedAt`. Required from 1.24.0 once implemented;
            clients of an older Backend treat a missing value as `null`.
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TierSales' }
        levels:
          type: array
          description: |
            Feature 038. A seated event's sales by price level (its `tiers` is empty); empty for
            general admission.
          items: { $ref: '#/components/schemas/LevelSales' }

    SalesReport:
      type: object
      required: [generatedAt, totals, events]
      properties:
        generatedAt: { type: string, format: date-time }
        totals:
          type: object
          required: [events, ticketCapacity, ticketsSold, checkedIn, revenue]
          properties:
            events: { type: integer, minimum: 0, description: Scheduled events. }
            ticketCapacity:
              { type: integer, minimum: 0, description: Capacity of scheduled events. }
            ticketsSold: { type: integer, minimum: 0 }
            checkedIn: { type: integer, minimum: 0 }
            revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventSales' }

    EntryLookupInput:
      description: Feature 017. A ticket code as typed or scanned.
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          example: 7kq2-m9xw-ab4c
          description: |
            A ticket code (letter case, spaces, and dashes are ignored), or, from feature 018, a
            live code from the Customer app (`QP1:<ticket id, 32 hex digits>:<window>:<MAC>`).

    EntryTicket:
      description: Feature 017. A ticket as the gate agent sees it, and what they may do with it.
      type: object
      required:
        [
          ticketId,
          code,
          orderId,
          state,
          event,
          tierName,
          levelName,
          seat,
          holderName,
          usedAt,
          entryOpensAt,
          unusedOnOrder,
          verifiedBy,
        ]
      properties:
        ticketId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$' }
        orderId: { type: string, format: uuid }
        state:
          type: string
          enum: [ADMITTABLE, USED, VOID, OTHER_EVENT, NOT_OPEN, ENDED]
        event:
          description: The ticket's own event (another event's when `state` is `OTHER_EVENT`).
          type: object
          required: [id, name, startsAt, endsAt, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Season Opener }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timeZone:
              allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
              description: |
                Feature 020. The event's venue's time zone, for showing its times, `usedAt`, and
                `entryOpensAt`. Required from 1.14.0 (#88).
        tierName:
          type: [string, 'null']
          description: '`null` for an event sold at its base price.'
        levelName:
          type: [string, 'null']
          description: |
            Feature 038. The seat's price level as sold; `null` for general admission.
        seat:
          oneOf:
            - $ref: '#/components/schemas/SeatLabel'
            - type: 'null'
        holderName:
          type: [string, 'null']
          description: '`null` for a ticket bought before feature 017 ("No name on ticket").'
        usedAt:
          type: [string, 'null']
          format: date-time
          description: When it was admitted; `null` unless `state` is `USED`.
        entryOpensAt:
          type: string
          format: date-time
          description: |
            1 hour before the ticket's event's `doorsOpenAt` (feature 025; until then, 2 hours
            before its start).
        unusedOnOrder:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Valid, unused tickets of this ticket's order for this event, this one included.
        verifiedBy:
          type: string
          enum: [LIVE_CODE, TICKET_CODE]
          description: |
            Feature 018. `LIVE_CODE` when the lookup was by a live code the Backend verified in
            its window: no ID check is needed. `TICKET_CODE` for a typed or printed code: the ID
            check is always needed.

    TicketEntryKey:
      description: Feature 018. A ticket's entry key and the Backend's time.
      type: object
      required: [ticketId, key, serverTime]
      properties:
        ticketId: { type: string, format: uuid }
        key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The ticket's 32-byte entry secret, base64url without padding.
        serverTime:
          type: string
          format: date-time
          description: The Backend's clock when it answered, with milliseconds.

    AdmitInput:
      description: Feature 017.
      type: object
      required: [ticketId, wholeOrder]
      properties:
        ticketId: { type: string, format: uuid }
        wholeOrder:
          type: boolean
          description: Also admit every other valid, unused ticket of the same order.

    EntryResult:
      description: Feature 017. What one admit request did.
      type: object
      required: [admitted, alreadyUsed]
      properties:
        admitted:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/EntryTicketRef' }
        alreadyUsed:
          description: Tickets of the order that were already used when `wholeOrder` arrived.
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/EntryTicketRef' }

    EntryTicketRef:
      description: Feature 017. One ticket and the time of its entry.
      type: object
      required: [ticketId, code, usedAt]
      properties:
        ticketId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$' }
        usedAt: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Every non-2xx response uses this shape. `code` is the stable machine-readable
        discriminator clients branch on; `message` is human-readable and may change.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION_FAILED
                - NOT_FOUND
                - SCHEDULING_CONFLICT
                - VENUE_HAS_EVENTS
                - CAPACITY_EXCEEDED
                - TIER_NAME_TAKEN
                - SOLD_OUT
                - EVENT_CANCELLED
                - EVENT_HAS_ORDERS
                - TIER_HAS_ORDERS
                - SALES_CLOSED
                - REQUEST_ID_REUSED
                - SEAT_TAKEN
                - LAYOUT_IN_USE
                - TICKET_LIMIT_REACHED
                - SEAT_COOLDOWN
                - RESERVATION_REQUIRED
                - LAYOUT_NAME_TAKEN
                - LAYOUT_FILE_INVALID
                - SEAT_OFF_SALE
                - ADDRESS_NOT_FOUND
                - ADDRESS_AMBIGUOUS
                - ADDRESS_SERVICE_UNAVAILABLE
                - IMAGE_LIMIT_REACHED
                - IMAGE_TOO_LARGE
                - IMAGE_TYPE_NOT_ALLOWED
                - IMAGES_CHANGED
                - IMAGE_DIMENSIONS_TOO_LARGE
                - HOLDER_NAME_INVALID
                - TICKET_NOT_FOUND
                - ENTRY_REFUSED
                - LIVE_CODE_INVALID
                - LIVE_CODE_EXPIRED
                - TIME_ZONE_REQUIRED
                - TIME_ZONE_HAS_ORDERS
                - EVENT_TIME_NOT_IN_ZONE
                - LOCAL_TIME_SKIPPED
                - UTC_OFFSET_MISMATCH
                - DOORS_OPEN_OUT_OF_RANGE
                - RATE_LIMITED
                - CHECK_IN_DETAILS_REMOVED
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    Unauthenticated:
      description: |
        No token, or the token is malformed, expired, signed by an unknown key, from another
        issuer, or for another audience. The message does not say which check failed.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: UNAUTHENTICATED
              message: A valid access token is required.

    Forbidden:
      description: The token is valid, but the caller lacks a role this operation requires.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: FORBIDDEN
              message: This action requires the queuepass-admin role.
              details:
                requiredRoles: [queuepass-admin]

    ValidationFailed:
      description: Request shape or field validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: Request validation failed.
              details:
                fields:
                  - endsAt must be later than startsAt
                  - seatingCapacity must be a positive whole number

    RequestTooLarge:
      description: |
        Feature 038. The request body is over its size limit (4 MB for `importVenueLayout`).
        Nothing was saved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: The request body is too large.

    LayoutFileRejected:
      description: |
        Feature 038. The request is malformed (`VALIDATION_FAILED`), or the layout file has
        problems (`LAYOUT_FILE_INVALID`): `details.problems` lists up to 50, each with its `path`
        in the request and a `message`; `details.more` is how many more there were.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: LAYOUT_FILE_INVALID
              message: The layout file has 2 problems; nothing was saved.
              details:
                problems:
                  - path: file.sections[12].rows[2].seats[6]
                    message: 'Section 104, row F: seat 7 appears twice'
                  - path: file.sections[30].level
                    message: 'Section 301: level "uper" is not in the file'
                more: 0

    EventTimeRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`, including, feature 020, an
        event time without a UTC offset or a date only), or, feature 020, an event time does not
        fit the venue's time zone: the local time is skipped by a daylight-saving
        change (`LOCAL_TIME_SKIPPED`), or it is stated with an offset other than the venue's at
        that local time (`UTC_OFFSET_MISMATCH`); `details.field` is `startsAt`, `endsAt`, or,
        feature 025, `doorsOpenAt`. Or, feature 025, the doors-open time is more than 6 hours
        before the start or after it (`DOORS_OPEN_OUT_OF_RANGE`, with `details.field`,
        `doorsOpenAt`, `startsAt`, `earliest`, `latest`, and `timeZone`). Nothing was saved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field failed validation
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - endsAt must be later than startsAt
            noUtcOffset:
              summary: Feature 020. An event time without a UTC offset
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - startsAt must include a UTC offset, for example 2026-10-01T19:00:00-04:00
            localTimeSkipped:
              summary: Feature 020. Clocks spring forward past this time at the venue
              value:
                error:
                  code: LOCAL_TIME_SKIPPED
                  message: "2:30 AM on Mar 14, 2027 doesn't exist in Eastern Time: clocks jump from 2:00 AM to 3:00 AM. Choose another time."
                  details:
                    field: startsAt
                    localTime: '2027-03-14T02:30'
                    timeZone: America/New_York
                    skippedFrom: '02:00'
                    skippedTo: '03:00'
            utcOffsetMismatch:
              summary: Feature 020. The time is stated in another zone than the venue's
              value:
                error:
                  code: UTC_OFFSET_MISMATCH
                  message: "startsAt is stated with offset -07:00, but Freedom Hall is in Eastern Time, which is -04:00 at that time. Send the venue's local time with its offset."
                  details:
                    field: startsAt
                    localTime: '2026-10-01T19:00'
                    timeZone: America/New_York
                    sentOffset: '-07:00'
                    expectedOffsets: ['-04:00']
            doorsOpenOutOfRange:
              summary: Feature 025. Doors open more than 6 hours before the start
              value:
                error:
                  code: DOORS_OPEN_OUT_OF_RANGE
                  message: 'Doors must open no more than 6 hours before the start and not after it: between Nov 20, 2026, 1:00 PM EST and 7:00 PM EST.'
                  details:
                    field: doorsOpenAt
                    doorsOpenAt: '2026-11-20T17:30:00.000Z'
                    startsAt: '2026-11-21T00:00:00.000Z'
                    earliest: '2026-11-20T18:00:00.000Z'
                    latest: '2026-11-21T00:00:00.000Z'
                    timeZone: America/New_York
            tierFieldsFailed:
              summary: Feature 031. createEvent, ticket type fields failed validation
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - tiers.1.price must be a non-negative decimal string with at most 2 decimal places
                      - tiers.2.quantity must be a positive whole number
            unknownTierField:
              summary: Feature 031. createEvent, a field a ticket type does not have
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - tiers.0.property colour should not exist
            tierIdOnCreate:
              summary: Feature 035. createEvent, a ticket type sent with an id
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - tiers.0.id is not allowed when scheduling
            unknownTierIdOnUpdate:
              summary: Feature 035. updateEvent, a ticket type id that is not of this event
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - tiers.0.id is not a ticket type of this event
    OrderRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`), or, feature 017, the
        holder's name is missing or invalid (`HOLDER_NAME_INVALID`, with `details.reason`:
        `MISSING`, `TOO_LONG`, `NO_LETTER`, or `CONTROL_CHARACTER`; a name that is empty after
        trimming is `MISSING`). Nothing was recorded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field failed validation
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      - quantity must be between 1 and 10
            holderNameInvalid:
              summary: The holder's name has no letter
              value:
                error:
                  code: HOLDER_NAME_INVALID
                  message: The name on the tickets must contain at least one letter.
                  details:
                    reason: NO_LETTER

    AddressRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`), or, for a venue address
        (feature 013), the address service found no match (`ADDRESS_NOT_FOUND`), or more than one,
        or one match at a different ZIP code or house number than sent (`ADDRESS_AMBIGUOUS`, with
        up to 5 matches in `details.candidates`, each in the one-line form `STREET, CITY, ST ZIP`,
        or as the service returned it when it cannot be split). A match the Backend cannot split
        is reported as `ADDRESS_NOT_FOUND`. Nothing was saved.
        After either address refusal, the client may resend the same request with
        `acceptUnverifiedAddress: true` to save the venue as not verified.

        Feature 020: `TIME_ZONE_REQUIRED` when the zone cannot be worked out from the address and
        the state has more than one (`details.state`, `details.timeZones`); resend with `timeZone`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field is missing or malformed
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields: ['zip must be 5 digits, or 5 digits, a hyphen, and 4 digits']
            addressNotFound:
              summary: The address service found no such US address
              value:
                error:
                  code: ADDRESS_NOT_FOUND
                  message: "We couldn't find 1 Nowhere Blvd, Louisville, KY 40202 as a US address. Check the street, city, state, and ZIP code."
                  details:
                    address: '1 Nowhere Blvd, Louisville, KY 40202'
            addressAmbiguous:
              summary: The address matches more than one US address
              value:
                error:
                  code: ADDRESS_AMBIGUOUS
                  message: '100 Main St, Springfield, IL 62701 matches more than one US address. Enter one of these.'
                  details:
                    address: '100 Main St, Springfield, IL 62701'
                    candidates:
                      [
                        '100 N MAIN ST, SPRINGFIELD, IL 62701',
                        '100 S MAIN ST, SPRINGFIELD, IL 62701',
                      ]
            addressMoved:
              summary: The one match has a different ZIP code or house number than sent
              value:
                error:
                  code: ADDRESS_AMBIGUOUS
                  message: 'We found a different US address for 1540 University Dr, Lexington, KY 40508. Did you mean this one? Enter it to use it.'
                  details:
                    address: '1540 University Dr, Lexington, KY 40508'
                    candidates: ['1540 UNIVERSITY CT, LEXINGTON, KY 40503']
            timeZoneRequired:
              summary: Feature 020. Saved anyway in a state with more than one time zone
              value:
                error:
                  code: TIME_ZONE_REQUIRED
                  message: "Kentucky has more than one time zone. Choose this venue's time zone: Eastern Time or Central Time."
                  details:
                    state: KY
                    timeZones: [America/New_York, America/Chicago]

    AddressServiceUnavailable:
      description: |
        Feature 013: the address service could not be reached, did not answer within 5 seconds,
        or answered with an error, so the address could not be verified. Nothing was saved. The
        same request may succeed later. Feature 024: returned only when the request did not send
        `acceptUnverifiedAddress: true`; with it, the venue is saved not verified.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: ADDRESS_SERVICE_UNAVAILABLE
              message: "We can't verify the address right now. Nothing was saved. Try again in a minute."

    ImageRejected:
      description: |
        Feature 014. The request's shape is wrong (`VALIDATION_FAILED`: no `file` part, other
        parts, or a malformed event id), or the picture is too large in pixels
        (`IMAGE_DIMENSIONS_TOO_LARGE`). Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: No file part
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields: ['Send exactly one file, in a part named file.']
            dimensionsTooLarge:
              summary: Too many pixels
              value:
                error:
                  code: IMAGE_DIMENSIONS_TOO_LARGE
                  message: This picture is 20000 × 20000 pixels. A picture can be at most 16,384 pixels on each side and 40 megapixels in all.
                  details:
                    width: 20000
                    height: 20000
                    maxSide: 16384
                    maxPixels: 40000000

    ImageTooLarge:
      description: Feature 014. The image is over 5 MB (5,242,880 bytes). Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TOO_LARGE
              message: An image can be at most 5 MB.
              details:
                maxBytes: 5242880

    ImageTypeNotAllowed:
      description: |
        Feature 014. The file's content is not a still JPEG, PNG, or WebP picture, whatever its name
        or declared type: another format, an animated PNG or WebP, or a file whose header cannot be
        read or whose segments or chunks run past the end of the file. Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TYPE_NOT_ALLOWED
              message: This file is not a JPG, PNG, or WebP picture.
              details:
                allowed: [image/jpeg, image/png, image/webp]

    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: NOT_FOUND
              message: No venue exists with id 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40.

    EntryNotFound:
      description: |
        Feature 017. The event does not exist (`NOT_FOUND`), or no ticket has this code or id
        (`TICKET_NOT_FOUND`). Feature 018: a live code QueuePass did not make, or that names no
        ticket (`LIVE_CODE_INVALID`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            ticketNotFound:
              value:
                error:
                  code: TICKET_NOT_FOUND
                  message: No ticket has the code 7KQ2M9XWAB4D.
            liveCodeInvalid:
              summary: Feature 018
              value:
                error:
                  code: LIVE_CODE_INVALID
                  message: This is not a valid QueuePass code.

    TooManyAttempts:
      description: |
        Feature 026. The caller's account is over its attempt allowance for this operation
        (`x-attempt-limit`): for `BUY`, 10 in any 60 seconds or 3 in any 5 seconds; for `HOLD`, 30
        in any 60 seconds or 10 in any 5 seconds (feature 033). Nothing was checked or
        done, and this refusal does not count as an attempt. `details.action` is `BUY` or `HOLD`;
        `details.retryAfterSeconds` (an integer, 1 to 60) is how long to wait, rounded up, and
        `Retry-After` carries the same number; after that wait, with no other attempt of the same
        kind between, the next attempt is not refused for the limit.
      headers:
        Retry-After:
          description: Seconds to wait; the same as `details.retryAfterSeconds`.
          schema: { type: integer, minimum: 1, maximum: 60, example: 3 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            holdLimited:
              summary: Too many seat-hold attempts in 5 seconds
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many tries. You can try again in 3 seconds.
                  details:
                    action: HOLD
                    retryAfterSeconds: 3
            buyLimited:
              summary: Too many buy attempts in a minute
              value:
                error:
                  code: RATE_LIMITED
                  message: Too many tries. You can try again in 47 seconds.
                  details:
                    action: BUY
                    retryAfterSeconds: 47

    Conflict:
      description: |
        The request violates a business rule; `code` says which. For `SCHEDULING_CONFLICT`,
        `details.conflictingEvent` names the event responsible. It is `null` only when a
        concurrent request won the race and the database constraint refused this write. Feature
        020: the message gives times in the venue's local time with the zone's abbreviation, the
        start with its date and the end with its date when it differs; for
        a venue's time-zone change, `details.event` names the second event of the pair.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            layoutNameTaken:
              summary: Feature 038. Another layout of the venue has this name
              value:
                error:
                  code: LAYOUT_NAME_TAKEN
                  message: KFC Yum! Center already has a layout named "Basketball".
                  details:
                    layoutId: 0b7f2a7e-3c55-4a63-9f1e-5e0c8b4d2a11
            layoutLocked:
              summary: Feature 038. A layout used by an event with sold or held seats
              value:
                error:
                  code: LAYOUT_IN_USE
                  message: 'Basketball is used by "Cardinals vs. Duke", which has sold or held seats. Duplicate it to make changes.'
                  details:
                    events:
                      - id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                        name: Cardinals vs. Duke
            seatOffSale:
              summary: Feature 038. A seat this event does not sell
              value:
                error:
                  code: SEAT_OFF_SALE
                  message: Section 301, Row A, Seat 1 is not on sale for this event.
                  details:
                    seats:
                      - { sectionId: 5b0d3c1e-8f2a-4c6b-9d1e-2a3b4c5d6e7f, row: 1, seat: 1 }
            checkInDetailsRemoved:
              summary: Feature 032. The event's check-in details were removed, so its times are fixed
              value:
                error:
                  code: CHECK_IN_DETAILS_REMOVED
                  message: The check-in details of Fall Concert were removed on Nov 9, 2026, so its times can no longer change.
                  details:
                    removedAt: '2026-11-10T03:00:00Z'
            entryRefusedUsed:
              summary: Feature 017. The ticket was already admitted
              value:
                error:
                  code: ENTRY_REFUSED
                  message: This ticket was already used.
                  details:
                    reason: USED
                    usedAt: '2026-10-24T19:42:10-04:00'
            entryRefusedNotOpen:
              summary: Feature 017. Entry has not opened yet
              value:
                error:
                  code: ENTRY_REFUSED
                  message: Entry has not opened for this event.
                  details:
                    reason: NOT_OPEN
                    entryOpensAt: '2026-10-24T17:00:00-04:00'
            schedulingConflict:
              summary: Venue already committed during this window
              value:
                error:
                  code: SCHEDULING_CONFLICT
