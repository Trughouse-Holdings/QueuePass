openapi: 3.1.0
info:
  title: QueuePass Backend API
  version: 2.0.0
  description: |
    The single, authoritative API contract for QueuePass (Constitution I). Every front end builds
    against this document. An endpoint is added or changed here, in a reviewed pull request,
    before it is implemented.

    **Authentication**: every operation except `getHealth` requires
    `Authorization: Bearer <access token>`, where the token is a JWT issued by one of the three app
    realms, one per front end (feature 028): `queuepass-admin-app`, `queuepass-customer-app` and
    `queuepass-booth-app`. The Backend checks its signature against that realm's own published
    keys, its issuer (`http://localhost:8080/realms/<realm>`), that its audience includes
    `queuepass-api`, and that it is not expired (30-second clock tolerance). A token from any other
    issuer, the retired realm `queuepass` included, fails. Any failure is `401 UNAUTHENTICATED`.

    **Authorization**: `x-required-roles` on each operation lists the Keycloak realm roles that
    may call it. An empty list means any signed-in user. Roles are read from the token's
    `realm_access.roles`, and from each realm only its app's role counts: `queuepass-admin` from
    `queuepass-admin-app`, `customer` from `queuepass-customer-app`, `gate-agent` from
    `queuepass-booth-app`; any other role in the token is ignored. A valid token without a listed
    role is `403 FORBIDDEN`. A test fails if the Backend's role checks differ from this document.

    **Authority**: this API is the only path to persistent state. No front end holds a database
    connection. Every business rule, including the scheduling conflict rule, is enforced here.

    **Times**: all timestamps are RFC 3339 with an explicit offset, stored as `timestamptz` and
    compared in UTC. Event windows are half-open, `[startsAt, endsAt)`.

    **Venue time zones** (feature 020): every venue has a `timeZone`, one of `UsTimeZone`.
    Responses send instants in UTC; clients show every event time in its venue's `timeZone`, with
    the zone's abbreviation. An event time sent to the API (`startsAt`, `endsAt`, and, feature 025,
    `doorsOpenAt`) states the venue's local time with the venue's UTC offset at that time; the Backend refuses a local time
    the venue's zone skips (`LOCAL_TIME_SKIPPED`) and a time stated with any other offset,
    including `Z` (`UTC_OFFSET_MISMATCH`). A local time the zone repeats (clocks fall back) is
    accepted with either of its two offsets, which says which occurrence is meant.

    **Doors open** (feature 025): every event has a `doorsOpenAt`, from 6 hours before `startsAt`
    to `startsAt`, both allowed (`400 DOORS_OPEN_OUT_OF_RANGE` otherwise), and an `entryOpensAt`,
    1 hour before `doorsOpenAt`. Tickets can be admitted at the gate in `[entryOpensAt, endsAt)`,
    by any kind of code. A caller that leaves `doorsOpenAt` out of `createEvent` gets 1 hour before
    the start; an `updateEvent` that moves the start without it keeps the same time before the
    start. The doors-open time takes no part in the venue's 60-minute scheduling rule.

    **Attempt limits** (feature 026): each customer account may have at most 10 attempts to buy
    (`createOrder`) handled in any 60 seconds and no more than 3 in any 5 seconds, and, separately,
    at most 30 attempts to hold seats (`reserveSeats`) in any 60 seconds and no more than 10 in any
    5 seconds (feature 033: the Customer app holds each seat as it is clicked). An operation that
    counts says which allowance in `x-attempt-limit` (`BUY` or `HOLD`). Every request to it from a
    signed-in customer counts once it is past the token and role checks, whatever its outcome
    (placed, held, refused for any other reason, malformed, or a repeated `requestId`); a request
    refused for the limit does not count. An attempt over an allowance is refused with `429
    RATE_LIMITED` before anything else is checked or done, with the wait in whole seconds in
    `details.retryAfterSeconds` and in the `Retry-After` header; after waiting that long, with no
    other attempt of that kind between, the next one is not refused for the limit. Browser clients
    read `details.retryAfterSeconds`: the CORS policy does not expose `Retry-After`. No caller or
    role is exempt; releasing seats and reading are never limited. The numbers are the Backend's
    configuration: buying `RATE_LIMIT_PER_MINUTE` and `RATE_LIMIT_PER_5_SECONDS` (defaults 10 and
    3), holding `RATE_LIMIT_HOLD_PER_MINUTE` and `RATE_LIMIT_HOLD_PER_5_SECONDS` (defaults 30 and
    10).

    **Check-in retention** (feature 032): a ticket's check-in details (when it was admitted, and
    which gate agent admitted it) are kept until its event's `endsAt` plus 7 days (7 × 24 hours,
    `CHECK_IN_RETENTION_DAYS`), half-open: at that instant they are due. Within about an hour after
    it, the Backend removes them from every ticket of the event, cancelled events included, and
    records on the event when it did so (`checkInDetailsRemovedAt`) and how many of its valid
    tickets had been admitted, which the sales report keeps as the event's `checkedIn`. From then
    on every ticket of that event has `checkedInAt: null`, and the event's times cannot change
    (`409 CHECK_IN_DETAILS_REMOVED`).

    **Sales window** (feature 034, in place of feature 006's close at the start): tickets for an
    event can be ordered (`createOrder`) and seats reserved (`reserveSeats`) until its `endsAt`,
    half-open: at `endsAt` exactly and after, both are refused with `409 SALES_CLOSED`. A cancelled
    event is refused with `409 EVENT_CANCELLED` first, at any time. `startsAt` plays no part in
    whether sales are open; from `startsAt` until `endsAt` the event is in progress
    (`Availability.inProgress`). Seat reservations still open at `endsAt` end then, within a few
    seconds, and their `expiresAt` is never shortened.

    **Errors**: every non-2xx response is an `ErrorEnvelope`. Branch on `error.code`, never on
    `error.message`. A JSON request body over its size limit (100 kB; 4 MB for
    `importVenueLayout`, feature 038) is refused before the route with `413 VALIDATION_FAILED`,
    and a body that is not JSON with `400 VALIDATION_FAILED`.

    **Planned operations**: an operation marked `x-planned: '<feature>'` is declared in that
    feature's spec and plan pull request, before its implementation (Constitution I), and the
    Backend does not serve it yet (`404`). The implementation removes the marker in the change
    that serves the route. A test fails if a marked operation is served, or an unmarked one is not.

    **Retired operations**: an operation or field marked `x-retired: '<feature>'` is still served
    as described, until that feature's implementation, which removes it from this document by
    applying, unchanged, the patch committed with the feature's spec
    (`specs/<feature>/contracts/step2.diff`, Constitution I), in the same change that stops serving
    it. Build nothing new on it. None is marked now.

    **Seat maps** (feature 038): a venue has any number of **layouts** (`listVenueLayouts`), each a
    map of sections placed in the building, rows with labels such as `A` or `AA`, seats with their
    own place, and 1 to 12 **price levels** (a layout carried over from before 038 may have one per
    section, up to 50). A seat's level is its own, else its row's, else its section's. A seated
    event uses one layout of its venue (`layoutId`), sets one price per level that has seats on
    sale (`levelPrices`), and may take seats **off sale** (`offSale`), all saved with the event by
    `createEvent` and `updateEvent`. Its capacity is its seats on sale and its `basePrice` the
    lowest level price; it has no ticket types. A seat is named in requests as before, `{sectionId,
    row, seat}`, where `row` is the row's number in its section (1 = front) and `seat` the seat's
    number in its row (1 = first drawn); responses add the labels people read (`rowLabel`,
    `seatLabel`). Map places are `[x, y]` in the layout's map units, `y` growing downward, as in SVG.

    **Live streams**: `streamSeatMap` answers with `text/event-stream` (Server-Sent Events). It is
    a plain HTTP `GET`. Each event's `data` is one JSON document, and `x-sse-events` on the
    operation maps each event name to its schema, so clients and tests take the payload types from
    this document. Send only the `Authorization` and `Accept` headers (the CORS policy allows
    `authorization` and `content-type`); the stream ends when the token expires.

servers:
  - url: http://localhost:3000
    description: Local docker compose

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health and identity (feature 001)
  - name: hello
    description: One greeting per front end, for the hello-world pages (feature 001)
  - name: venues
    description: |
      Venue catalog (feature 002). A venue is a `Location` in this API; the paths keep that name.
  - name: events
    description: Event scheduling with the 60-minute double-booking rule (feature 002)
  - name: tiers
    description: Ticket tiers per event (feature 004)
  - name: orders
    description: |
      Orders, tickets, attendee lists, and cancellation (feature 005); customer purchase,
      availability, and a customer's own orders (feature 006)
  - name: reports
    description: Sales reporting for admins (feature 005)
  - name: seating
    description: |
      Venue seating layouts, reserved seating per event, and seat maps (feature 007); seat
      reservations and live seat-map updates (feature 015); several layouts per venue, price
      levels, seats off sale, and the venue map (feature 038)
  - name: images
    description: Up to 5 images per event, shown to customers as a gallery (feature 014)
  - name: entry
    description: |
      Gate check-in in the Ticket Booth app: look a ticket up by its code, then admit it, or every
      unused ticket of its order, exactly once (feature 017); live codes that change every 30
      seconds, and the buyer's entry key that makes them (feature 018)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      description: Used by Compose health checks. The only operation that needs no token.
      operationId: getHealth
      security: []
      x-required-roles: public
      responses:
        '200':
          description: Service is up and the database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [up] }

  /me:
    get:
      tags: [system]
      summary: Who am I
      description: |
        Returns the caller's identity as read from the validated token (spec 001 FR-022). Nothing
        is looked up in a database.
      operationId: getMe
      x-required-roles: []
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/orders:
    get:
      tags: [orders]
      summary: My orders
      description: |
        Every order the signed-in customer has placed, newest first, each with its tickets and a
        summary of its event (feature 006). The customer is the token's subject; no parameter can
        name another customer. Orders made by the demo script belong to stand-in identities and
        never appear here.
      operationId: listMyOrders
      x-required-roles: [customer]
      responses:
        '200':
          description: The caller's orders, newest first; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/tickets/{ticketId}/entry-key:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [entry]
      summary: My ticket's entry key, for its live codes
      description: |
        Feature 018. The secret the Customer app makes this ticket's live codes with, and the
        Backend's current time, so the app can follow the Backend's clock rather than the
        device's. Only the ticket's own buyer gets it: another customer's ticket, or one that does
        not exist, is `404 NOT_FOUND`; an id that is not a UUID is `400 VALIDATION_FAILED`. A
        used or void ticket is `409 ENTRY_REFUSED` (`USED` with `usedAt`, or `VOID`). Sent with
        `Cache-Control: no-store`. The client keeps the key in memory only, never in browser
        storage, a cookie, or a URL.
      operationId: getTicketEntryKey
      x-required-roles: [customer]
      responses:
        '200':
          description: The key and the Backend's time.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEntryKey' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/reservations:
    get:
      tags: [seating]
      summary: My active seat reservations
      description: |
        The signed-in customer's active reservations, for every event, newest first (feature 015).
        A reservation is active from when it is made until it is bought, released, or ended, or its
        5 minutes run out (`expiresAt`, exclusive). The customer is the token's subject.

        Feature 033: the Customer app's cart is this list; nothing else is stored for it. Each entry
        is bought with one `createOrder` for its event, naming its seats.
      operationId: listMyReservations
      x-required-roles: [customer]
      responses:
        '200':
          description: The caller's active reservations; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/reservations/release:
    post:
      tags: [seating]
      summary: Release all my seat reservations
      description: |
        Releases every active reservation of the signed-in customer, for every event (feature
        015). The Customer app calls it when the customer logs out. Each released seat is open to
        others at once, and this customer can't reserve it again until 2 minutes after its
        reservation ended (feature 033). Safe to repeat.
        Feature 026: never limited and never counted toward the attempt limits.
      operationId: releaseAllMyReservations
      x-required-roles: [customer]
      responses:
        '200':
          description: How many seats were released; 0 when there was nothing to release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasedSeats' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/admin:
    get:
      tags: [hello]
      summary: Greeting for the Admin app
      operationId: getAdminHello
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: admin,
                  appName: QueuePass Admin,
                  username: admin1,
                  message: 'Hello, admin1! Welcome to QueuePass Admin.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/customer:
    get:
      tags: [hello]
      summary: Greeting for the Customer app
      operationId: getCustomerHello
      x-required-roles: [customer]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: customer,
                  appName: QueuePass,
                  username: customer1,
                  message: 'Hello, customer1! Welcome to QueuePass.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/booth:
    get:
      tags: [hello]
      summary: Greeting for the Ticket Booth app
      operationId: getBoothHello
      x-required-roles: [gate-agent]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: booth,
                  appName: QueuePass Ticket Booth,
                  username: agent1,
                  message: 'Hello, agent1! Welcome to QueuePass Ticket Booth.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /locations:
    get:
      tags: [venues]
      summary: List all venues
      description: |
        Ordered by name, A to Z. The Customer app (feature 003) relies on this order. Optional
        `q` filter (feature 004), used by the Admin app's venue search.
      operationId: listLocations
      x-required-roles: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only venues whose name or address contains this text, ignoring case and
            surrounding spaces. Blank means no filter.
      responses:
        '200':
          description: Matching venues, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [venues]
      summary: Create a venue
      description: |
        Rejects an empty name, a missing or malformed address field, and a non-positive capacity
        (`400 VALIDATION_FAILED`).

        Feature 013: the address (`street`, `city`, `state`, `zip`) is then checked with the
        address service (the US Census Geocoder) before anything is saved. Exactly one match
        that keeps the sent ZIP code (first 5 digits) and house number is accepted, and the venue
        is saved with the service's standard form of the four fields and `addressVerified: true`;
        `address` is built from them as `STREET, CITY, ST ZIP`. From 1.18.0 (#36), a house
        number with one hyphen equals the same digits without it (Queens: `10724` keeps
        `107-24`), and a suite or unit sent at the end of `street` that the service leaves out
        is kept at the end of the saved
        `street` (`430 W Vine St Ste 2` is saved as `430 W VINE ST STE 2`).

        From 1.20.0 (#25), when the address service vouches for no match, OpenStreetMap may
        still verify the address. The venue is then saved with the four fields as sent (trimmed,
        runs of whitespace collapsed to one space, ZIP cut to 5 digits) and
        `addressVerified: true`. OpenStreetMap is searched at the sent street, where a place
        counts when it is in the sent state and ZIP code and has the sent house number; then by
        the venue's `name` in the sent city and state, where a place counts when it has that
        name, is not a road, town, or area, is in the sent state and ZIP code, and has the sent
        house number or none on the map. The refusals below apply only when neither search
        verifies the address. OpenStreetMap is asked only after the address service answered,
        and it being unreachable is never `503`: it then finds nothing. No match is
        `400 ADDRESS_NOT_FOUND`; several matches, or one match at a different ZIP code or house
        number, are `400 ADDRESS_AMBIGUOUS`, listing them.

        Save even if unverified: with `acceptUnverifiedAddress: true`, no match, several matches,
        or one match at a different ZIP code or house number instead save the venue with the four
        fields as sent (trimmed, runs of whitespace collapsed to one space, ZIP cut to 5 digits)
        and `addressVerified: false`. Feature 024: so does an address service that cannot be
        reached, does not answer within 5 seconds, or answers with an error. The address service
        is still asked first, and the flag changes nothing when it finds exactly one match that
        keeps the ZIP code and house number. The Admin app sends the flag with every address
        (feature 024).

        Without `acceptUnverifiedAddress`, when the service cannot be reached, does not answer
        within 5 seconds, or answers with an error, the save is refused with
        `503 ADDRESS_SERVICE_UNAVAILABLE` and nothing is saved.

        Feature 020: the venue's `timeZone` is decided after the address, in this order: the
        `timeZone` sent (`timeZoneSource: ADMIN`); else, for a verified address, the zone at the
        place the address service matched (`ADDRESS`); else the zone of `state` when the state has
        one (`STATE`). In a state with more than one zone (AK, AZ, FL, ID, IN, KS, KY, MI, NE, NV,
        ND, OR, SD, TN, TX) the create is refused with `400 TIME_ZONE_REQUIRED`, listing the
        state's zones in `details.timeZones`, and nothing is saved; resend with `timeZone`.
        Feature 024: the Admin app always sends `timeZone`, the admin's pick; other callers may
        leave it out.
      operationId: createLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Venue created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [venues]
      summary: Retrieve one venue
      operationId: getLocation
      x-required-roles: []
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [venues]
      summary: Update a venue
      description: |
        Lowering `seatingCapacity` below the `totalTicketCapacity` of any event already
        scheduled at this venue is refused with `CAPACITY_EXCEEDED`. Feature 038: while the venue
        has layouts, its `seatingCapacity` is its largest layout's seats and cannot be set here
        (`400`).

        Feature 013: `street`, `city`, `state`, and `zip` are sent all together or not at all
        (`400`). When they are sent and differ from the stored ones (ignoring case and extra
        spaces), the address is checked exactly as in `createLocation`, after every other check
        on this request and before anything is saved, including `acceptUnverifiedAddress` (and,
        feature 024, its saving the address not verified when the service is unavailable). An
        edit without address fields never calls the address service. An edit with the same
        address never calls it for a verified venue, nor without `acceptUnverifiedAddress`, and
        keeps `addressVerified` as it is.
        From 1.18.0 (#36), whether the address is the same is decided again on the venue as stored
        when the change is written: an address another edit saved meanwhile that equals the one
        sent (ignoring case and extra spaces, as above) is left as it is, with its
        `addressVerified`; any other, including another spelling of the same place such as the
        service's standard form, is replaced (the later edit wins). `name` and `seatingCapacity` may be left out but never sent as `null` (`400`).
        `acceptUnverifiedAddress` without the four address fields is `400`. A venue saved before
        feature 013 keeps its `address`, has `null` parts, and has `addressVerified: false` until
        its address is changed.

        Feature 024: an edit that sends the same address with `acceptUnverifiedAddress: true`, for
        a venue whose address is not verified (its four fields set), checks it again, at the same
        point. Exactly one match that keeps the ZIP code and house number is saved in the
        service's standard form with `addressVerified: true`, unless the stored address changed
        while the check ran (then the address is left as it is now). Any other answer, the service
        being unavailable included, leaves the address as stored and not verified; it is never a
        refusal. Without the flag, the same address is never checked again.

        Feature 020: `timeZone`, when sent, becomes the venue's zone (`timeZoneSource: ADMIN`),
        also together with an address change. Otherwise, when the address is checked because it
        was sent and differs, the zone is decided again exactly as in `createLocation`, including
        `400 TIME_ZONE_REQUIRED`; feature 024's re-check of the same address never decides the
        zone. An edit that sends neither never changes the zone.

        When the zone changes, every event at the venue (scheduled or cancelled) keeps its local
        start and end date and time, and, feature 025, its local doors-open date and time, so its
        `startsAt`, `endsAt`, and `doorsOpenAt` move. The change is refused, and nothing is saved,
        with `409 TIME_ZONE_HAS_ORDERS` when any event at the venue has any order
        (`details.events`); with `409 EVENT_TIME_NOT_IN_ZONE` (`details.event`, `details.field`
        `startsAt`, `endsAt`, or `doorsOpenAt`, and `details.reason`) when one of an event's local
        times does not exist in the new zone (`SKIPPED`), happens twice there (`REPEATED`), or is a
        legacy time from before either zone adopted standard time, which no whole-minute offset can
        state (`OUT_OF_RANGE`, #88), or, feature 025, when its moved `doorsOpenAt` would be more than
        6 hours before its moved `startsAt`, or after it, because a daylight-saving change falls
        between them in one zone only (`DOORS_OUT_OF_RANGE`, `details.field` `doorsOpenAt`: the
        doors-open time exists in the new zone but breaks the doors-open range, unlike
        `OUT_OF_RANGE`, which is about the time itself); and with `409 SCHEDULING_CONFLICT` when the
        moved scheduled events would be closer than 60 minutes (`details.conflictingEvent` and
        `details.event`). All or nothing: the events and the venue change together.
      operationId: updateLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Venue updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }
        '409':
          description: |
            An existing event's ticket capacity exceeds the proposed seating capacity
            (`CAPACITY_EXCEEDED`); or, feature 020, the time zone cannot change
            (`TIME_ZONE_HAS_ORDERS`, `EVENT_TIME_NOT_IN_ZONE`, `SCHEDULING_CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                capacityExceeded:
                  summary: An event sells more tickets than the proposed seating capacity
                  value:
                    error:
                      code: CAPACITY_EXCEEDED
                      message: "Cannot reduce seating capacity to 500; event 'Season Opener' has a ticket capacity of 900."
                      details:
                        proposedSeatingCapacity: 500
                        conflictingEvent:
                          id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                          name: Season Opener
                          totalTicketCapacity: 900
                timeZoneHasOrders:
                  summary: Feature 020. Tickets were sold for one of the venue's events
                  value:
                    error:
                      code: TIME_ZONE_HAS_ORDERS
                      message: "Can't change the time zone of Freedom Hall: tickets have been sold for 1 of its events. No customer's ticket time may move."
                      details:
                        timeZone: America/New_York
                        proposedTimeZone: America/Chicago
                        eventCount: 1
                        events:
                          - id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                            name: Season Opener
                eventTimeNotInZone:
                  summary: Feature 020. An event's local time does not exist in the new zone
                  value:
                    error:
                      code: EVENT_TIME_NOT_IN_ZONE
                      message: "Can't change the time zone: Late Show's start, Mar 14, 2027, 2:30 AM, doesn't exist in Mountain Time."
                      details:
                        event:
                          id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                          name: Late Show
                        field: startsAt
                        localTime: '2027-03-14T02:30'
                        proposedTimeZone: America/Denver
                        reason: SKIPPED
    delete:
      tags: [venues]
      summary: Delete a venue
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first.

        Refused with `409 VENUE_HAS_EVENTS` while any event is scheduled at this venue. The
        service counts the events so the message and `details.eventCount` are specific; the
        database's `ON DELETE RESTRICT` is the guarantee, so no client can orphan events. If an
        event is added concurrently, the database refuses and `eventCount` is omitted.
      operationId: deleteLocation
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Venue deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Events are still scheduled at this venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueHasEvents' }
              example:
                error:
                  code: VENUE_HAS_EVENTS
                  message: 'Cannot delete "Freedom Hall": 3 events are still scheduled there. Delete or move them first.'
                  details:
                    eventCount: 3

  /locations/{id}/layouts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The venue.
    get:
      tags: [seating]
      summary: A venue's seating layouts
      description: |
        Feature 038. Every layout of the venue, ordered by name ignoring case, each with its counts
        and how many scheduled events use it; empty when it has none. Any signed-in user may read
        it: a layout is the venue's public map.
      operationId: listVenueLayouts
      x-required-roles: []
      responses:
        '200':
          description: The venue's layouts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LayoutSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [seating]
      summary: Make a layout from section lines
      description: |
        Feature 038. A plain layout: its levels in rank order (the first is rank 1), and section
        lines of rows × seats per row, each in one level named in `levels`. Sections are
        rectangles placed in a grid of `ceil(√n)` columns in line order; rows are labelled `1`,
        `2`, … front first and seats `1`, `2`, … ; `floorKind` is `NONE`; `source` is `LINES`.

        Refused: a name another layout of the venue has, ignoring case (`409
        LAYOUT_NAME_TAKEN`); repeated section or level names ignoring case, a section's level not
        among `levels`, or more than 30,000 seats (`400 VALIDATION_FAILED`). Sets the venue's
        `seatingCapacity` to its largest layout's seats; refused when that would fall below the
        `totalTicketCapacity` of a scheduled general-admission event at the venue (`409
        CAPACITY_EXCEEDED`, naming it).
      operationId: createVenueLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutLinesInput' }
      responses:
        '201':
          description: The new layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /locations/{id}/layouts/import:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The venue.
    post:
      tags: [seating]
      summary: Import a layout file
      description: |
        Feature 038. Saves the layout a `LayoutFile` describes, all or nothing; `source` is
        `FILE`. `name`, when sent, is used in place of the file's `name`. The body may be up to
        4 MB (every other request keeps the default limit).

        The file is checked as a whole before anything is saved: its shape and every limit of
        `LayoutFile`, unique names and labels, levels named by their `key`, outlines and seats
        inside `size`. Any problem refuses it with `400 LAYOUT_FILE_INVALID`, listing up to 50
        problems in `details.problems`, each with the place in the file (`path`) and a message
        naming the section, row and seat. A name another layout of the venue has, ignoring case,
        is `409 LAYOUT_NAME_TAKEN`. The venue's capacity is set and checked as by
        `createVenueLayout`.
      operationId: importVenueLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutImport' }
      responses:
        '201':
          description: The imported layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDetail' }
        '400': { $ref: '#/components/responses/LayoutFileRejected' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /layouts/{layoutId}:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The layout.
    get:
      tags: [seating]
      summary: A layout's map, without its seats
      description: |
        Feature 038. The layout's size, floor object, levels, and each section's outline, label
        point and counts; seats come one section at a time from `getVenueLayoutSection`.
        `latestPrices` are the level prices of the most recently created scheduled event on this
        layout, for the Admin app to start a new event's price boxes from; `null` when none uses it.
      operationId: getVenueLayout
      x-required-roles: []
      responses:
        '200':
          description: The layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [seating]
      summary: Rename a layout, or replace its section lines
      description: |
        Feature 038. `name` renames it. `levels` and `sections`, sent together and only for a
        layout made from lines (`source: LINES`; otherwise `400`), replace its lines as
        `createVenueLayout` makes them, keeping the id of every level, section, row and seat whose
        name or label is unchanged, so events on it keep their prices and seats off sale for
        those; what is gone is deleted with its prices and off-sale entries.

        Refused while the layout is `locked`, that is used by a scheduled event that has valid
        tickets or live holds (`409 LAYOUT_IN_USE`, `details.events`). Name and capacity rules as
        `createVenueLayout`. Viewers of events that use it reload (`streamSeatMap` ends).

        For every scheduled event using the layout, a lines edit puts **new** seats off sale for
        that event and recomputes its `totalTicketCapacity`, `basePrice` and `priceMax`. It is
        refused (`409 LAYOUT_IN_USE`, `details.events`, the message saying why for each) when an
        event would then have on-sale seats in a level it has no price for, no seat on sale, or a
        `maxTicketsPerCustomer` above its seats on sale.
      operationId: updateVenueLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutUpdate' }
      responses:
        '200':
          description: The updated layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [seating]
      summary: Delete a layout
      description: |
        Feature 038. Refused while any event uses it, a cancelled or past one included, since its
        tickets keep their seats (`409 LAYOUT_IN_USE`, `details.events`); duplicate it instead. The
        venue's `seatingCapacity` becomes its largest remaining layout's seats, refused when that
        would fall below the `totalTicketCapacity` of a scheduled general-admission event at the
        venue (`409 CAPACITY_EXCEEDED`, naming it); after its last layout it keeps its last value,
        typed with `updateLocation` again.
      operationId: deleteVenueLayout
      x-required-roles: [queuepass-admin]
      responses:
        '204': { description: Layout deleted. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /layouts/{layoutId}/sections/{sectionId}:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The layout.
      - name: sectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: A section of the layout (`404` otherwise).
    get:
      tags: [seating]
      summary: One section's rows and seats
      description: |
        Feature 038. The section's rows front first, each with its seats in order, each seat with
        its label, place, level (its own, else its row's, else its section's) and accessible mark.
      operationId: getVenueLayoutSection
      x-required-roles: []
      responses:
        '200':
          description: The section's seats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutSectionSeats' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /layouts/{layoutId}/duplicate:
    parameters:
      - name: layoutId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The layout to copy.
    post:
      tags: [seating]
      summary: Duplicate a layout
      description: |
        Feature 038. A copy at the same venue with new ids throughout, used by no event, so it can
        be changed. Always allowed, locked or not. Without `name`, it is named "<name> (copy)",
        then "(copy 2)", … , whichever is free; a `name` another layout has is `409
        LAYOUT_NAME_TAKEN`.
      operationId: duplicateVenueLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutDuplicate' }
      responses:
        '201':
          description: The copy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events:
    get:
      tags: [events]
      summary: List all events
      description: |
        Each event embeds its venue. Ordered by `startsAt`, soonest first; the Customer app
        (feature 003) relies on this order. Optional filters, combinable: `locationId` (used by the
        Admin app's venue page), and `q`, `from`, `to` (feature 004, the Admin app's event search).

        Feature 020: `fromDate` and `toDate` filter by the day an event starts **in its venue's
        time zone**, both inclusive; the Admin and Customer apps' date filters use them. They
        cannot be combined with `from` or `to` (`400`), and `fromDate` after `toDate` is `400`.

        Feature 025: each event carries `doorsOpenAt` and `entryOpensAt`. The Ticket Booth app
        lists scheduled events that have not ended and lets a gate agent choose only those whose
        `entryOpensAt` has passed; `lookupEntryTicket` and `admitTicket` enforce the window.

        Feature 030: **past events are left out unless `includePast` is `true`**. An event is past
        from the instant the Backend's clock, when it answers, reaches its `endsAt` (half-open: at
        `endsAt` exactly it is past), whatever its `status`. `includePast` combines with every other
        filter, and the order is unchanged. Any caller may send it. Reading one event (`getEvent`)
        and every other operation are unaffected.
      operationId: listEvents
      x-required-roles: []
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict results to events at one venue.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only events whose name contains this text, ignoring case and surrounding
            spaces. Blank means no filter.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Keep only events with `startsAt` at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Keep only events with `startsAt` strictly before this instant. When both are given,
            `from` must be earlier than `to`, otherwise `400`.
        - name: fromDate
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-10-01' }
          description: |
            Feature 020. Keep only events that start on or after this day, in their venue's
            `timeZone`.
        - name: toDate
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-10-01' }
          description: |
            Feature 020. Keep only events that start on or before this day, in their venue's
            `timeZone`.
        - name: includePast
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Feature 030. `true` also lists events whose `endsAt` has been reached; `false`, the
            default, leaves them out. Any other value is `400 VALIDATION_FAILED`.
      responses:
        '200':
          description: Matching events, ordered by start time; past events only with `includePast`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [events]
      summary: Schedule an event
      description: |
        Rejects, in this order: request-shape and field validation, unknown venue, ticket
        capacity above the venue's seating capacity, and a scheduling conflict at that venue.

        Feature 016: `maxTicketsPerCustomer`, when given, must be from 1 to the event's
        `totalTicketCapacity`, where an omitted capacity is the venue's `seatingCapacity` (`400`
        otherwise). It is checked after the venue's seating capacity.

        Feature 020: a `startsAt` or `endsAt` without a UTC offset, or a date only, is
        `400 VALIDATION_FAILED` with the field validation. Right after the venue is found,
        `startsAt` and then `endsAt` are checked against the venue's `timeZone`: a local time the zone skips is `400 LOCAL_TIME_SKIPPED`,
        and a time stated with an offset other than the venue's at that local time (including `Z`)
        is `400 UTC_OFFSET_MISMATCH`. A local time the zone repeats is accepted with either of its
        two offsets. The scheduling conflict message names the conflicting event's times in the
        venue's local time.

        Feature 025: `doorsOpenAt` is optional. Left out, it is `startsAt` minus 1 hour. Sent, it is
        checked against the venue's `timeZone` after `endsAt`, like the start and end
        (`details.field: doorsOpenAt`), and then must be from 6 hours before `startsAt` to
        `startsAt`, both allowed: otherwise `400 DOORS_OPEN_OUT_OF_RANGE`, whose message names the
        allowed range in the venue's local time. This comes before the capacity checks. The Admin
        app always sends it.

        Feature 031: **the event, its ticket types, and its seating are saved together or not at
        all.** Feature 038: the seating is `layoutId`, `levelPrices` and `offSale`; a seated event
        has no ticket types. `tiers`, `layoutId`, `levelPrices` and `offSale` are optional; a
        request with none of them is checked, saved, and answered exactly as before. With them,
        the whole request is one transaction: any refusal, or any failure before it commits,
        leaves no event, ticket type, price, or off-sale seat. The checks, in order:

        - **Seating**, right after the event's times and doors are checked and before the
          capacity checks, since the capacity depends on it: a `layoutId` must be a layout of the
          venue, with no `tiers` and no `totalTicketCapacity` (`400` naming `layoutId`, `tiers` or
          `totalTicketCapacity`); then `levelPrices` and `offSale` as described on them. The
          event's capacity is then its seats on sale, and the capacity and
          `maxTicketsPerCustomer` checks use it.
        - The event's other checks as before: capacity, `maxTicketsPerCustomer`, scheduling
          conflict.
        - **Each ticket type, in the order sent**: its name, trimmed, is not the name of an
          earlier one ignoring case (`409 TIER_NAME_TAKEN`); `quantity` is required (`400`).
        - **The ticket types together**: their quantities add up to no more than the event's
          `totalTicketCapacity` (`409 CAPACITY_EXCEEDED`).

        The venue row is held for the whole transaction, so a layout change at the venue runs
        entirely before or after it.

        **Which field a refusal is about.** A rule refusal about one ticket type names it by path,
        `tiers.<index>.<field>` (the zero-based index in `tiers`; the field `name`, `price`, or
        `quantity`); one about the ticket types together names `tiers`; one about seating names
        `layoutId`, `levelPrices`, `offSale` or `totalTicketCapacity`. On a `409`
        (`TIER_NAME_TAKEN`, `CAPACITY_EXCEEDED`) the path is `details.field`. A `409
        TIER_NAME_TAKEN` without `details.field` is the database's backstop (two names the
        check took as different but the database's case folding did not) and names no ticket
        type. On `400 VALIDATION_FAILED` every malformed field is listed at once in
        `details.fields`, and each entry about the new fields starts with its place: an entry
        about one field of ticket type *i* starts `tiers.<i>.<field> ` (`tiers.1.price must be
        …`); an unknown field in ticket type *i* is `tiers.<i>.property <name> should not exist`;
        any other entry about the ticket types (`tiers` not a list, an entry that is not an
        object, more than 50) starts with `tiers` (an entry that is not an object reads
        `tiers.tiers must be a list of ticket types, …`); one about seating starts with
        `layoutId`, `levelPrices`, `offSale` or `totalTicketCapacity`. So a client places an
        entry on ticket type *i* when it starts `tiers.<i>.`, on the ticket types when it
        otherwise starts `tiers`, and on seating by those names. The rest of each message is for people.

        Feature 035: `EventTierInput.id` is not allowed on a schedule (`400 VALIDATION_FAILED`,
        an entry starting `tiers.<i>.id`). It is only for `updateEvent`.
      operationId: createEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Event scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/EventTimeRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [events]
      summary: Retrieve one event
      operationId: getEvent
      x-required-roles: []
      responses:
        '200':
          description: The event, with its venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [events]
      summary: Update an event
      description: |
        Includes moving the event to a different venue or time window. The conflict rule is
        re-evaluated against the destination venue and window, excluding the event itself.
        Lowering `totalTicketCapacity` below the sum of the event's tier quantities, or below
        its tickets sold, is refused with `409 CAPACITY_EXCEEDED` (features 004, 005). A
        cancelled event cannot be changed (`409 EVENT_CANCELLED`). Feature 038: a seated event's
        `totalTicketCapacity` is its seats on sale and cannot be set (`400`); moving it to another
        venue clears its layout, as `layoutId` describes.

        Feature 016: `maxTicketsPerCustomer` may be set, changed, or cleared with `null` at any
        time before the event is cancelled. After the existing capacity checks, the limit in
        force after the update must not exceed the event's `totalTicketCapacity`: a
        `maxTicketsPerCustomer` sent in the request above it is `400`; an update that lowers
        `totalTicketCapacity` below the stored limit, without sending a new one, is `409
        CAPACITY_EXCEEDED` (`details.proposedTicketCapacity`, `details.maxTicketsPerCustomer`).
        Lowering or clearing the limit never changes an existing order or ticket.

        Feature 020: each of `startsAt` and `endsAt` sent is checked against the destination
        venue's `timeZone` as in `createEvent`. Moving the event to a venue in a different time
        zone must send both `startsAt` and `endsAt` (`400 VALIDATION_FAILED` otherwise), so its
        local times are explicit; a move within the same zone without times keeps the instants.

        Feature 025: `doorsOpenAt`, when sent, is checked as in `createEvent`, against the
        `startsAt` in force after the update (sent, else stored). When the update changes
        `startsAt` and does not send `doorsOpenAt`, `doorsOpenAt` moves by the same amount, keeping
        the same time before the start (also when moving to a venue in another zone, which does not
        have to send it). Otherwise an update without it leaves it unchanged. Moving
        `doorsOpenAt` later can close an open check-in window; entries already recorded stay.

        Feature 032: once an event's check-in details have been removed (`checkInDetailsRemovedAt`
        set), an update whose `startsAt`, `endsAt`, or `doorsOpenAt` in force after it differs from
        the stored instant is refused with `409 CHECK_IN_DETAILS_REMOVED`
        (`details.removedAt`), and nothing changes. Sending the stored instants again, or changing
        only other fields, is allowed. Before removal, times change as above, and the removal
        follows the `endsAt` in force.

        Feature 035. Optional `tiers` (each an `EventTierInput`, at most 50) and, feature 038,
        `layoutId`, `levelPrices` and `offSale` save the event's details, its complete ticket
        types, and its seating together, or save none of this request. Without them the request is
        answered exactly as before. `tiers`, when sent, is the complete new set: a ticket type
        with `id` must be a type of this event and is updated; a type without `id` is created; an
        existing type left out is removed, subject to the same sold-ticket rules as `deleteTier`
        and `updateTier` (`TIER_HAS_ORDERS`, `EVENT_HAS_ORDERS`, `CAPACITY_EXCEEDED` when a
        quantity would fall below tickets sold). `tiers` may not be `null`.

        Checks, after the event's details as above: seating, then each ticket type in the order
        sent, then their total, as in `createEvent` (feature 031), then the sold-ticket rules. A
        refusal names its field the same way: `details.field` is `tiers.<index>.<field>` (including
        `id`), `tiers`, `layoutId`, `levelPrices`, `offSale`, or `totalTicketCapacity` on a `409`; on a `400`, each
        `details.fields` entry starts with its place. A refused removal of a type with orders is
        `409 TIER_HAS_ORDERS` with `details.field: tiers`, and the message names the type.
      operationId: updateEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/EventTimeRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [events]
      summary: Delete an event
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first. The window the
        event occupied becomes available for scheduling again immediately. The event's ticket
        tiers are deleted with it. An event with orders cannot be deleted (`409
        EVENT_HAS_ORDERS`, feature 005); cancel it instead, which keeps its records. Feature 014:
        the event's images are deleted with it. Feature 015: its seat reservations are deleted
        with it, and every open `streamSeatMap` stream for it ends.
      operationId: deleteEvent
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Event deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/tiers:
    parameters:
      - name: id
        in: path
