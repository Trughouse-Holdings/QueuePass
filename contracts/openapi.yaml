    patch:
      tags: [tiers]
      summary: Update a ticket tier
      description: |
        Same rules as creating one, evaluated against the event's other tiers. `quantity` may not
        drop below the tier's tickets sold (`409 CAPACITY_EXCEEDED`). A price change does not
