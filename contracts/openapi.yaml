openapi: 3.1.0
info:
  title: QueuePass Backend API
  version: 1.14.0
  description: |
    The single, authoritative API contract for QueuePass (Constitution I). Every front end builds
    against this document. An endpoint is added or changed here, in a reviewed pull request,
    before it is implemented.

    **Authentication**: every operation except `getHealth` requires
    `Authorization: Bearer <access token>`, where the token is a JWT issued by the Keycloak realm
    `queuepass`. The Backend checks its signature against the realm's published keys, its issuer
    (`http://localhost:8080/realms/queuepass`), that its audience includes `queuepass-api`, and
    that it is not expired (30-second clock tolerance). Any failure is `401 UNAUTHENTICATED`.

    **Authorization**: `x-required-roles` on each operation lists the Keycloak realm roles that
    may call it. An empty list means any signed-in user. Roles are read from the token's
    `realm_access.roles`. A valid token without a listed role is `403 FORBIDDEN`. A test fails if
    the Backend's role checks differ from this document.

    **Authority**: this API is the only path to persistent state. No front end holds a database
    connection. Every business rule, including the scheduling conflict rule, is enforced here.

    **Times**: all timestamps are RFC 3339 with an explicit offset, stored as `timestamptz` and
    compared in UTC. Event windows are half-open, `[startsAt, endsAt)`.

    **Venue time zones** (feature 020): every venue has a `timeZone`, one of `UsTimeZone`.
    Responses send instants in UTC; clients show every event time in its venue's `timeZone`, with
    the zone's abbreviation. An event time sent to the API (`startsAt`, `endsAt`) states the
    venue's local time with the venue's UTC offset at that time; the Backend refuses a local time
    the venue's zone skips (`LOCAL_TIME_SKIPPED`) and a time stated with any other offset,
    including `Z` (`UTC_OFFSET_MISMATCH`). A local time the zone repeats (clocks fall back) is
    accepted with either of its two offsets, which says which occurrence is meant.

    **Errors**: every non-2xx response is an `ErrorEnvelope`. Branch on `error.code`, never on
    `error.message`.

    **Planned operations**: an operation marked `x-planned: '<feature>'` is declared in that
    feature's spec and plan pull request, before its implementation (Constitution I), and the
    Backend does not serve it yet (`404`). The implementation removes the marker in the change
    that serves the route. A test fails if a marked operation is served, or an unmarked one is not.

    **Live streams**: `streamSeatMap` answers with `text/event-stream` (Server-Sent Events). It is
    a plain HTTP `GET`. Each event's `data` is one JSON document, and `x-sse-events` on the
    operation maps each event name to its schema, so clients and tests take the payload types from
    this document. Send only the `Authorization` and `Accept` headers (the CORS policy allows
    `authorization` and `content-type`); the stream ends when the token expires.

servers:
  - url: http://localhost:3000
    description: Local docker compose

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health and identity (feature 001)
  - name: hello
    description: One greeting per front end, for the hello-world pages (feature 001)
  - name: venues
    description: |
      Venue catalog (feature 002). A venue is a `Location` in this API; the paths keep that name.
  - name: events
    description: Event scheduling with the 60-minute double-booking rule (feature 002)
  - name: tiers
    description: Ticket tiers per event (feature 004)
  - name: orders
    description: |
      Orders, tickets, attendee lists, and cancellation (feature 005); customer purchase,
      availability, and a customer's own orders (feature 006)
  - name: reports
    description: Sales reporting for admins (feature 005)
  - name: seating
    description: |
      Venue seating layouts, reserved seating per event, and seat maps (feature 007); seat
      reservations and live seat-map updates (feature 015)
  - name: images
    description: Up to 5 images per event, shown to customers as a gallery (feature 014)
  - name: entry
    description: |
      Gate check-in in the Ticket Booth app: look a ticket up by its code, then admit it, or every
      unused ticket of its order, exactly once (feature 017); live codes that change every 30
      seconds, and the buyer's entry key that makes them (feature 018)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      description: Used by Compose health checks. The only operation that needs no token.
      operationId: getHealth
      security: []
      x-required-roles: public
      responses:
        '200':
          description: Service is up and the database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [up] }

  /me:
    get:
      tags: [system]
      summary: Who am I
      description: |
        Returns the caller's identity as read from the validated token (spec 001 FR-022). Nothing
        is looked up in a database.
      operationId: getMe
      x-required-roles: []
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/orders:
    get:
      tags: [orders]
      summary: My orders
      description: |
        Every order the signed-in customer has placed, newest first, each with its tickets and a
        summary of its event (feature 006). The customer is the token's subject; no parameter can
        name another customer. Orders made by the demo script belong to stand-in identities and
        never appear here.
      operationId: listMyOrders
      x-required-roles: [customer]
      responses:
        '200':
          description: The caller's orders, newest first; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/tickets/{ticketId}/entry-key:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [entry]
      summary: My ticket's entry key, for its live codes
      description: |
        Feature 018. The secret the Customer app makes this ticket's live codes with, and the
        Backend's current time, so the app can follow the Backend's clock rather than the
        device's. Only the ticket's own buyer gets it: another customer's ticket, or one that does
        not exist, is `404 NOT_FOUND`; an id that is not a UUID is `400 VALIDATION_FAILED`. A
        used or void ticket is `409 ENTRY_REFUSED` (`USED` with `usedAt`, or `VOID`). Sent with
        `Cache-Control: no-store`. The client keeps the key in memory only, never in browser
        storage, a cookie, or a URL.
      operationId: getTicketEntryKey
      x-required-roles: [customer]
      responses:
        '200':
          description: The key and the Backend's time.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketEntryKey' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/reservations:
    get:
      tags: [seating]
      summary: My active seat reservations
      description: |
        The signed-in customer's active reservations, for every event, newest first (feature 015).
        A reservation is active from when it is made until it is bought, released, or ended, or its
        5 minutes run out (`expiresAt`, exclusive). The customer is the token's subject.
      operationId: listMyReservations
      x-required-roles: [customer]
      responses:
        '200':
          description: The caller's active reservations; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/reservations/release:
    post:
      tags: [seating]
      summary: Release all my seat reservations
      description: |
        Releases every active reservation of the signed-in customer, for every event (feature
        015). The Customer app calls it when the customer logs out. Each released seat is open to
        others at once, and this customer can't reserve it again for 2 minutes. Safe to repeat.
      operationId: releaseAllMyReservations
      x-required-roles: [customer]
      responses:
        '200':
          description: How many seats were released; 0 when there was nothing to release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleasedSeats' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/admin:
    get:
      tags: [hello]
      summary: Greeting for the Admin app
      operationId: getAdminHello
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: admin,
                  appName: QueuePass Admin,
                  username: admin1,
                  message: 'Hello, admin1! Welcome to QueuePass Admin.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/customer:
    get:
      tags: [hello]
      summary: Greeting for the Customer app
      operationId: getCustomerHello
      x-required-roles: [customer]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: customer,
                  appName: QueuePass,
                  username: customer1,
                  message: 'Hello, customer1! Welcome to QueuePass.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/booth:
    get:
      tags: [hello]
      summary: Greeting for the Ticket Booth app
      operationId: getBoothHello
      x-required-roles: [gate-agent]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: booth,
                  appName: QueuePass Ticket Booth,
                  username: agent1,
                  message: 'Hello, agent1! Welcome to QueuePass Ticket Booth.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /locations:
    get:
      tags: [venues]
      summary: List all venues
      description: |
        Ordered by name, A to Z. The Customer app (feature 003) relies on this order. Optional
        `q` filter (feature 004), used by the Admin app's venue search.
      operationId: listLocations
      x-required-roles: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only venues whose name or address contains this text, ignoring case and
            surrounding spaces. Blank means no filter.
      responses:
        '200':
          description: Matching venues, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [venues]
      summary: Create a venue
      description: |
        Rejects an empty name, a missing or malformed address field, and a non-positive capacity
        (`400 VALIDATION_FAILED`).

        Feature 013: the address (`street`, `city`, `state`, `zip`) is then checked with the
        address service (the US Census Geocoder) before anything is saved. Exactly one match
        that keeps the sent ZIP code (first 5 digits) and house number is accepted, and the venue
        is saved with the service's standard form of the four fields and `addressVerified: true`;
        `address` is built from them as `STREET, CITY, ST ZIP`. No match is
        `400 ADDRESS_NOT_FOUND`; several matches, or one match at a different ZIP code or house
        number, are `400 ADDRESS_AMBIGUOUS`, listing them.

        Save anyway: with `acceptUnverifiedAddress: true`, no match, several matches, or one
        match at a different ZIP code or house number instead save the venue with the four fields
        as sent (trimmed, runs of whitespace collapsed to one space, ZIP cut to 5 digits) and
        `addressVerified: false`. The address service is still asked first, and the flag changes
        nothing when it finds exactly one match that keeps the ZIP code and house number.

        When the service cannot be reached, does not answer within 5 seconds, or answers with an
        error, the save is refused with `503 ADDRESS_SERVICE_UNAVAILABLE` and nothing is saved,
        with or without `acceptUnverifiedAddress`.

        Feature 020: the venue's `timeZone` is decided after the address, in this order: the
        `timeZone` sent (`timeZoneSource: ADMIN`); else, for a verified address, the zone at the
        place the address service matched (`ADDRESS`); else the zone of `state` when the state has
        one (`STATE`). In a state with more than one zone (AK, AZ, FL, ID, IN, KS, KY, MI, NE, NV,
        ND, OR, SD, TN, TX) the create is refused with `400 TIME_ZONE_REQUIRED`, listing the
        state's zones in `details.timeZones`, and nothing is saved; resend with `timeZone`.
      operationId: createLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Venue created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [venues]
      summary: Retrieve one venue
      operationId: getLocation
      x-required-roles: []
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [venues]
      summary: Update a venue
      description: |
        Lowering `seatingCapacity` below the `totalTicketCapacity` of any event already
        scheduled at this venue is refused with `CAPACITY_EXCEEDED`. Feature 007: while the venue
        has a seating layout, its `seatingCapacity` is the layout's total seats and cannot be set
        here (`400`).

        Feature 013: `street`, `city`, `state`, and `zip` are sent all together or not at all
        (`400`). When they are sent and differ from the stored ones (ignoring case and extra
        spaces), the address is checked exactly as in `createLocation`, after every other check
        on this request and before anything is saved, including `acceptUnverifiedAddress`. An
        edit without address fields, or with the same address, never calls the address service
        and keeps `addressVerified` as it is. `acceptUnverifiedAddress` without the four address
        fields is `400`. A venue saved before feature 013 keeps its `address`, has `null` parts,
        and has `addressVerified: false` until its address is changed.

        Feature 020: `timeZone`, when sent, becomes the venue's zone (`timeZoneSource: ADMIN`),
        also together with an address change. Otherwise, when the address is checked (it was sent
        and differs), the zone is decided again exactly as in `createLocation`, including
        `400 TIME_ZONE_REQUIRED`. An edit that sends neither never changes the zone.

        When the zone changes, every event at the venue (scheduled or cancelled) keeps its local
        start and end date and time, so its `startsAt` and `endsAt` move. The change is refused,
        and nothing is saved, with `409 TIME_ZONE_HAS_ORDERS` when any event at the venue has any
        order (`details.events`); with `409 EVENT_TIME_NOT_IN_ZONE` when an event's local start or
        end does not exist, or happens twice, in the new zone (`details.event`, `details.reason`
        `SKIPPED` or `REPEATED`), or is a legacy time from before 1883 that no zone offset can
        state (`details.reason` `OUT_OF_RANGE`, #88); and with `409 SCHEDULING_CONFLICT` when the moved scheduled
        events would be closer than 60 minutes (`details.conflictingEvent` and `details.event`).
        All or nothing: the events and the venue change together.
      operationId: updateLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Venue updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }
        '409':
          description: |
            An existing event's ticket capacity exceeds the proposed seating capacity
            (`CAPACITY_EXCEEDED`); or, feature 020, the time zone cannot change
            (`TIME_ZONE_HAS_ORDERS`, `EVENT_TIME_NOT_IN_ZONE`, `SCHEDULING_CONFLICT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                capacityExceeded:
                  summary: An event sells more tickets than the proposed seating capacity
                  value:
                    error:
                      code: CAPACITY_EXCEEDED
                      message: "Cannot reduce seating capacity to 500; event 'Season Opener' has a ticket capacity of 900."
                      details:
                        proposedSeatingCapacity: 500
                        conflictingEvent:
                          id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                          name: Season Opener
                          totalTicketCapacity: 900
                timeZoneHasOrders:
                  summary: Feature 020. Tickets were sold for one of the venue's events
                  value:
                    error:
                      code: TIME_ZONE_HAS_ORDERS
                      message: "Can't change the time zone of Freedom Hall: tickets have been sold for 1 of its events. No customer's ticket time may move."
                      details:
                        timeZone: America/New_York
                        proposedTimeZone: America/Chicago
                        eventCount: 1
                        events:
                          - id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                            name: Season Opener
                eventTimeNotInZone:
                  summary: Feature 020. An event's local time does not exist in the new zone
                  value:
                    error:
                      code: EVENT_TIME_NOT_IN_ZONE
                      message: "Can't change the time zone: Late Show's start, Mar 14, 2027, 2:30 AM, doesn't exist in Mountain Time."
                      details:
                        event:
                          id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                          name: Late Show
                        field: startsAt
                        localTime: '2027-03-14T02:30'
                        proposedTimeZone: America/Denver
                        reason: SKIPPED
    delete:
      tags: [venues]
      summary: Delete a venue
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first.

        Refused with `409 VENUE_HAS_EVENTS` while any event is scheduled at this venue. The
        service counts the events so the message and `details.eventCount` are specific; the
        database's `ON DELETE RESTRICT` is the guarantee, so no client can orphan events. If an
        event is added concurrently, the database refuses and `eventCount` is omitted.
      operationId: deleteLocation
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Venue deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Events are still scheduled at this venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueHasEvents' }
              example:
                error:
                  code: VENUE_HAS_EVENTS
                  message: 'Cannot delete "Freedom Hall": 3 events are still scheduled there. Delete or move them first.'
                  details:
                    eventCount: 3

  /locations/{id}/layout:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The venue.
    get:
      tags: [seating]
      summary: A venue's seating layout
      description: |
        The venue's sections in display order, and their total seats (feature 007). `sections` is
        empty when the venue has no layout.
      operationId: getLayout
      x-required-roles: []
      responses:
        '200':
          description: The layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [seating]
      summary: Replace a venue's seating layout
      description: |
        Replaces every section with the given ones, in order (feature 007). Section names must be
        unique ignoring case (`400`). Saving sets the venue's `seatingCapacity` to the layout's
        total seats, and the `totalTicketCapacity` of every scheduled event at the venue with
        reserved seating to the same total. Refused when that total is below the
        `totalTicketCapacity` of a scheduled general-admission event at the venue (`409
        CAPACITY_EXCEEDED`, naming it), and while any scheduled event at the venue with reserved
        seating has valid tickets (`409 LAYOUT_IN_USE`, `details.events`). Every event's section
        mappings at this venue are dropped, because the old sections no longer exist, so their
        tiers' quantities become 0 until remapped.

        Feature 016: also refused when the total is below the `maxTicketsPerCustomer` of a
        scheduled event at the venue with reserved seating (`409 CAPACITY_EXCEEDED`, naming it);
        lower its limit first.

        Feature 015: saving ends every active reservation at the venue's events.
      operationId: replaceLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutInput' }
      responses:
        '200':
          description: The new layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [seating]
      summary: Remove a venue's seating layout
      description: |
        Removes every section (feature 007). Refused as `replaceLayout` is, and also while any
        scheduled event at the venue has reserved seating on (`409 LAYOUT_IN_USE`). The venue
        keeps its last `seatingCapacity`, which can be set by `updateLocation` again.
      operationId: deleteLayout
      x-required-roles: [queuepass-admin]
      responses:
        '204': { description: Layout removed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events:
    get:
      tags: [events]
      summary: List all events
      description: |
        Each event embeds its venue. Ordered by `startsAt`, soonest first; the Customer app
        (feature 003) relies on this order. Optional filters, combinable: `locationId` (used by the
        Admin app's venue page), and `q`, `from`, `to` (feature 004, the Admin app's event search).

        Feature 020: `fromDate` and `toDate` filter by the day an event starts **in its venue's
        time zone**, both inclusive; the Admin and Customer apps' date filters use them. They
        cannot be combined with `from` or `to` (`400`), and `fromDate` after `toDate` is `400`.
      operationId: listEvents
      x-required-roles: []
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict results to events at one venue.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only events whose name contains this text, ignoring case and surrounding
            spaces. Blank means no filter.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Keep only events with `startsAt` at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Keep only events with `startsAt` strictly before this instant. When both are given,
            `from` must be earlier than `to`, otherwise `400`.
        - name: fromDate
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-10-01' }
          description: |
            Feature 020. Keep only events that start on or after this day, in their venue's
            `timeZone`.
        - name: toDate
          in: query
          required: false
          schema: { type: string, format: date, example: '2026-10-01' }
          description: |
            Feature 020. Keep only events that start on or before this day, in their venue's
            `timeZone`.
      responses:
        '200':
          description: Matching events, ordered by start time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [events]
      summary: Schedule an event
      description: |
        Rejects, in this order: request-shape and field validation, unknown venue, ticket
        capacity above the venue's seating capacity, and a scheduling conflict at that venue.

        Feature 016: `maxTicketsPerCustomer`, when given, must be from 1 to the event's
        `totalTicketCapacity`, where an omitted capacity is the venue's `seatingCapacity` (`400`
        otherwise). It is checked after the venue's seating capacity.

        Feature 020: a `startsAt` or `endsAt` without a UTC offset, or a date only, is
        `400 VALIDATION_FAILED` with the field validation. Right after the venue is found,
        `startsAt` and then `endsAt` are checked against the venue's `timeZone`: a local time the zone skips is `400 LOCAL_TIME_SKIPPED`,
        and a time stated with an offset other than the venue's at that local time (including `Z`)
        is `400 UTC_OFFSET_MISMATCH`. A local time the zone repeats is accepted with either of its
        two offsets. The scheduling conflict message names the conflicting event's times in the
        venue's local time.
      operationId: createEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Event scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/EventTimeRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [events]
      summary: Retrieve one event
      operationId: getEvent
      x-required-roles: []
      responses:
        '200':
          description: The event, with its venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [events]
      summary: Update an event
      description: |
        Includes moving the event to a different venue or time window. The conflict rule is
        re-evaluated against the destination venue and window, excluding the event itself.
        Lowering `totalTicketCapacity` below the sum of the event's tier quantities, or below
        its tickets sold, is refused with `409 CAPACITY_EXCEEDED` (features 004, 005). A
        cancelled event cannot be changed (`409 EVENT_CANCELLED`). Feature 007: while an event has
        reserved seating, it cannot move to another venue, and its `totalTicketCapacity` is its
        venue's layout total and cannot be set (`400` for either); turn reserved seating off
        first.

        Feature 016: `maxTicketsPerCustomer` may be set, changed, or cleared with `null` at any
        time before the event is cancelled. After the existing capacity checks, the limit in
        force after the update must not exceed the event's `totalTicketCapacity`: a
        `maxTicketsPerCustomer` sent in the request above it is `400`; an update that lowers
        `totalTicketCapacity` below the stored limit, without sending a new one, is `409
        CAPACITY_EXCEEDED` (`details.proposedTicketCapacity`, `details.maxTicketsPerCustomer`).
        Lowering or clearing the limit never changes an existing order or ticket.

        Feature 020: each of `startsAt` and `endsAt` sent is checked against the destination
        venue's `timeZone` as in `createEvent`. Moving the event to a venue in a different time
        zone must send both `startsAt` and `endsAt` (`400 VALIDATION_FAILED` otherwise), so its
        local times are explicit; a move within the same zone without times keeps the instants.
      operationId: updateEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/EventTimeRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [events]
      summary: Delete an event
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first. The window the
        event occupied becomes available for scheduling again immediately. The event's ticket
        tiers are deleted with it. An event with orders cannot be deleted (`409
        EVENT_HAS_ORDERS`, feature 005); cancel it instead, which keeps its records. Feature 014:
        the event's images are deleted with it. Feature 015: its seat reservations are deleted
        with it, and every open `streamSeatMap` stream for it ends.
      operationId: deleteEvent
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Event deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/tiers:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [tiers]
      summary: List an event's ticket tiers
      description: Ordered by price, lowest first, then by name.
      operationId: listTicketTiers
      x-required-roles: []
      responses:
        '200':
          description: The event's tiers. Empty when the event sells a single admission type.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tiers]
      summary: Add a ticket tier to an event
      description: |
        Rejects, in this order: field validation, unknown event, a name already used by another
        tier of this event ignoring case (`409 TIER_NAME_TAKEN`), and a quantity that would push
        the event's tier total above its `totalTicketCapacity` (`409 CAPACITY_EXCEEDED`, with
        `details.remaining`). The capacity rule holds under concurrent requests. Also refused:
        a cancelled event (`409 EVENT_CANCELLED`), and an event that already sold tickets
        without tiers (`409 EVENT_HAS_ORDERS`), since those tickets would belong to no tier.
        Feature 007: for an event with reserved seating, `quantity` must be omitted (`400`
        otherwise): the tier's quantity is the seats in its mapped sections, 0 until mapped. For
        any other event it is required (`400`).

        Feature 015: adding the first tier to an event with reserved seating ends its active
        reservations, which were made without a tier and could no longer be bought; their seats
        become open at once.
      operationId: createTicketTier
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTierInput' }
      responses:
        '201':
          description: Tier added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/tiers/{tierId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: tierId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: A tier of that event. A tier of a different event is `404`.
    patch:
      tags: [tiers]
      summary: Update a ticket tier
      description: |
        Same rules as creating one, evaluated against the event's other tiers. `quantity` may not
        drop below the tier's tickets sold (`409 CAPACITY_EXCEEDED`). A price change does not
        affect orders already placed. Feature 007: for an event with reserved seating, `quantity`
        cannot be set (`400`); it follows the tier's mapped sections.
      operationId: updateTicketTier
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTierUpdate' }
      responses:
        '200':
          description: Tier updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tiers]
      summary: Remove a ticket tier
      description: |
        Permanent. Clients MUST ask the user to confirm first. A tier with orders cannot be
        removed (`409 TIER_HAS_ORDERS`); a cancelled event's tiers cannot change (`409
        EVENT_CANCELLED`). Feature 015: the tier's seat reservations are deleted with it, and
        their seats become open at once.
      operationId: deleteTicketTier
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Tier removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: Tickets left and whether sales are open
      description: |
        Tickets left for the event and for each of its tiers, counting valid tickets only, and
        whether sales are closed and why, decided by the Backend's clock (feature 006). The
        counts are guidance: `createOrder` decides under its own lock, so a count can be out of
        date by the time an order arrives.

        Feature 016: for a signed-in customer and an event with a `maxTicketsPerCustomer`,
        `customerLimit` gives the limit, the caller's own valid tickets for the event, and how many
        more they may get; otherwise it is `null`. It never describes another customer.
      operationId: getEventAvailability
      x-required-roles: []
      responses:
        '200':
          description: The event's availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seats:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: The event's seat map
      description: |
        Whether the event has reserved seating and, for each section of its venue's layout, its
        size, its tier for this event, and which seats are taken by valid tickets (feature 007).
        It never says who holds a seat. `sections` is empty when the venue has no layout.

        Feature 015: each section's `reserved` lists the seats in active reservations. It is the
        same for every caller and never says whose; a customer's own are in
        `listMyReservations`. `streamSeatMap` sends this map and then every change, live.
      operationId: getSeatMap
      x-required-roles: []
      responses:
        '200':
          description: The seat map.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seats/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: Live updates of the event's seat map
      description: |
        A Server-Sent Events stream of the event's seat map (feature 015). It begins with
        `event: snapshot`, whose `data` is the `SeatMap`, as from `getSeatMap`. After that, each
        `event: seats` carries a `SeatMapChange`: seats that became open, reserved, or sold, sent
        within 2 seconds of the change. `event: ping` (`data: {}`) arrives every 15 seconds. No
        event ever names a customer. A client that loses the stream reconnects and gets a fresh
        snapshot. The stream ends when the access token expires; reconnect at once with a current
        one. It also ends when the event's seating or its venue's layout changes; reconnect at
        once for a new snapshot. It also ends when the event is deleted; a reconnect then gets
        `404`.
      operationId: streamSeatMap
      x-required-roles: []
      x-sse-events:
        snapshot: { $ref: '#/components/schemas/SeatMap' }
        seats: { $ref: '#/components/schemas/SeatMapChange' }
        ping: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: |
            The event stream. `data` is a `SeatMap` for `snapshot` and a `SeatMapChange` for
            `seats`.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: snapshot
                  data: {"eventId":"7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40","reservedSeating":true,"sections":[]}

                  event: seats
                  data: {"eventId":"7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40","changes":[{"sectionId":"5b0d3c1e-8f2a-4c6b-9d1e-2a3b4c5d6e7f","row":1,"seat":3,"state":"reserved"}]}
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seating:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    put:
      tags: [seating]
      summary: Set reserved seating and section tiers
      description: |
        Turns reserved seating on or off and replaces the event's section-to-tier mappings
        (feature 007). Reserved seating can switch only while the event has no valid tickets
        (`409 EVENT_HAS_ORDERS`), and turn on only when its venue has a layout (`400`). Each
        `sectionId` must be a section of the venue and each `tierId` a tier of the event (`400`).
        A section with valid tickets cannot move to another tier (`409 EVENT_HAS_ORDERS`). A
        cancelled event cannot change (`409 EVENT_CANCELLED`). With reserved seating on, the event's
        `totalTicketCapacity` becomes its venue's layout total and each tier's `quantity` becomes
        the seats in the sections mapped to it (0 with none); turning it off keeps those numbers.

        Feature 015: turning reserved seating off ends every active reservation for the event, and
        moving a section to another tier ends the reservations' seats in that section.
      operationId: updateSeating
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatingInput' }
      responses:
        '200':
          description: The updated seat map.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/reservation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [seating]
      summary: Reserve seats
      description: |
        Reserves seats for the signed-in customer for 5 minutes (feature 015). With no active
        reservation for the event, it makes one (`201`) that ends at `expiresAt`, 5 minutes later;
        with one, it adds the seats to it (`200`) without changing `expiresAt`. All or nothing:
        any refusal reserves no seat.

        Each seat follows the rules of `createOrder`'s seats: inside the venue's layout, in a
        section for sale and, for an event with tiers, all of one tier (`400`), and not repeated
        (`400`). Added seats must be of the active reservation's tier and not already in it
        (`400`). A reservation holds at most 10 seats (`400`), and no more than the customer may
        still get under the event's `maxTicketsPerCustomer`, counting valid tickets only
        (`409 TICKET_LIMIT_REACHED`; `details.requested` is the seats the reservation would then
        hold).

        Refused when the event has no reserved seating (`400`), is cancelled (`409
        EVENT_CANCELLED`), or has started (`409 SALES_CLOSED`); for seats with a valid ticket or
        in another customer's active reservation (`409 SEAT_TAKEN`, `details.seats`, with
        `details.reserved` listing the reserved ones); and for seats of this customer's own
        reservation that ended unbought less than 2 minutes ago (`409 SEAT_COOLDOWN`,
        `details.seats`, `details.availableAt`). No seat is ever in two active reservations, or in
        one and on a valid ticket, including under concurrent requests.

        There is no `tierId` in the request: the reservation's tier is the tier of the sections its
        seats are in (`null` for an event without tiers), and is returned as `tierId`.
      operationId: reserveSeats
      x-required-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '200':
          description: The seats were added to the caller's active reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '201':
          description: A new reservation, ending 5 minutes from now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/reservation/release:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [seating]
      summary: Release reserved seats
      description: |
        Releases seats from the signed-in customer's active reservation for the event (feature
        015): the listed `seats`, or all of them when `seats` is omitted. Released seats are open
        to others at once, and this customer can't reserve them again for 2 minutes. The rest
        keep their `expiresAt`. A seat not in the reservation is `400`. With no active reservation,
        nothing happens and `reservation` is `null`, so a repeat is harmless.
      operationId: releaseSeats
      x-required-roles: [customer]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationRelease' }
      responses:
        '200':
          description: What is left of the reservation; `null` once no seat is left.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationReleaseResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/orders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Get tickets for an event
      description: |
        Places an order for the signed-in customer and issues one ticket per seat, each with a
        unique code. Payment is simulated and always succeeds. Prices are fixed on the order.

        For an event with tiers, `tierId` is required and must be one of its tiers; for an event
        without tiers, `tierId` must be omitted and the base price applies (`400` otherwise).
        Refused when the event is cancelled (`409 EVENT_CANCELLED`) or when fewer tickets are
        left than requested, in the tier or in the event (`409 SOLD_OUT`, with
        `details.available`). Sales never exceed a tier's quantity or the event's capacity,
        including under concurrent requests.

        Feature 006: sales close when the event starts; an order at or after `startsAt` is
        refused (`409 SALES_CLOSED`). A `requestId` makes a confirmation safe to repeat: if this
        customer already placed an order with the same `requestId`, that order is returned with
        `200` and nothing new is recorded, even if the event has since sold out, started, or been
        cancelled. The same `requestId` with a different event, tier, or quantity is refused
        (`409 REQUEST_ID_REUSED`). Without a `requestId`, every request places a new order.

        Feature 007: an event with reserved seating requires `seats`, exactly `quantity` distinct
        ones, each inside its venue's layout and, for an event with tiers, in a section mapped to
        the order's tier (`400` otherwise); an event without reserved seating forbids them. Seats
        already taken by valid tickets are refused (`409 SEAT_TAKEN`, `details.seats`). No seat is
        ever held by two valid tickets, including under concurrent requests. A repeated
        `requestId` must also name the same seats.

        Feature 016: for an event with a `maxTicketsPerCustomer`, an order is refused when the
        customer's valid tickets for the event, across all their orders, plus `quantity` would
        exceed it (`409 TICKET_LIMIT_REACHED`, with `details.limit`, `details.held`,
        `details.remaining`, and `details.requested`). Void tickets do not count. When fewer
        tickets are left than the customer may still get, `SOLD_OUT` is returned instead, so the
        refusal always names the smaller number. A customer never holds more than the limit,
        including under concurrent requests. A repeated `requestId` is returned as before and
        counts once.

        Feature 015: for an event with reserved seating, every seat must be in the caller's
        active reservation for the event (`reserveSeats`). A seat with a valid ticket or in another
        customer's reservation is `409 SEAT_TAKEN` (with `details.reserved`); any other seat is
        `409 RESERVATION_REQUIRED` (`details.seats`; `details.expired` is `true` when the
        caller's reservation ran out). Bought seats leave the reservation; seats not bought stay
        reserved until it ends. A repeated `requestId` is returned before this check. An order whose
        `tierId` is not the reservation's tier is `400`, since its seats are not in that tier's
        sections.

        Feature 017: `holderName` is the buyer's own name, printed on every ticket of the order
        and checked against their ID at the gate. It is trimmed of leading and trailing spaces,
        and must then be 1 to 100 characters, contain at least one letter in any script, and
        contain no control characters; otherwise `400 HOLDER_NAME_INVALID` (`details.reason`).
        It cannot be changed after the order is placed. A repeated `requestId` must also name the
        same `holderName`.
      operationId: createOrder
      x-required-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200':
          description: |
            A repeat of an earlier request with the same `requestId`; the earlier order is
            returned unchanged and nothing new is recorded (feature 006).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Order placed; its tickets are included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/OrderRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/attendees:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: List an event's orders and tickets
      description: Every order for the event, oldest first, refunded ones included.
      operationId: listAttendees
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: The event's orders, each with its tickets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Cancel an event
      description: |
        Irreversible: clients MUST ask the user to confirm first. In one all-or-nothing step,
        voids every valid ticket, marks every confirmed order refunded (simulated), and marks the
        event cancelled. A cancelled event no longer blocks its venue's time, and refuses edits,
        tier changes, orders, and a second cancellation (`409 EVENT_CANCELLED`). Feature 015:
        every active seat reservation for the event ends too, and every seat freed, reserved or
        sold, is sent as open on `streamSeatMap`.
      operationId: cancelEvent
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Event cancelled, with how many orders and tickets were affected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/entry/lookup:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event the gate agent is working.
    post:
      tags: [entry]
      summary: Look a ticket up at the gate
      description: |
        Feature 017. Finds the ticket with this code and says whether it can be admitted at this
        event's gate now. The code is sent in the body, not the path, so it stays out of request
        logs. Letter case, spaces, and dashes are ignored; anything that is not then a ticket
        code, or matches no ticket, is `404 TICKET_NOT_FOUND`.

        Feature 018: `code` may instead be a **live code** from the Customer app, which starts
        with `QP1:` and changes every 30 seconds. A live code that QueuePass did not make, or that
        names no ticket, is `404 LIVE_CODE_INVALID`. A genuine live code is accepted from 5
        seconds before its 30-second window starts until 5 seconds after it ends, on the
        Backend's clock; outside that it is `409 LIVE_CODE_EXPIRED`, with nothing about its
        ticket. An accepted live code then answers exactly like its ticket's code would, with
        `verifiedBy: LIVE_CODE`; a ticket code answers `verifiedBy: TICKET_CODE`. A verified live
        code needs no ID check; a ticket code always does.

        A ticket that exists is always `200`, with `state` saying what the agent may do:
        `ADMITTABLE`; `USED` (with `usedAt`); `VOID` (its order was refunded, for example because
        the event was cancelled); `OTHER_EVENT` (the ticket's own event is in `event`); `NOT_OPEN`
        (entry opens at `entryOpensAt`, 2 hours before the start); or `ENDED`. The window is
        half-open, `[startsAt - 2 hours, endsAt)`, on the database's clock. Nothing is recorded.

        `unusedOnOrder` counts the valid, unused tickets of this ticket's order for this event,
        including this one, so the agent can offer to admit them all after one ID check.
      operationId: lookupEntryTicket
      x-required-roles: [gate-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryLookupInput' }
      responses:
        '200':
          description: The ticket and whether it can be admitted here now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryTicket' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409':
          description: Feature 018. A genuine live code outside its window and grace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: LIVE_CODE_EXPIRED
                  message: This live code has expired.

  /events/{id}/entry/admit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event the gate agent is working.
    post:
      tags: [entry]
      summary: Admit a ticket, or every unused ticket of its order
      description: |
        Feature 017. Records an entry for the ticket: the time (the database's clock) and the
        signed-in gate agent. A ticket is admitted at most once, including when any number of
        admit requests for it arrive at the same moment; every later one is refused. Admitting
        cannot be undone, and there is no re-entry.

        With `wholeOrder: true`, every valid, unused ticket of the same order for this event is
        admitted, each as its own entry under the same rule, and tickets of that order already
        used by then are listed in `alreadyUsed` instead. It never admits another order's tickets.

        Refused with `409 ENTRY_REFUSED` when nothing could be admitted. `details.reason` is
        `USED` (with `details.usedAt`), `VOID`, `OTHER_EVENT` (with `details.event`), `NOT_OPEN`
        (with `details.entryOpensAt`), or `ENDED`, the same states `lookupEntryTicket` reports.
        Feature 020: `details.event` also carries the event's venue `timeZone`, as
        `EntryTicket.event` does.
        A refused ID check is not sent to the Backend: the client simply does not call this.
      operationId: admitTicket
      x-required-roles: [gate-agent]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdmitInput' }
      responses:
        '200':
          description: At least one ticket was admitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EntryNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [images]
      summary: Add an image to an event
      description: |
        Feature 014.
        Adds one picture after the event's existing images. The body is `multipart/form-data` with
        exactly one part, `file`, and nothing else. The type is decided from the file's first
        bytes (its signature), never from its file name or the part's `Content-Type`: only JPEG
        (`FF D8 FF`), PNG (`89 50 4E 47 0D 0A 1A 0A`), and WebP (`RIFF`, 4 bytes, `WEBP`) are
        accepted. The stored and served `contentType` is the detected one. The width and height
        are read from the header (PNG `IHDR`, WebP `VP8 `/`VP8L`/`VP8X`, JPEG `SOFn`); a file
        whose header gives no size is treated as not a picture.

        Before storing, location, camera, and text metadata are removed: JPEG Exif and XMP `APP1`
        segments, `APP2` `MPF` and `APP13` segments, and `COM` comments (a JPEG's orientation is
        kept in a minimal Exif segment of its own); PNG `eXIf`, `tEXt`, `iTXt`, `zTXt`, and `tIME`
        chunks; WebP `EXIF` and `XMP ` chunks; and anything after a JPEG's first `EOI`, after a
        PNG's `IEND`, or past a WebP's declared `RIFF` length. The picture data is not changed.
        `byteSize` is the stored size; the 5 MB limit applies to the file as sent.

        Refused, in this order: `401` and `403` (before the body is read); a file over 5 MB,
        5,242,880 bytes (`413 IMAGE_TOO_LARGE`, while the body is read); a body without exactly
        one `file` part, or with other parts (`400 VALIDATION_FAILED`); a malformed event id
        (`400 VALIDATION_FAILED`); a file that is not a JPEG, PNG, or WebP, an animated PNG or WebP,
        or one whose size in pixels cannot be read or whose segments or chunks run past the end of
        the file (`415 IMAGE_TYPE_NOT_ALLOWED`); a picture wider or taller than 16,384
        pixels or of more than 40,000,000 pixels (`400 IMAGE_DIMENSIONS_TOO_LARGE`, with
        `details.width`, `details.height`, `details.maxSide`, `details.maxPixels`); an unknown
        event (`404`); a cancelled event (`409 EVENT_CANCELLED`); and an event that already has 5
        images (`409 IMAGE_LIMIT_REACHED`, with `details.limit` and `details.count`). An event
        never has more than 5 images, including under concurrent requests. Nothing is stored when
        refused.
      operationId: uploadEventImage
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/EventImageUpload' }
      responses:
        '201':
          description: Image added, last in the event's order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ImageRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ImageTooLarge' }
        '415': { $ref: '#/components/responses/ImageTypeNotAllowed' }

  /events/{id}/images/order:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    put:
      tags: [images]
      summary: Set the order of an event's images
      description: |
        Feature 014.
        `imageIds` lists every image of the event, each once, in the new order; the first becomes
        the cover (`position` 1). A list that is malformed, repeats an id, or has more than 5 ids is
        `400`. A list that does not name exactly the event's current images, because another
        request added or removed one meanwhile, is `409 IMAGES_CHANGED`, with the current order in
        `details.imageIds`; nothing changes. A cancelled event is `409 EVENT_CANCELLED`.
      operationId: reorderEventImages
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventImageOrder' }
      responses:
        '200':
          description: The event's images in their new order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: An image of that event. An image of a different event is `404`.
    get:
      tags: [images]
      summary: An image's content
      description: |
        Feature 014.
        The picture's bytes as stored (as uploaded, with its metadata removed), with
        `Content-Type` set to its detected type. Like every operation except `getHealth`, it needs a
        bearer token, so a browser cannot load it with a plain `<img src>`: the apps fetch it with the
        token and show it from a local object URL. An image's content never changes, so the response
        carries `Cache-Control: private, max-age=31536000, immutable`, and
        `X-Content-Type-Options: nosniff`.
      operationId: getEventImage
      x-required-roles: []
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [images]
      summary: Remove an image from an event
      description: |
        Feature 014.
        Permanent. The event's other images keep their order and close the gap, so positions stay
        1 to n. A cancelled event's images cannot change (`409 EVENT_CANCELLED`).
      operationId: deleteEventImage
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Image removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reports/sales:
    get:
      tags: [reports]
      summary: Sales report
      description: |
        Computed on request, so it is always current. Totals cover all events; `ticketCapacity`
        and `events` in the totals count scheduled events only. Refunded orders and void tickets
        are excluded from sold, revenue, and check-ins. Events ordered by `startsAt`.
      operationId: getSalesReport
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Totals and per-event, per-tier figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak access token for realm `queuepass`, obtained by a front end through the OIDC
        Authorization Code flow with PKCE. Audience must include `queuepass-api`.

  schemas:
    Role:
      type: string
      enum: [queuepass-admin, gate-agent, customer]

    Me:
      type: object
      required: [sub, username, roles]
      additionalProperties: false
      properties:
        sub:
          type: string
          description: Keycloak subject identifier (the token's `sub`).
          example: 3f0c1e9a-5b7d-4c2e-9f1a-2b3c4d5e6f70
        username:
          type: string
          description: The token's `preferred_username`.
          example: admin1
        roles:
          type: array
          description: The caller's QueuePass realm roles. Other realm roles are omitted.
          items: { $ref: '#/components/schemas/Role' }
          uniqueItems: true
          example: [queuepass-admin]

    Hello:
      type: object
      required: [app, appName, username, message]
      additionalProperties: false
      properties:
        app: { type: string, enum: [admin, customer, booth] }
        appName: { type: string }
        username: { type: string }
        message: { type: string }

    VenueHasEvents:
      description: The `409` for deleting a venue that still has events. An `ErrorEnvelope`.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: VENUE_HAS_EVENTS }
            message: { type: string }
            details:
              type: object
              properties:
                eventCount:
                  type: integer
                  minimum: 1
                  description: Omitted only when a concurrent insert made the database refuse.

    Location:
      description: |
        A venue. Feature 013: when `street`, `city`, `state`, and `zip` are set, `address` is
        built from them as `STREET, CITY, ST ZIP`. Three kinds of venue:

        - `addressVerified: true`: the address service matched it; the four fields are its
          standard (upper-case) form.
        - `addressVerified: false` with the four fields set: an admin saved it anyway
          (`acceptUnverifiedAddress`); the fields are as the admin sent them.
        - `addressVerified: false` with the four fields `null`: saved before feature 013 and not
          re-addressed since; `address` is the one-line text it was saved with.

        The five fields are always sent from feature 013 on, but are not in `required`, so this
        contract can merge before the Backend sends them (feature 013 research R11).

        Feature 020: `timeZone` and `timeZoneSource` are always sent, and required from 1.14.0
        (#88; feature 020 research R18 left them optional until every app read them).
      type: object
      required: [id, name, address, timeZone, timeZoneSource, seatingCapacity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: 'KFC Yum! Center' }
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: The full one-line address. Shown by every client and matched by `q`.
          example: '430 W VINE ST, LEXINGTON, KY 40507'
        street:
          type: [string, 'null']
          maxLength: 200
          example: '430 W VINE ST'
        city:
          type: [string, 'null']
          maxLength: 100
          example: LEXINGTON
        state:
          oneOf:
            - { $ref: '#/components/schemas/UsState' }
            - { type: 'null' }
        zip:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          example: '40507'
        addressVerified:
          type: boolean
          description: Whether the address service matched this address. Clients mark `false` as "Address not verified".
        timeZone: { $ref: '#/components/schemas/UsTimeZone' }
        timeZoneSource: { $ref: '#/components/schemas/TimeZoneSource' }
        seatingCapacity: { type: integer, minimum: 1, example: 22090 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocationInput:
      type: object
      required: [name, seatingCapacity]
      description: |
        Feature 013: the address is sent as four fields and checked with the address service.
        `address` is not accepted; the Backend builds it.

        `street`, `city`, `state`, and `zip` are **required**: the Backend refuses a create
        without any of them with `400 VALIDATION_FAILED`. They are left out of `required` only so
        the Admin app's generated request types still compile on `main` between this contract
        and its implementation (feature 013 research R11).
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: Rejected when empty or whitespace-only after trimming.,
          }
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: House number and street. Trimmed; rejected when empty.
          example: '430 W Vine St'
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; rejected when empty.
          example: Lexington
        state: { $ref: '#/components/schemas/UsState' }
        zip:
          type: string
          pattern: '^[0-9]{5}(-[0-9]{4})?$'
          description: 5 digits, or ZIP+4. The saved value is the address service's 5-digit ZIP.
          example: '40507'
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. Optional: the admin's explicit choice of the venue's time zone, used
            instead of the zone worked out from the address or state (`timeZoneSource: ADMIN`).
            Needed for an address saved anyway in a state with more than one zone
            (`400 TIME_ZONE_REQUIRED` otherwise).
        seatingCapacity:
          { type: integer, minimum: 1, description: Must be a positive whole number. }

    LocationUpdate:
      type: object
      minProperties: 1
      description: |
        Partial update; supply only the fields being changed. Feature 013: `street`, `city`,
        `state`, and `zip` are sent all together or not at all, and `acceptUnverifiedAddress`
        only with them (`400` otherwise).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        street: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { $ref: '#/components/schemas/UsState' }
        zip: { type: string, pattern: '^[0-9]{5}(-[0-9]{4})?$' }
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. The admin's explicit choice of the venue's time zone (`timeZoneSource:
            ADMIN`). A change of zone moves the venue's events to keep their local times, and is
            refused as described in `updateLocation`.
        seatingCapacity: { type: integer, minimum: 1 }

    AcceptUnverifiedAddress:
      type: boolean
      default: false
      description: |
        Feature 013 "save anyway": the admin confirmed the address after an `ADDRESS_NOT_FOUND`
        or `ADDRESS_AMBIGUOUS` refusal. The address service is still asked. With no match,
        several matches, or one match at a different ZIP code or house number, the venue is saved
        as sent (trimmed, runs of whitespace collapsed to one space, ZIP cut to 5 digits) with
        `addressVerified: false`. With exactly one match that keeps the ZIP code and house number,
        it is saved verified, as without the flag. When the service is unavailable,
        the request is still refused with `503 ADDRESS_SERVICE_UNAVAILABLE`.

    UsState:
      type: string
      description: A US state or the District of Columbia, by its two-letter postal code (feature 013).
      enum:
        [
          AL,
          AK,
          AZ,
          AR,
          CA,
          CO,
          CT,
          DE,
          DC,
          FL,
          GA,
          HI,
          ID,
          IL,
          IN,
          IA,
          KS,
          KY,
          LA,
          ME,
          MD,
          MA,
          MI,
          MN,
          MS,
          MO,
          MT,
          NE,
          NV,
          NH,
          NJ,
          NM,
          NY,
          NC,
          ND,
          OH,
          OK,
          OR,
          PA,
          RI,
          SC,
          SD,
          TN,
          TX,
          UT,
          VT,
          VA,
          WA,
          WV,
          WI,
          WY,
        ]

    UsTimeZone:
      type: string
      description: |
        Feature 020. A venue's time zone, by its IANA name: Eastern (`America/New_York`), Central
        (`America/Chicago`), Mountain (`America/Denver`), Arizona, Mountain without daylight saving
        (`America/Phoenix`), Pacific (`America/Los_Angeles`), Alaska (`America/Anchorage`),
        Hawaii-Aleutian (`America/Adak`), and Hawaii (`Pacific/Honolulu`).
      enum:
        [
          America/New_York,
          America/Chicago,
          America/Denver,
          America/Phoenix,
          America/Los_Angeles,
          America/Anchorage,
          America/Adak,
          Pacific/Honolulu,
        ]
      example: America/New_York

    TimeZoneSource:
      type: string
      description: |
        Feature 020. How a venue's `timeZone` was set: `ADDRESS`, worked out from the place the
        address service matched; `STATE`, from the venue's state, which has one zone; `ADMIN`,
        chosen by an admin; `DEFAULT`, `America/New_York` by default: a venue that existed before
        feature 020, or a demo-data venue saved while the address service was unavailable.
      enum: [ADDRESS, STATE, ADMIN, DEFAULT]

    Event:
      type: object
      required:
        [
          id,
          name,
          locationId,
          location,
          startsAt,
          endsAt,
          totalTicketCapacity,
          basePrice,
          status,
          cancelledAt,
          reservedSeating,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: Season Opener }
        reservedSeating:
          type: boolean
          description: Feature 007. Whether customers choose seats; set with `updateSeating`.
        status:
          type: string
          enum: [SCHEDULED, CANCELLED]
          description: Feature 005. A cancelled event stays on record but is read-only.
        cancelledAt:
          type: [string, 'null']
          format: date-time
          description: When the event was cancelled; `null` while scheduled.
        locationId: { type: string, format: uuid }
        location:
          allOf: [{ $ref: '#/components/schemas/Location' }]
          description: The venue, embedded so lists need no second request.
        startsAt: { type: string, format: date-time, example: '2026-10-01T18:00:00-04:00' }
        endsAt: { type: string, format: date-time, example: '2026-10-01T21:00:00-04:00' }
        totalTicketCapacity: { type: integer, minimum: 1, example: 18000 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          example: 8
          description: |
            Feature 016. The most valid tickets one customer may hold for this event, across all
            their orders; `null` for no limit. Never more than `totalTicketCapacity`. Always sent
            once 016 is implemented; not listed as required so this contract can merge ahead of
            the implementation with the suite green. Clients treat a missing value as `null`.
        images:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/EventImage' }
          description: |
            Feature 014. The event's images in order, `position` 1 (the cover) first; empty when it
            has none. Metadata only: load each image's content with `getEventImage`. Always sent
            once 014 is implemented; not listed as required so this contract can merge ahead of the
            implementation with the suite green. Clients treat a missing value as empty.
        basePrice:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number, so no client loses precision.
          example: '45.00'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventInput:
      type: object
      required: [name, locationId, startsAt, endsAt, basePrice]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId:
          {
            type: string,
            format: uuid,
            description: Must reference an existing venue; otherwise 404.,
          }
        startsAt:
          type: string
          format: date-time
          example: '2026-10-01T19:00:00-04:00'
          description: |
            Feature 020: the venue's local date and time with the venue's UTC offset at that time
            (`400 LOCAL_TIME_SKIPPED` or `400 UTC_OFFSET_MISMATCH` otherwise).
        endsAt:
          type: string
          format: date-time
          example: '2026-10-01T22:00:00-04:00'
          description: |
            Must be strictly after `startsAt`. Feature 020: stated like `startsAt`, in the venue's
            local time and offset.
        totalTicketCapacity:
          type: integer
          minimum: 1
          description: |
            Must not exceed the venue's `seatingCapacity`. Feature 007: optional; when left out it
            is the venue's `seatingCapacity`.
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: |
            Feature 016. Optional; left out or `null` means no limit. Must not exceed the event's
            `totalTicketCapacity` (`400` otherwise).
        basePrice:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }

    EventUpdate:
      type: object
      minProperties: 1
      description: Partial update; supply only the fields being changed.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId:
          type: string
          format: uuid
          description: |
            Feature 020: moving to a venue in a different time zone must also send `startsAt` and
            `endsAt`.
        startsAt:
          type: string
          format: date-time
          description: Feature 020. In the destination venue's local time and offset.
        endsAt:
          type: string
          format: date-time
          description: Feature 020. In the destination venue's local time and offset.
        totalTicketCapacity: { type: integer, minimum: 1 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: Feature 016. `null` clears the limit.
        basePrice: { type: string, pattern: '^\d+(\.\d{1,2})?$' }

    EventImage:
      description: |
        Feature 014. One picture of an event: what a client needs to load it from
        `getEventImage` and to order it, never its content.
      type: object
      required: [id, position, contentType, byteSize]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Never reused. An image's content never changes; a new picture is a new id.
        position:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the event's cover. An event's positions are always 1 to n, no gaps.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: Detected from the file's content when it was added.
        byteSize:
          type: integer
          minimum: 1
          maximum: 5242880
          description: The stored size in bytes, after metadata was removed.

    EventImageUpload:
      description: Feature 014. The `multipart/form-data` body of `uploadEventImage`.
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: |
            One JPEG, PNG, or WebP picture, at most 5,242,880 bytes, 16,384 pixels a side, and
            40,000,000 pixels. Its file name and declared type are ignored.

    EventImageOrder:
      description: Feature 014. Every image of the event, each once, in the new order.
      type: object
      required: [imageIds]
      additionalProperties: false
      properties:
        imageIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }

    TicketTier:
      description: One kind of ticket for an event, such as General or VIP (feature 004).
      type: object
      required: [id, eventId, name, price, quantity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, example: VIP }
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number.
          example: '120.00'
        quantity:
          type: integer
          minimum: 0
          example: 500
          description: |
            Typed for a general-admission event. Feature 007: for an event with reserved seating,
            the seats in the sections mapped to this tier; 0 when none are.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketTierInput:
      type: object
      required: [name, price]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: Trimmed; unique within the event ignoring case.,
          }
        price:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }
        quantity:
          type: integer
          minimum: 1
          description: |
            The event's tiers together may not exceed its `totalTicketCapacity`. Required without
            reserved seating; omitted with it (feature 007).

    TicketTierUpdate:
      type: object
      minProperties: 1
      description: Partial update; supply only the fields being changed.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        quantity: { type: integer, minimum: 1 }

    Ticket:
      description: One seat. The code is unique and unguessable (feature 005).
      type: object
      required: [id, code, status, checkedInAt, seat]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$', example: 7KQ2M9XWAB4C }
        status: { type: string, enum: [VALID, VOID] }
        checkedInAt: { type: [string, 'null'], format: date-time }
        seat:
          description: Feature 007. The seat this ticket is for; `null` for general admission.
          oneOf:
            - $ref: '#/components/schemas/SeatLabel'
            - type: 'null'

    Order:
      description: One customer's purchase for one event (feature 005).
      type: object
      required:
        [
          id,
          eventId,
          tierId,
          tierName,
          customerUsername,
          holderName,
          quantity,
          unitPrice,
          totalPrice,
          status,
          createdAt,
          refundedAt,
          tickets,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        tierId:
          type: [string, 'null']
          format: uuid
          description: '`null` for an event sold without tiers.'
        tierName: { type: [string, 'null'] }
        customerUsername: { type: string, example: customer1 }
        holderName:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          example: Jordan Lee
          description: |
            Feature 017. The buyer's name, on every ticket of the order; `null` for orders placed
            before feature 017.
        quantity: { type: integer, minimum: 1, maximum: 10 }
        unitPrice: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        totalPrice: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        status: { type: string, enum: [CONFIRMED, REFUNDED] }
        createdAt: { type: string, format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }

    OrderInput:
      type: object
      required: [quantity, holderName]
      properties:
        tierId:
          type: string
          format: uuid
          description: Required for an event with tiers; omitted for one without.
        quantity: { type: integer, minimum: 1, maximum: 10 }
        requestId:
          type: string
          format: uuid
          description: |
            Feature 006. A new random id for each confirmation the customer makes, reused only to
            repeat that same confirmation. Optional; see `createOrder`.
        seats:
          type: array
          minItems: 1
          maxItems: 10
          description: Feature 007. Required for reserved seating, one per ticket; see `createOrder`.
          items: { $ref: '#/components/schemas/SeatChoice' }
        holderName:
          type: string
          maxLength: 400
          example: Jordan Lee
          description: |
            Feature 017. The buyer's own name, for every ticket of the order; see `createOrder` for
            the rules. `maxLength` only bounds the request: the name itself is at most 100
            characters after trimming.

    MyOrder:
      description: One of the signed-in customer's orders, with a summary of its event (feature 006).
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [event]
          properties:
            event: { $ref: '#/components/schemas/OrderEvent' }

    OrderEvent:
      description: The parts of an event My tickets shows next to an order (feature 006).
      type: object
      required: [id, name, startsAt, endsAt, status, location]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Season Opener }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        location:
          type: object
          required: [id, name, address, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: KFC Yum! Center }
            address:
              type: string
              minLength: 1
              maxLength: 500
              description: Feature 019. The venue's full one-line address, the same as its `Location.address`, for the customer's calendar entry.
              example: '1 ARENA PLAZA, LOUISVILLE, KY 40202'
            timeZone:
              allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
              description: |
                Feature 020. The venue's time zone, for showing the event's times. Required from
                1.14.0 (#88).

    Availability:
      description: |
        Tickets left for an event and its tiers, and whether sales are closed (feature 006).
        Valid tickets only. Guidance, not a reservation.
      type: object
      required: [eventId, ticketsLeft, salesClosed, tiers]
      properties:
        eventId: { type: string, format: uuid }
        customerLimit:
          oneOf:
            - $ref: '#/components/schemas/CustomerLimit'
            - type: 'null'
          description: |
            Feature 016. The caller's standing against the event's `maxTicketsPerCustomer`;
            `null` when the event has no limit or the caller is not a customer. Always sent once
            016 is implemented; optional for the same reason as `Event.maxTicketsPerCustomer`.
            Clients treat a missing value as `null`.
        ticketsLeft:
          type: integer
          minimum: 0
          description: The event's ticket capacity minus its valid tickets.
        salesClosed:
          type: [string, 'null']
          enum: [CANCELLED, STARTED, null]
          description: '`null` while tickets can be ordered; otherwise why they cannot.'
        tiers:
          type: array
          description: One entry per tier, in the order `listTicketTiers` returns; empty without tiers.
          items: { $ref: '#/components/schemas/TierAvailability' }

    CustomerLimit:
      type: object
      description: Feature 016. One customer's own standing against an event's limit.
      required: [limit, held, remaining]
      properties:
        limit: { type: integer, minimum: 1, description: The event's `maxTicketsPerCustomer`. }
        held:
          type: integer
          minimum: 0
          description: The caller's valid tickets for the event, across all their orders.
        remaining:
          type: integer
          minimum: 0
          description: |
            How many more the caller may get under the limit, `limit - held`, never below 0. Tickets
            left for the event may still be fewer.

    TierAvailability:
      type: object
      required: [tierId, ticketsLeft]
      properties:
        tierId: { type: string, format: uuid }
        ticketsLeft:
          type: integer
          minimum: 0
          description: The tier's quantity minus its valid tickets, never more than the event has left.

    Section:
      description: One block of a venue's seating layout (feature 007).
      type: object
      required: [id, name, rows, seatsPerRow]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50, example: A }
        rows: { type: integer, minimum: 1, maximum: 100, example: 10 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 200, example: 20 }

    SectionInput:
      type: object
      required: [name, rows, seatsPerRow]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, example: A }
        rows: { type: integer, minimum: 1, maximum: 100 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 200 }

    LayoutInput:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          maxItems: 50
          description: In display order. Names unique ignoring case.
          items: { $ref: '#/components/schemas/SectionInput' }

    SeatingLayout:
      description: A venue's sections, in display order (feature 007).
      type: object
      required: [locationId, totalSeats, sections]
      properties:
        locationId: { type: string, format: uuid }
        totalSeats: { type: integer, minimum: 0 }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }

    SeatPosition:
      type: object
      required: [row, seat]
      properties:
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }

    SeatChoice:
      description: A seat a customer chooses when ordering (feature 007).
      type: object
      required: [sectionId, row, seat]
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }

    SeatLabel:
      description: A sold seat, by its section's name when sold (feature 007).
      type: object
      required: [section, row, seat]
      properties:
        section: { type: string, example: A }
        row: { type: integer, minimum: 1, example: 3 }
        seat: { type: integer, minimum: 1, example: 7 }

    SeatMapSection:
      type: object
      required: [sectionId, name, rows, seatsPerRow, tierId, sold, taken, reserved]
      properties:
        sectionId: { type: string, format: uuid }
        name: { type: string }
        rows: { type: integer, minimum: 1 }
        seatsPerRow: { type: integer, minimum: 1 }
        tierId:
          type: [string, 'null']
          format: uuid
          description: This section's tier for the event; `null` when unmapped.
        sold: { type: integer, minimum: 0 }
        taken:
          type: array
          description: Seats held by valid tickets. Never says by whom.
          items: { $ref: '#/components/schemas/SeatPosition' }
        reserved:
          type: array
          description: Seats in active reservations (feature 015). Never says by whom.
          items: { $ref: '#/components/schemas/SeatPosition' }

    SeatMap:
      description: An event's seats, sold or open (feature 007), or reserved (feature 015).
      type: object
      required: [eventId, reservedSeating, sections]
      properties:
        eventId: { type: string, format: uuid }
        reservedSeating: { type: boolean }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatMapSection' }

    SeatMapChange:
      description: Seats of one event that changed state, as sent by `streamSeatMap` (feature 015).
      type: object
      required: [eventId, changes]
      properties:
        eventId: { type: string, format: uuid }
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SeatStateChange' }

    SeatStateChange:
      description: One seat's new state. Never says who reserved or bought it (feature 015).
      type: object
      required: [sectionId, row, seat, state]
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }
        state: { type: string, enum: [open, reserved, sold] }

    ReservedSeat:
      description: A seat in a reservation, by section id and by its section's name (feature 015).
      type: object
      required: [sectionId, section, row, seat]
      properties:
        sectionId: { type: string, format: uuid }
        section: { type: string, example: A }
        row: { type: integer, minimum: 1, example: 1 }
        seat: { type: integer, minimum: 1, example: 5 }

    Reservation:
      description: |
        The caller's active hold on seats of one event, for 5 minutes (feature 015). It ends at
        `expiresAt` (exclusive) unless bought or released first; it is never extended.
      type: object
      required: [eventId, tierId, seats, createdAt, expiresAt, secondsLeft]
      properties:
        eventId: { type: string, format: uuid }
        tierId:
          type: [string, 'null']
          format: uuid
          description: The tier of every seat; `null` for an event without tiers.
        seats:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/ReservedSeat' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Exactly 5 minutes after `createdAt`.
        secondsLeft:
          type: integer
          minimum: 0
          maximum: 300
          description: |
            Whole seconds until `expiresAt`, by the Backend's clock when it answered. Clients count
            down from this, not from `expiresAt`, so their own clock can't skew it.

    ReservationInput:
      type: object
      required: [seats]
      additionalProperties: false
      properties:
        seats:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/SeatChoice' }

    ReservationRelease:
      type: object
      additionalProperties: false
      properties:
        seats:
          type: array
          minItems: 1
          maxItems: 10
          description: The seats to release; omit to release all of them.
          items: { $ref: '#/components/schemas/SeatChoice' }

    ReservationReleaseResult:
      type: object
      required: [reservation]
      properties:
        reservation:
          oneOf:
            - $ref: '#/components/schemas/Reservation'
            - type: 'null'
          description: What is left; `null` once no seat is left.

    ReleasedSeats:
      type: object
      required: [released]
      properties:
        released:
          type: integer
          minimum: 0
          description: How many reserved seats were released, across every event.

    SeatingInput:
      type: object
      required: [reservedSeating, sections]
      properties:
        reservedSeating: { type: boolean }
        sections:
          type: array
          description: The complete set of mappings; sections left out become unmapped.
          items:
            type: object
            required: [sectionId, tierId]
            properties:
              sectionId: { type: string, format: uuid }
              tierId: { type: string, format: uuid }

    Cancellation:
      type: object
      required: [event, ordersRefunded, ticketsVoided]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        ordersRefunded: { type: integer, minimum: 0 }
        ticketsVoided: { type: integer, minimum: 0 }

    TierSales:
      type: object
      required: [tierId, name, price, quantity, ticketsSold, revenue]
      properties:
        tierId: { type: string, format: uuid }
        name: { type: string }
        price: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        quantity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }

    EventSales:
      type: object
      required:
        [
          eventId,
          name,
          venueName,
          startsAt,
          timeZone,
          status,
          ticketCapacity,
          ticketsSold,
          checkedIn,
          revenue,
          tiers,
        ]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        venueName: { type: string }
        startsAt: { type: string, format: date-time }
        timeZone:
          allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
          description: |
            Feature 020. The venue's time zone, for showing `startsAt`. Required from 1.14.0
            (#88).
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        ticketCapacity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        checkedIn: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TierSales' }

    SalesReport:
      type: object
      required: [generatedAt, totals, events]
      properties:
        generatedAt: { type: string, format: date-time }
        totals:
          type: object
          required: [events, ticketCapacity, ticketsSold, checkedIn, revenue]
          properties:
            events: { type: integer, minimum: 0, description: Scheduled events. }
            ticketCapacity:
              { type: integer, minimum: 0, description: Capacity of scheduled events. }
            ticketsSold: { type: integer, minimum: 0 }
            checkedIn: { type: integer, minimum: 0 }
            revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventSales' }

    EntryLookupInput:
      description: Feature 017. A ticket code as typed or scanned.
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          example: 7kq2-m9xw-ab4c
          description: |
            A ticket code (letter case, spaces, and dashes are ignored), or, from feature 018, a
            live code from the Customer app (`QP1:<ticket id, 32 hex digits>:<window>:<MAC>`).

    EntryTicket:
      description: Feature 017. A ticket as the gate agent sees it, and what they may do with it.
      type: object
      required:
        [
          ticketId,
          code,
          orderId,
          state,
          event,
          tierName,
          seat,
          holderName,
          usedAt,
          entryOpensAt,
          unusedOnOrder,
          verifiedBy,
        ]
      properties:
        ticketId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$' }
        orderId: { type: string, format: uuid }
        state:
          type: string
          enum: [ADMITTABLE, USED, VOID, OTHER_EVENT, NOT_OPEN, ENDED]
        event:
          description: The ticket's own event (another event's when `state` is `OTHER_EVENT`).
          type: object
          required: [id, name, startsAt, endsAt, timeZone]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: Season Opener }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            timeZone:
              allOf: [{ $ref: '#/components/schemas/UsTimeZone' }]
              description: |
                Feature 020. The event's venue's time zone, for showing its times, `usedAt`, and
                `entryOpensAt`. Required from 1.14.0 (#88).
        tierName:
          type: [string, 'null']
          description: '`null` for an event sold at its base price.'
        seat:
          oneOf:
            - $ref: '#/components/schemas/SeatLabel'
            - type: 'null'
        holderName:
          type: [string, 'null']
          description: '`null` for a ticket bought before feature 017 ("No name on ticket").'
        usedAt:
          type: [string, 'null']
          format: date-time
          description: When it was admitted; `null` unless `state` is `USED`.
        entryOpensAt:
          type: string
          format: date-time
          description: Two hours before the ticket's event starts.
        unusedOnOrder:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Valid, unused tickets of this ticket's order for this event, this one included.
        verifiedBy:
          type: string
          enum: [LIVE_CODE, TICKET_CODE]
          description: |
            Feature 018. `LIVE_CODE` when the lookup was by a live code the Backend verified in
            its window: no ID check is needed. `TICKET_CODE` for a typed or printed code: the ID
            check is always needed.

    TicketEntryKey:
      description: Feature 018. A ticket's entry key and the Backend's time.
      type: object
      required: [ticketId, key, serverTime]
      properties:
        ticketId: { type: string, format: uuid }
        key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: The ticket's 32-byte entry secret, base64url without padding.
        serverTime:
          type: string
          format: date-time
          description: The Backend's clock when it answered, with milliseconds.

    AdmitInput:
      description: Feature 017.
      type: object
      required: [ticketId, wholeOrder]
      properties:
        ticketId: { type: string, format: uuid }
        wholeOrder:
          type: boolean
          description: Also admit every other valid, unused ticket of the same order.

    EntryResult:
      description: Feature 017. What one admit request did.
      type: object
      required: [admitted, alreadyUsed]
      properties:
        admitted:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/EntryTicketRef' }
        alreadyUsed:
          description: Tickets of the order that were already used when `wholeOrder` arrived.
          type: array
          maxItems: 9
          items: { $ref: '#/components/schemas/EntryTicketRef' }

    EntryTicketRef:
      description: Feature 017. One ticket and the time of its entry.
      type: object
      required: [ticketId, code, usedAt]
      properties:
        ticketId: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$' }
        usedAt: { type: string, format: date-time }

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Every non-2xx response uses this shape. `code` is the stable machine-readable
        discriminator clients branch on; `message` is human-readable and may change.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION_FAILED
                - NOT_FOUND
                - SCHEDULING_CONFLICT
                - VENUE_HAS_EVENTS
                - CAPACITY_EXCEEDED
                - TIER_NAME_TAKEN
                - SOLD_OUT
                - EVENT_CANCELLED
                - EVENT_HAS_ORDERS
                - TIER_HAS_ORDERS
                - SALES_CLOSED
                - REQUEST_ID_REUSED
                - SEAT_TAKEN
                - LAYOUT_IN_USE
                - TICKET_LIMIT_REACHED
                - SEAT_COOLDOWN
                - RESERVATION_REQUIRED
                - ADDRESS_NOT_FOUND
                - ADDRESS_AMBIGUOUS
                - ADDRESS_SERVICE_UNAVAILABLE
                - IMAGE_LIMIT_REACHED
                - IMAGE_TOO_LARGE
                - IMAGE_TYPE_NOT_ALLOWED
                - IMAGES_CHANGED
                - IMAGE_DIMENSIONS_TOO_LARGE
                - HOLDER_NAME_INVALID
                - TICKET_NOT_FOUND
                - ENTRY_REFUSED
                - LIVE_CODE_INVALID
                - LIVE_CODE_EXPIRED
                - TIME_ZONE_REQUIRED
                - TIME_ZONE_HAS_ORDERS
                - EVENT_TIME_NOT_IN_ZONE
                - LOCAL_TIME_SKIPPED
                - UTC_OFFSET_MISMATCH
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    Unauthenticated:
      description: |
        No token, or the token is malformed, expired, signed by an unknown key, from another
        issuer, or for another audience. The message does not say which check failed.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: UNAUTHENTICATED
              message: A valid access token is required.

    Forbidden:
      description: The token is valid, but the caller lacks a role this operation requires.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: FORBIDDEN
              message: This action requires the queuepass-admin role.
              details:
                requiredRoles: [queuepass-admin]

    ValidationFailed:
      description: Request shape or field validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: Request validation failed.
              details:
                fields:
                  endsAt: must be later than startsAt
                  seatingCapacity: must be a positive whole number

    EventTimeRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`, including, feature 020, an
        event time without a UTC offset or a date only), or, feature 020, an event time does not
        fit the venue's time zone: the local time is skipped by a daylight-saving
        change (`LOCAL_TIME_SKIPPED`), or it is stated with an offset other than the venue's at
        that local time (`UTC_OFFSET_MISMATCH`). Nothing was saved.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field failed validation
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      endsAt: must be later than startsAt
            noUtcOffset:
              summary: Feature 020. An event time without a UTC offset
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      startsAt: must include a UTC offset, for example 2026-10-01T19:00:00-04:00
            localTimeSkipped:
              summary: Feature 020. Clocks spring forward past this time at the venue
              value:
                error:
                  code: LOCAL_TIME_SKIPPED
                  message: "2:30 AM on Mar 14, 2027 doesn't exist in Eastern Time: clocks jump from 2:00 AM to 3:00 AM. Choose another time."
                  details:
                    field: startsAt
                    localTime: '2027-03-14T02:30'
                    timeZone: America/New_York
                    skippedFrom: '02:00'
                    skippedTo: '03:00'
            utcOffsetMismatch:
              summary: Feature 020. The time is stated in another zone than the venue's
              value:
                error:
                  code: UTC_OFFSET_MISMATCH
                  message: "startsAt is stated with offset -07:00, but Freedom Hall is in Eastern Time, which is -04:00 at that time. Send the venue's local time with its offset."
                  details:
                    field: startsAt
                    localTime: '2026-10-01T19:00'
                    timeZone: America/New_York
                    sentOffset: '-07:00'
                    expectedOffsets: ['-04:00']

    OrderRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`), or, feature 017, the
        holder's name is missing or invalid (`HOLDER_NAME_INVALID`, with `details.reason`:
        `MISSING`, `TOO_LONG`, `NO_LETTER`, or `CONTROL_CHARACTER`; a name that is empty after
        trimming is `MISSING`). Nothing was recorded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field failed validation
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields:
                      quantity: must be between 1 and 10
            holderNameInvalid:
              summary: The holder's name has no letter
              value:
                error:
                  code: HOLDER_NAME_INVALID
                  message: The name on the tickets must contain at least one letter.
                  details:
                    reason: NO_LETTER

    AddressRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`), or, for a venue address
        (feature 013), the address service found no match (`ADDRESS_NOT_FOUND`), or more than one,
        or one match at a different ZIP code or house number than sent (`ADDRESS_AMBIGUOUS`, with
        up to 5 matches in `details.candidates`, each in the one-line form `STREET, CITY, ST ZIP`,
        or as the service returned it when it cannot be split). A match the Backend cannot split
        is reported as `ADDRESS_NOT_FOUND`. Nothing was saved.
        After either address refusal, the client may resend the same request with
        `acceptUnverifiedAddress: true` to save the venue as not verified.

        Feature 020: `TIME_ZONE_REQUIRED` when the zone cannot be worked out from the address and
        the state has more than one (`details.state`, `details.timeZones`); resend with `timeZone`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field is missing or malformed
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields: ['zip must be 5 digits, or 5 digits, a hyphen, and 4 digits']
            addressNotFound:
              summary: The address service found no such US address
              value:
                error:
                  code: ADDRESS_NOT_FOUND
                  message: "We couldn't find 1 Nowhere Blvd, Louisville, KY 40202 as a US address. Check the street, city, state, and ZIP code."
                  details:
                    address: '1 Nowhere Blvd, Louisville, KY 40202'
            addressAmbiguous:
              summary: The address matches more than one US address
              value:
                error:
                  code: ADDRESS_AMBIGUOUS
                  message: '100 Main St, Springfield, IL 62701 matches more than one US address. Enter one of these.'
                  details:
                    address: '100 Main St, Springfield, IL 62701'
                    candidates:
                      [
                        '100 N MAIN ST, SPRINGFIELD, IL 62701',
                        '100 S MAIN ST, SPRINGFIELD, IL 62701',
                      ]
            addressMoved:
              summary: The one match has a different ZIP code or house number than sent
              value:
                error:
                  code: ADDRESS_AMBIGUOUS
                  message: 'We found a different US address for 1540 University Dr, Lexington, KY 40508. Did you mean this one? Enter it to use it.'
                  details:
                    address: '1540 University Dr, Lexington, KY 40508'
                    candidates: ['1540 UNIVERSITY CT, LEXINGTON, KY 40503']
            timeZoneRequired:
              summary: Feature 020. Saved anyway in a state with more than one time zone
              value:
                error:
                  code: TIME_ZONE_REQUIRED
                  message: "Kentucky has more than one time zone. Choose this venue's time zone: Eastern Time or Central Time."
                  details:
                    state: KY
                    timeZones: [America/New_York, America/Chicago]

    AddressServiceUnavailable:
      description: |
        Feature 013: the address service could not be reached, did not answer within 5 seconds,
        or answered with an error, so the address could not be verified. Nothing was saved. The
        same request may succeed later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: ADDRESS_SERVICE_UNAVAILABLE
              message: "We can't verify the address right now. Nothing was saved. Try again in a minute."

    ImageRejected:
      description: |
        Feature 014. The request's shape is wrong (`VALIDATION_FAILED`: no `file` part, other
        parts, or a malformed event id), or the picture is too large in pixels
        (`IMAGE_DIMENSIONS_TOO_LARGE`). Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: No file part
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields: ['Send exactly one file, in a part named file.']
            dimensionsTooLarge:
              summary: Too many pixels
              value:
                error:
                  code: IMAGE_DIMENSIONS_TOO_LARGE
                  message: This picture is 20000 × 20000 pixels. A picture can be at most 16,384 pixels on each side and 40 megapixels in all.
                  details:
                    width: 20000
                    height: 20000
                    maxSide: 16384
                    maxPixels: 40000000

    ImageTooLarge:
      description: Feature 014. The image is over 5 MB (5,242,880 bytes). Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TOO_LARGE
              message: An image can be at most 5 MB.
              details:
                maxBytes: 5242880

    ImageTypeNotAllowed:
      description: |
        Feature 014. The file's content is not a still JPEG, PNG, or WebP picture, whatever its name
        or declared type: another format, an animated PNG or WebP, or a file whose header cannot be
        read or whose segments or chunks run past the end of the file. Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TYPE_NOT_ALLOWED
              message: This file is not a JPG, PNG, or WebP picture.
              details:
                allowed: [image/jpeg, image/png, image/webp]

    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: NOT_FOUND
              message: No venue exists with id 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40.

    EntryNotFound:
      description: |
        Feature 017. The event does not exist (`NOT_FOUND`), or no ticket has this code or id
        (`TICKET_NOT_FOUND`). Feature 018: a live code QueuePass did not make, or that names no
        ticket (`LIVE_CODE_INVALID`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            ticketNotFound:
              value:
                error:
                  code: TICKET_NOT_FOUND
                  message: No ticket has the code 7KQ2M9XWAB4D.
            liveCodeInvalid:
              summary: Feature 018
              value:
                error:
                  code: LIVE_CODE_INVALID
                  message: This is not a valid QueuePass code.

    Conflict:
      description: |
        The request violates a business rule; `code` says which. For `SCHEDULING_CONFLICT`,
        `details.conflictingEvent` names the event responsible. It is `null` only when a
        concurrent request won the race and the database constraint refused this write. Feature
        020: the message gives times in the venue's local time with the zone's abbreviation, the
        start with its date and the end with its date when it differs; for
        a venue's time-zone change, `details.event` names the second event of the pair.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            entryRefusedUsed:
              summary: Feature 017. The ticket was already admitted
              value:
                error:
                  code: ENTRY_REFUSED
                  message: This ticket was already used.
                  details:
                    reason: USED
                    usedAt: '2026-10-24T19:42:10-04:00'
            entryRefusedNotOpen:
              summary: Feature 017. Entry has not opened yet
              value:
                error:
                  code: ENTRY_REFUSED
                  message: Entry has not opened for this event.
                  details:
                    reason: NOT_OPEN
                    entryOpensAt: '2026-10-24T17:00:00-04:00'
            schedulingConflict:
              summary: Venue already committed during this window
              value:
                error:
                  code: SCHEDULING_CONFLICT
                  message: "This venue is already committed from Oct 1, 2026, 6:00 PM EDT to 9:00 PM EDT by 'Season Opener'. Events at the same venue must be at least 60 minutes apart."
                  details:
                    bufferMinutes: 60
                    conflictingEvent:
                      id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                      name: Season Opener
                      startsAt: '2026-10-01T18:00:00-04:00'
                      endsAt: '2026-10-01T21:00:00-04:00'
            schedulingConflictRace:
              summary: Lost a concurrent write race
              value:
                error:
                  code: SCHEDULING_CONFLICT
                  message: This venue was committed for an overlapping window by another request. Reload and try again.
                  details:
                    bufferMinutes: 60
                    conflictingEvent: null
            capacityExceeded:
              summary: Ticket capacity above the venue's seating capacity
              value:
                error:
                  code: CAPACITY_EXCEEDED
                  message: 'Ticket capacity 25000 exceeds the seating capacity of KFC Yum! Center (22090).'
                  details:
                    seatingCapacity: 22090
                    requestedTicketCapacity: 25000
            tierCapacityExceeded:
              summary: Tier quantities would exceed the event's ticket capacity
              value:
                error:
                  code: CAPACITY_EXCEEDED
                  message: 'Season Opener has 1000 tickets and 800 are already in tiers; only 200 remain, so 500 cannot be added.'
                  details:
                    totalTicketCapacity: 1000
                    allocated: 800
                    requested: 500
                    remaining: 200
            tierNameTaken:
              summary: Another tier of this event already has that name
              value:
                error:
                  code: TIER_NAME_TAKEN
                  message: "Season Opener already has a tier named 'VIP'."
            soldOut:
              summary: Fewer tickets left than requested
              value:
                error:
                  code: SOLD_OUT
                  message: 'Only 1 VIP ticket is left for Season Opener; 2 were requested.'
                  details:
                    available: 1
                    requested: 2
            ticketLimitReached:
              summary: The order would put the customer over the event's limit
              value:
                error:
                  code: TICKET_LIMIT_REACHED
                  message: 'Season Opener allows 8 tickets per customer. You already hold 5, so you can get 3 more; 5 were requested.'
                  details:
                    limit: 8
                    held: 5
                    remaining: 3
                    requested: 5
            eventCancelled:
              summary: The event is cancelled
              value:
                error:
                  code: EVENT_CANCELLED
                  message: Season Opener is cancelled and can no longer be changed or sold.
            salesClosed:
              summary: The event has started, so sales are closed (feature 006)
              value:
                error:
                  code: SALES_CLOSED
                  message: Sales for Season Opener closed when it started.
            requestIdReused:
              summary: A requestId already used for a different order (feature 006)
              value:
                error:
                  code: REQUEST_ID_REUSED
                  message: This requestId was already used for a different order. Start a new confirmation.
            seatTaken:
              summary: Seats already held by valid tickets (feature 007)
              value:
                error:
                  code: SEAT_TAKEN
                  message: 'Section A, Row 1, Seat 5 is already taken.'
                  details:
                    seats:
                      - { section: A, row: 1, seat: 5 }
            seatReserved:
              summary: Seats in another customer's reservation (feature 015)
              value:
                error:
                  code: SEAT_TAKEN
                  message: 'Section A, Row 1, Seat 5 is reserved by another customer.'
                  details:
                    seats:
                      - { section: A, row: 1, seat: 5 }
                    reserved:
                      - { section: A, row: 1, seat: 5 }
            seatCooldown:
              summary: Seats this customer's own reservation released less than 2 minutes ago (feature 015)
              value:
                error:
                  code: SEAT_COOLDOWN
                  message: 'You released Section A, Row 1, Seat 5 less than 2 minutes ago. You can reserve it again at 19:02:30.'
                  details:
                    seats:
                      - { section: A, row: 1, seat: 5 }
                    availableAt: '2026-10-20T19:02:30-04:00'
            reservationRequired:
              summary: A seated order for seats not in the caller's reservation (feature 015)
              value:
                error:
                  code: RESERVATION_REQUIRED
                  message: 'Your reservation for Season Opener ran out. Reserve the seats again to get them.'
                  details:
                    seats:
                      - { section: A, row: 1, seat: 5 }
                    expired: true
            layoutInUse:
              summary: A layout that seated sales depend on (feature 007)
              value:
                error:
                  code: LAYOUT_IN_USE
                  message: 'The seating layout of Seat Hall is in use by "Season Opener", which has sold seats.'
                  details:
                    events:
                      - { id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40, name: Season Opener }
            imageLimitReached:
              summary: The event already has 5 images (feature 014)
              value:
                error:
                  code: IMAGE_LIMIT_REACHED
                  message: Season Opener already has 5 images, the most an event can have. Remove one to add another.
                  details:
                    limit: 5
                    count: 5
            imagesChanged:
              summary: The event's images changed since the order was chosen (feature 014)
              value:
                error:
                  code: IMAGES_CHANGED
                  message: The images of Season Opener changed since you loaded them. Check them and try again.
                  details:
                    imageIds:
                      [2b1e0c3d-4f5a-4b6c-8d7e-9f0a1b2c3d4e, 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b]
            eventHasOrders:
              summary: Deleting an event that has orders
              value:
                error:
                  code: EVENT_HAS_ORDERS
                  message: 'Cannot delete "Season Opener": it has 3 orders. Cancel it instead, which keeps its records.'
                  details:
                    orderCount: 3
