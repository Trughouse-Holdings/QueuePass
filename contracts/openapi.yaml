openapi: 3.1.0
info:
  title: QueuePass Backend API
  version: 1.8.0
  description: |
    The single, authoritative API contract for QueuePass (Constitution I). Every front end builds
    against this document. An endpoint is added or changed here, in a reviewed pull request,
    before it is implemented.

    **Authentication**: every operation except `getHealth` requires
    `Authorization: Bearer <access token>`, where the token is a JWT issued by the Keycloak realm
    `queuepass`. The Backend checks its signature against the realm's published keys, its issuer
    (`http://localhost:8080/realms/queuepass`), that its audience includes `queuepass-api`, and
    that it is not expired (30-second clock tolerance). Any failure is `401 UNAUTHENTICATED`.

    **Authorization**: `x-required-roles` on each operation lists the Keycloak realm roles that
    may call it. An empty list means any signed-in user. Roles are read from the token's
    `realm_access.roles`. A valid token without a listed role is `403 FORBIDDEN`. A test fails if
    the Backend's role checks differ from this document.

    **Authority**: this API is the only path to persistent state. No front end holds a database
    connection. Every business rule, including the scheduling conflict rule, is enforced here.

    **Times**: all timestamps are RFC 3339 with an explicit offset, stored as `timestamptz` and
    compared in UTC. Event windows are half-open, `[startsAt, endsAt)`.

    **Errors**: every non-2xx response is an `ErrorEnvelope`. Branch on `error.code`, never on
    `error.message`.

    **Planned operations**: an operation marked `x-planned: '<feature>'` is declared in that
    feature's spec and plan pull request, before its implementation (Constitution I). Until the
    implementation merges, the Backend does not serve it (`404`). The route-coverage test skips a
    planned operation only while no route serves it. Feature 014's image operations are planned.

servers:
  - url: http://localhost:3000
    description: Local docker compose

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health and identity (feature 001)
  - name: hello
    description: One greeting per front end, for the hello-world pages (feature 001)
  - name: venues
    description: |
      Venue catalog (feature 002). A venue is a `Location` in this API; the paths keep that name.
  - name: events
    description: Event scheduling with the 60-minute double-booking rule (feature 002)
  - name: tiers
    description: Ticket tiers per event (feature 004)
  - name: orders
    description: |
      Orders, tickets, attendee lists, and cancellation (feature 005); customer purchase,
      availability, and a customer's own orders (feature 006)
  - name: reports
    description: Sales reporting for admins (feature 005)
  - name: seating
    description: Venue seating layouts, reserved seating per event, and seat maps (feature 007)
  - name: images
    description: Up to 5 images per event, shown to customers as a gallery (feature 014)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      description: Used by Compose health checks. The only operation that needs no token.
      operationId: getHealth
      security: []
      x-required-roles: public
      responses:
        '200':
          description: Service is up and the database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [up] }

  /me:
    get:
      tags: [system]
      summary: Who am I
      description: |
        Returns the caller's identity as read from the validated token (spec 001 FR-022). Nothing
        is looked up in a database.
      operationId: getMe
      x-required-roles: []
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /me/orders:
    get:
      tags: [orders]
      summary: My orders
      description: |
        Every order the signed-in customer has placed, newest first, each with its tickets and a
        summary of its event (feature 006). The customer is the token's subject; no parameter can
        name another customer. Orders made by the demo script belong to stand-in identities and
        never appear here.
      operationId: listMyOrders
      x-required-roles: [customer]
      responses:
        '200':
          description: The caller's orders, newest first; empty when there are none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyOrder' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/admin:
    get:
      tags: [hello]
      summary: Greeting for the Admin app
      operationId: getAdminHello
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: admin,
                  appName: QueuePass Admin,
                  username: admin1,
                  message: 'Hello, admin1! Welcome to QueuePass Admin.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/customer:
    get:
      tags: [hello]
      summary: Greeting for the Customer app
      operationId: getCustomerHello
      x-required-roles: [customer]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: customer,
                  appName: QueuePass,
                  username: customer1,
                  message: 'Hello, customer1! Welcome to QueuePass.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hello/booth:
    get:
      tags: [hello]
      summary: Greeting for the Ticket Booth app
      operationId: getBoothHello
      x-required-roles: [gate-agent]
      responses:
        '200':
          description: A greeting naming the caller and the app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                {
                  app: booth,
                  appName: QueuePass Ticket Booth,
                  username: agent1,
                  message: 'Hello, agent1! Welcome to QueuePass Ticket Booth.',
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /locations:
    get:
      tags: [venues]
      summary: List all venues
      description: |
        Ordered by name, A to Z. The Customer app (feature 003) relies on this order. Optional
        `q` filter (feature 004), used by the Admin app's venue search.
      operationId: listLocations
      x-required-roles: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only venues whose name or address contains this text, ignoring case and
            surrounding spaces. Blank means no filter.
      responses:
        '200':
          description: Matching venues, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [venues]
      summary: Create a venue
      description: |
        Rejects an empty name, a missing or malformed address field, and a non-positive capacity
        (`400 VALIDATION_FAILED`).

        Feature 013: the address (`street`, `city`, `state`, `zip`) is then checked with the
        address service (the US Census Geocoder) before anything is saved. Exactly one match is
        accepted, and the venue is saved with the service's standard form of the four fields and
        `addressVerified: true`; `address` is built from them as `STREET, CITY, ST ZIP`. No
        match is `400 ADDRESS_NOT_FOUND`; several matches are `400 ADDRESS_AMBIGUOUS`, listing
        them.

        Save anyway: with `acceptUnverifiedAddress: true`, no match or several matches instead
        save the venue with the four fields as sent (trimmed, runs of whitespace collapsed to one
        space, ZIP cut to 5 digits) and
        `addressVerified: false`. The address service is still asked first, and the flag changes
        nothing when it finds exactly one match.

        When the service cannot be reached, does not answer within 5 seconds, or answers with an
        error, the save is refused with `503 ADDRESS_SERVICE_UNAVAILABLE` and nothing is saved,
        with or without `acceptUnverifiedAddress`.
      operationId: createLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Venue created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }

  /locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [venues]
      summary: Retrieve one venue
      operationId: getLocation
      x-required-roles: []
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [venues]
      summary: Update a venue
      description: |
        Lowering `seatingCapacity` below the `totalTicketCapacity` of any event already
        scheduled at this venue is refused with `CAPACITY_EXCEEDED`. Feature 007: while the venue
        has a seating layout, its `seatingCapacity` is the layout's total seats and cannot be set
        here (`400`).

        Feature 013: `street`, `city`, `state`, and `zip` are sent all together or not at all
        (`400`). When they are sent and differ from the stored ones (ignoring case and extra
        spaces), the address is checked exactly as in `createLocation`, after every other check
        on this request and before anything is saved, including `acceptUnverifiedAddress`. An
        edit without address fields, or with the same address, never calls the address service
        and keeps `addressVerified` as it is. `acceptUnverifiedAddress` without the four address
        fields is `400`. A venue saved before feature 013 keeps its `address`, has `null` parts,
        and has `addressVerified: false` until its address is changed.
      operationId: updateLocation
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Venue updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/AddressRejected' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AddressServiceUnavailable' }
        '409':
          description: An existing event's ticket capacity exceeds the proposed seating capacity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: CAPACITY_EXCEEDED
                  message: "Cannot reduce seating capacity to 500; event 'Season Opener' has a ticket capacity of 900."
                  details:
                    proposedSeatingCapacity: 500
                    conflictingEvent:
                      id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                      name: Season Opener
                      totalTicketCapacity: 900
    delete:
      tags: [venues]
      summary: Delete a venue
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first.

        Refused with `409 VENUE_HAS_EVENTS` while any event is scheduled at this venue. The
        service counts the events so the message and `details.eventCount` are specific; the
        database's `ON DELETE RESTRICT` is the guarantee, so no client can orphan events. If an
        event is added concurrently, the database refuses and `eventCount` is omitted.
      operationId: deleteLocation
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Venue deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Events are still scheduled at this venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueHasEvents' }
              example:
                error:
                  code: VENUE_HAS_EVENTS
                  message: 'Cannot delete "Freedom Hall": 3 events are still scheduled there. Delete or move them first.'
                  details:
                    eventCount: 3

  /locations/{id}/layout:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The venue.
    get:
      tags: [seating]
      summary: A venue's seating layout
      description: |
        The venue's sections in display order, and their total seats (feature 007). `sections` is
        empty when the venue has no layout.
      operationId: getLayout
      x-required-roles: []
      responses:
        '200':
          description: The layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [seating]
      summary: Replace a venue's seating layout
      description: |
        Replaces every section with the given ones, in order (feature 007). Section names must be
        unique ignoring case (`400`). Saving sets the venue's `seatingCapacity` to the layout's
        total seats, and the `totalTicketCapacity` of every scheduled event at the venue with
        reserved seating to the same total. Refused when that total is below the
        `totalTicketCapacity` of a scheduled general-admission event at the venue (`409
        CAPACITY_EXCEEDED`, naming it), and while any scheduled event at the venue with reserved
        seating has valid tickets (`409 LAYOUT_IN_USE`, `details.events`). Every event's section
        mappings at this venue are dropped, because the old sections no longer exist, so their
        tiers' quantities become 0 until remapped.

        Feature 016: also refused when the total is below the `maxTicketsPerCustomer` of a
        scheduled event at the venue with reserved seating (`409 CAPACITY_EXCEEDED`, naming it);
        lower its limit first.
      operationId: replaceLayout
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutInput' }
      responses:
        '200':
          description: The new layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatingLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [seating]
      summary: Remove a venue's seating layout
      description: |
        Removes every section (feature 007). Refused as `replaceLayout` is, and also while any
        scheduled event at the venue has reserved seating on (`409 LAYOUT_IN_USE`). The venue
        keeps its last `seatingCapacity`, which can be set by `updateLocation` again.
      operationId: deleteLayout
      x-required-roles: [queuepass-admin]
      responses:
        '204': { description: Layout removed. }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events:
    get:
      tags: [events]
      summary: List all events
      description: |
        Each event embeds its venue. Ordered by `startsAt`, soonest first; the Customer app
        (feature 003) relies on this order. Optional filters, combinable: `locationId` (used by the
        Admin app's venue page), and `q`, `from`, `to` (feature 004, the Admin app's event search).
      operationId: listEvents
      x-required-roles: []
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Restrict results to events at one venue.
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
          description: |
            Keep only events whose name contains this text, ignoring case and surrounding
            spaces. Blank means no filter.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Keep only events with `startsAt` at or after this instant.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: |
            Keep only events with `startsAt` strictly before this instant. When both are given,
            `from` must be earlier than `to`, otherwise `400`.
      responses:
        '200':
          description: Matching events, ordered by start time.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [events]
      summary: Schedule an event
      description: |
        Rejects, in this order: request-shape and field validation, unknown venue, ticket
        capacity above the venue's seating capacity, and a scheduling conflict at that venue.

        Feature 016: `maxTicketsPerCustomer`, when given, must be from 1 to the event's
        `totalTicketCapacity`, where an omitted capacity is the venue's `seatingCapacity` (`400`
        otherwise). It is checked after the venue's seating capacity.
      operationId: createEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Event scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [events]
      summary: Retrieve one event
      operationId: getEvent
      x-required-roles: []
      responses:
        '200':
          description: The event, with its venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [events]
      summary: Update an event
      description: |
        Includes moving the event to a different venue or time window. The conflict rule is
        re-evaluated against the destination venue and window, excluding the event itself.
        Lowering `totalTicketCapacity` below the sum of the event's tier quantities, or below
        its tickets sold, is refused with `409 CAPACITY_EXCEEDED` (features 004, 005). A
        cancelled event cannot be changed (`409 EVENT_CANCELLED`). Feature 007: while an event has
        reserved seating, it cannot move to another venue, and its `totalTicketCapacity` is its
        venue's layout total and cannot be set (`400` for either); turn reserved seating off
        first.

        Feature 016: `maxTicketsPerCustomer` may be set, changed, or cleared with `null` at any
        time before the event is cancelled. After the existing capacity checks, the limit in
        force after the update must not exceed the event's `totalTicketCapacity`: a
        `maxTicketsPerCustomer` sent in the request above it is `400`; an update that lowers
        `totalTicketCapacity` below the stored limit, without sending a new one, is `409
        CAPACITY_EXCEEDED` (`details.proposedTicketCapacity`, `details.maxTicketsPerCustomer`).
        Lowering or clearing the limit never changes an existing order or ticket.
      operationId: updateEvent
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventUpdate' }
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [events]
      summary: Delete an event
      description: |
        Permanent: there is no undo. Clients MUST ask the user to confirm first. The window the
        event occupied becomes available for scheduling again immediately. The event's ticket
        tiers are deleted with it. An event with orders cannot be deleted (`409
        EVENT_HAS_ORDERS`, feature 005); cancel it instead, which keeps its records. Feature 014:
        the event's images are deleted with it.
      operationId: deleteEvent
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Event deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/tiers:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [tiers]
      summary: List an event's ticket tiers
      description: Ordered by price, lowest first, then by name.
      operationId: listTicketTiers
      x-required-roles: []
      responses:
        '200':
          description: The event's tiers. Empty when the event sells a single admission type.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tiers]
      summary: Add a ticket tier to an event
      description: |
        Rejects, in this order: field validation, unknown event, a name already used by another
        tier of this event ignoring case (`409 TIER_NAME_TAKEN`), and a quantity that would push
        the event's tier total above its `totalTicketCapacity` (`409 CAPACITY_EXCEEDED`, with
        `details.remaining`). The capacity rule holds under concurrent requests. Also refused:
        a cancelled event (`409 EVENT_CANCELLED`), and an event that already sold tickets
        without tiers (`409 EVENT_HAS_ORDERS`), since those tickets would belong to no tier.
        Feature 007: for an event with reserved seating, `quantity` must be omitted (`400`
        otherwise): the tier's quantity is the seats in its mapped sections, 0 until mapped. For
        any other event it is required (`400`).
      operationId: createTicketTier
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTierInput' }
      responses:
        '201':
          description: Tier added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/tiers/{tierId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: tierId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: A tier of that event. A tier of a different event is `404`.
    patch:
      tags: [tiers]
      summary: Update a ticket tier
      description: |
        Same rules as creating one, evaluated against the event's other tiers. `quantity` may not
        drop below the tier's tickets sold (`409 CAPACITY_EXCEEDED`). A price change does not
        affect orders already placed. Feature 007: for an event with reserved seating, `quantity`
        cannot be set (`400`); it follows the tier's mapped sections.
      operationId: updateTicketTier
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketTierUpdate' }
      responses:
        '200':
          description: Tier updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketTier' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tiers]
      summary: Remove a ticket tier
      description: |
        Permanent. Clients MUST ask the user to confirm first. A tier with orders cannot be
        removed (`409 TIER_HAS_ORDERS`); a cancelled event's tiers cannot change (`409
        EVENT_CANCELLED`).
      operationId: deleteTicketTier
      x-required-roles: [queuepass-admin]
      responses:
        '204':
          description: Tier removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/availability:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: Tickets left and whether sales are open
      description: |
        Tickets left for the event and for each of its tiers, counting valid tickets only, and
        whether sales are closed and why, decided by the Backend's clock (feature 006). The
        counts are guidance: `createOrder` decides under its own lock, so a count can be out of
        date by the time an order arrives.

        Feature 016: for a signed-in customer and an event with a `maxTicketsPerCustomer`,
        `customerLimit` gives the limit, the caller's own valid tickets for the event, and how many
        more they may get; otherwise it is `null`. It never describes another customer.
      operationId: getEventAvailability
      x-required-roles: []
      responses:
        '200':
          description: The event's availability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seats:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [seating]
      summary: The event's seat map
      description: |
        Whether the event has reserved seating and, for each section of its venue's layout, its
        size, its tier for this event, and which seats are taken by valid tickets (feature 007).
        It never says who holds a seat. `sections` is empty when the venue has no layout.
      operationId: getSeatMap
      x-required-roles: []
      responses:
        '200':
          description: The seat map.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/seating:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    put:
      tags: [seating]
      summary: Set reserved seating and section tiers
      description: |
        Turns reserved seating on or off and replaces the event's section-to-tier mappings
        (feature 007). Reserved seating can switch only while the event has no valid tickets
        (`409 EVENT_HAS_ORDERS`), and turn on only when its venue has a layout (`400`). Each
        `sectionId` must be a section of the venue and each `tierId` a tier of the event (`400`).
        A section with valid tickets cannot move to another tier (`409 EVENT_HAS_ORDERS`). A
        cancelled event cannot change (`409 EVENT_CANCELLED`). With reserved seating on, the event's
        `totalTicketCapacity` becomes its venue's layout total and each tier's `quantity` becomes
        the seats in the sections mapped to it (0 with none); turning it off keeps those numbers.
      operationId: updateSeating
      x-required-roles: [queuepass-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatingInput' }
      responses:
        '200':
          description: The updated seat map.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/orders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Get tickets for an event
      description: |
        Places an order for the signed-in customer and issues one ticket per seat, each with a
        unique code. Payment is simulated and always succeeds. Prices are fixed on the order.

        For an event with tiers, `tierId` is required and must be one of its tiers; for an event
        without tiers, `tierId` must be omitted and the base price applies (`400` otherwise).
        Refused when the event is cancelled (`409 EVENT_CANCELLED`) or when fewer tickets are
        left than requested, in the tier or in the event (`409 SOLD_OUT`, with
        `details.available`). Sales never exceed a tier's quantity or the event's capacity,
        including under concurrent requests.

        Feature 006: sales close when the event starts; an order at or after `startsAt` is
        refused (`409 SALES_CLOSED`). A `requestId` makes a confirmation safe to repeat: if this
        customer already placed an order with the same `requestId`, that order is returned with
        `200` and nothing new is recorded, even if the event has since sold out, started, or been
        cancelled. The same `requestId` with a different event, tier, or quantity is refused
        (`409 REQUEST_ID_REUSED`). Without a `requestId`, every request places a new order.

        Feature 007: an event with reserved seating requires `seats`, exactly `quantity` distinct
        ones, each inside its venue's layout and, for an event with tiers, in a section mapped to
        the order's tier (`400` otherwise); an event without reserved seating forbids them. Seats
        already taken by valid tickets are refused (`409 SEAT_TAKEN`, `details.seats`). No seat is
        ever held by two valid tickets, including under concurrent requests. A repeated
        `requestId` must also name the same seats.

        Feature 016: for an event with a `maxTicketsPerCustomer`, an order is refused when the
        customer's valid tickets for the event, across all their orders, plus `quantity` would
        exceed it (`409 TICKET_LIMIT_REACHED`, with `details.limit`, `details.held`,
        `details.remaining`, and `details.requested`). Void tickets do not count. When fewer
        tickets are left than the customer may still get, `SOLD_OUT` is returned instead, so the
        refusal always names the smaller number. A customer never holds more than the limit,
        including under concurrent requests. A repeated `requestId` is returned as before and
        counts once.
      operationId: createOrder
      x-required-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200':
          description: |
            A repeat of an earlier request with the same `requestId`; the earlier order is
            returned unchanged and nothing new is recorded (feature 006).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Order placed; its tickets are included.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/attendees:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    get:
      tags: [orders]
      summary: List an event's orders and tickets
      description: Every order for the event, oldest first, refunded ones included.
      operationId: listAttendees
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: The event's orders, each with its tickets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [orders]
      summary: Cancel an event
      description: |
        Irreversible: clients MUST ask the user to confirm first. In one all-or-nothing step,
        voids every valid ticket, marks every confirmed order refunded (simulated), and marks the
        event cancelled. A cancelled event no longer blocks its venue's time, and refuses edits,
        tier changes, orders, and a second cancellation (`409 EVENT_CANCELLED`).
      operationId: cancelEvent
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Event cancelled, with how many orders and tickets were affected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    post:
      tags: [images]
      summary: Add an image to an event
      description: |
        Feature 014. Planned: declared ahead of its implementation (`x-planned`), see the
        `info` description.

        Adds one picture after the event's existing images. The body is `multipart/form-data` with
        exactly one part, `file`, and nothing else. The type is decided from the file's first
        bytes (its signature), never from its file name or the part's `Content-Type`: only JPEG
        (`FF D8 FF`), PNG (`89 50 4E 47 0D 0A 1A 0A`), and WebP (`RIFF`, 4 bytes, `WEBP`) are
        accepted. The stored and served `contentType` is the detected one.

        Refused, in this order: a file over 5 MB, 5,242,880 bytes (`413 IMAGE_TOO_LARGE`, while the
        body is read); a body without exactly one `file` part, or with other parts (`400`); a file
        that is not a JPEG, PNG, or WebP (`415 IMAGE_TYPE_NOT_ALLOWED`); an unknown event (`404`); a
        cancelled event (`409 EVENT_CANCELLED`); and an event that already has 5 images (`409
        IMAGE_LIMIT_REACHED`, with `details.limit` and `details.count`). An event never has more
        than 5 images, including under concurrent requests. Nothing is stored when refused.
      operationId: uploadEventImage
      x-required-roles: [queuepass-admin]
      x-planned: '014'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/EventImageUpload' }
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Image added, last in the event's order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/ImageTooLarge' }
        '415': { $ref: '#/components/responses/ImageTypeNotAllowed' }

  /events/{id}/images/order:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
    put:
      tags: [images]
      summary: Set the order of an event's images
      description: |
        Feature 014. Planned: declared ahead of its implementation (`x-planned`), see the
        `info` description.

        `imageIds` lists every image of the event, each once, in the new order; the first becomes
        the cover (`position` 1). A list that is malformed, repeats an id, or has more than 5 ids is
        `400`. A list that does not name exactly the event's current images, because another
        request added or removed one meanwhile, is `409 IMAGES_CHANGED`, with the current order in
        `details.imageIds`; nothing changes. A cancelled event is `409 EVENT_CANCELLED`.
      operationId: reorderEventImages
      x-required-roles: [queuepass-admin]
      x-planned: '014'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventImageOrder' }
      responses:
        '200':
          description: The event's images in their new order.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/EventImage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /events/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The event.
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: An image of that event. An image of a different event is `404`.
    get:
      tags: [images]
      summary: An image's content
      description: |
        Feature 014. Planned: declared ahead of its implementation (`x-planned`), see the
        `info` description.

        The picture's bytes, exactly as uploaded, with `Content-Type` set to its detected type. Like
        every operation except `getHealth`, it needs a bearer token, so a browser cannot load it
        with a plain `<img src>`: the apps fetch it with the token and show it from a local object
        URL. An image's content never changes, so the response carries `Cache-Control: private,
        max-age=31536000, immutable`, and `X-Content-Type-Options: nosniff`.
      operationId: getEventImage
      x-required-roles: []
      x-planned: '014'
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
            image/png:
              schema: { type: string, contentMediaType: image/png }
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [images]
      summary: Remove an image from an event
      description: |
        Feature 014. Planned: declared ahead of its implementation (`x-planned`), see the
        `info` description.

        Permanent. The event's other images keep their order and close the gap, so positions stay
        1 to n. A cancelled event's images cannot change (`409 EVENT_CANCELLED`).
      operationId: deleteEventImage
      x-required-roles: [queuepass-admin]
      x-planned: '014'
      responses:
        '204':
          description: Image removed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /reports/sales:
    get:
      tags: [reports]
      summary: Sales report
      description: |
        Computed on request, so it is always current. Totals cover all events; `ticketCapacity`
        and `events` in the totals count scheduled events only. Refunded orders and void tickets
        are excluded from sold, revenue, and check-ins. Events ordered by `startsAt`.
      operationId: getSalesReport
      x-required-roles: [queuepass-admin]
      responses:
        '200':
          description: Totals and per-event, per-tier figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak access token for realm `queuepass`, obtained by a front end through the OIDC
        Authorization Code flow with PKCE. Audience must include `queuepass-api`.

  schemas:
    Role:
      type: string
      enum: [queuepass-admin, gate-agent, customer]

    Me:
      type: object
      required: [sub, username, roles]
      additionalProperties: false
      properties:
        sub:
          type: string
          description: Keycloak subject identifier (the token's `sub`).
          example: 3f0c1e9a-5b7d-4c2e-9f1a-2b3c4d5e6f70
        username:
          type: string
          description: The token's `preferred_username`.
          example: admin1
        roles:
          type: array
          description: The caller's QueuePass realm roles. Other realm roles are omitted.
          items: { $ref: '#/components/schemas/Role' }
          uniqueItems: true
          example: [queuepass-admin]

    Hello:
      type: object
      required: [app, appName, username, message]
      additionalProperties: false
      properties:
        app: { type: string, enum: [admin, customer, booth] }
        appName: { type: string }
        username: { type: string }
        message: { type: string }

    VenueHasEvents:
      description: The `409` for deleting a venue that still has events. An `ErrorEnvelope`.
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: VENUE_HAS_EVENTS }
            message: { type: string }
            details:
              type: object
              properties:
                eventCount:
                  type: integer
                  minimum: 1
                  description: Omitted only when a concurrent insert made the database refuse.

    Location:
      description: |
        A venue. Feature 013: when `street`, `city`, `state`, and `zip` are set, `address` is
        built from them as `STREET, CITY, ST ZIP`. Three kinds of venue:

        - `addressVerified: true`: the address service matched it; the four fields are its
          standard (upper-case) form.
        - `addressVerified: false` with the four fields set: an admin saved it anyway
          (`acceptUnverifiedAddress`); the fields are as the admin sent them.
        - `addressVerified: false` with the four fields `null`: saved before feature 013 and not
          re-addressed since; `address` is the one-line text it was saved with.

        The five fields are always sent from feature 013 on, but are not in `required`, so this
        contract can merge before the Backend sends them (feature 013 research R11).
      type: object
      required: [id, name, address, seatingCapacity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: 'KFC Yum! Center' }
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: The full one-line address. Shown by every client and matched by `q`.
          example: '430 W VINE ST, LEXINGTON, KY 40507'
        street:
          type: [string, 'null']
          maxLength: 200
          example: '430 W VINE ST'
        city:
          type: [string, 'null']
          maxLength: 100
          example: LEXINGTON
        state:
          oneOf:
            - { $ref: '#/components/schemas/UsState' }
            - { type: 'null' }
        zip:
          type: [string, 'null']
          pattern: '^[0-9]{5}$'
          example: '40507'
        addressVerified:
          type: boolean
          description: Whether the address service matched this address. Clients mark `false` as "Address not verified".
        seatingCapacity: { type: integer, minimum: 1, example: 22090 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LocationInput:
      type: object
      required: [name, seatingCapacity]
      description: |
        Feature 013: the address is sent as four fields and checked with the address service.
        `address` is not accepted; the Backend builds it.

        `street`, `city`, `state`, and `zip` are **required**: the Backend refuses a create
        without any of them with `400 VALIDATION_FAILED`. They are left out of `required` only so
        the Admin app's generated request types still compile on `main` between this contract
        and its implementation (feature 013 research R11).
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: Rejected when empty or whitespace-only after trimming.,
          }
        street:
          type: string
          minLength: 1
          maxLength: 200
          description: House number and street. Trimmed; rejected when empty.
          example: '430 W Vine St'
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; rejected when empty.
          example: Lexington
        state: { $ref: '#/components/schemas/UsState' }
        zip:
          type: string
          pattern: '^[0-9]{5}(-[0-9]{4})?$'
          description: 5 digits, or ZIP+4. The saved value is the address service's 5-digit ZIP.
          example: '40507'
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        seatingCapacity:
          { type: integer, minimum: 1, description: Must be a positive whole number. }

    LocationUpdate:
      type: object
      minProperties: 1
      description: |
        Partial update; supply only the fields being changed. Feature 013: `street`, `city`,
        `state`, and `zip` are sent all together or not at all, and `acceptUnverifiedAddress`
        only with them (`400` otherwise).
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        street: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { $ref: '#/components/schemas/UsState' }
        zip: { type: string, pattern: '^[0-9]{5}(-[0-9]{4})?$' }
        acceptUnverifiedAddress:
          $ref: '#/components/schemas/AcceptUnverifiedAddress'
        seatingCapacity: { type: integer, minimum: 1 }

    AcceptUnverifiedAddress:
      type: boolean
      default: false
      description: |
        Feature 013 "save anyway": the admin confirmed the address after an `ADDRESS_NOT_FOUND`
        or `ADDRESS_AMBIGUOUS` refusal. The address service is still asked. With no match or
        several matches, the venue is saved as sent (trimmed, runs of whitespace collapsed to one
        space, ZIP cut to 5 digits) with `addressVerified: false`. With exactly
        one match, it is saved verified, as without the flag. When the service is unavailable,
        the request is still refused with `503 ADDRESS_SERVICE_UNAVAILABLE`.

    UsState:
      type: string
      description: A US state or the District of Columbia, by its two-letter postal code (feature 013).
      enum:
        [
          AL,
          AK,
          AZ,
          AR,
          CA,
          CO,
          CT,
          DE,
          DC,
          FL,
          GA,
          HI,
          ID,
          IL,
          IN,
          IA,
          KS,
          KY,
          LA,
          ME,
          MD,
          MA,
          MI,
          MN,
          MS,
          MO,
          MT,
          NE,
          NV,
          NH,
          NJ,
          NM,
          NY,
          NC,
          ND,
          OH,
          OK,
          OR,
          PA,
          RI,
          SC,
          SD,
          TN,
          TX,
          UT,
          VT,
          VA,
          WA,
          WV,
          WI,
          WY,
        ]

    Event:
      type: object
      required:
        [
          id,
          name,
          locationId,
          location,
          startsAt,
          endsAt,
          totalTicketCapacity,
          basePrice,
          status,
          cancelledAt,
          reservedSeating,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, example: Season Opener }
        reservedSeating:
          type: boolean
          description: Feature 007. Whether customers choose seats; set with `updateSeating`.
        status:
          type: string
          enum: [SCHEDULED, CANCELLED]
          description: Feature 005. A cancelled event stays on record but is read-only.
        cancelledAt:
          type: [string, 'null']
          format: date-time
          description: When the event was cancelled; `null` while scheduled.
        locationId: { type: string, format: uuid }
        location:
          allOf: [{ $ref: '#/components/schemas/Location' }]
          description: The venue, embedded so lists need no second request.
        startsAt: { type: string, format: date-time, example: '2026-10-01T18:00:00-04:00' }
        endsAt: { type: string, format: date-time, example: '2026-10-01T21:00:00-04:00' }
        totalTicketCapacity: { type: integer, minimum: 1, example: 18000 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          example: 8
          description: |
            Feature 016. The most valid tickets one customer may hold for this event, across all
            their orders; `null` for no limit. Never more than `totalTicketCapacity`. Always sent
            once 016 is implemented; not listed as required so this contract can merge ahead of
            the implementation with the suite green. Clients treat a missing value as `null`.
        images:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/EventImage' }
          description: |
            Feature 014. The event's images in order, `position` 1 (the cover) first; empty when it
            has none. Metadata only: load each image's content with `getEventImage`. Always sent
            once 014 is implemented; not listed as required so this contract can merge ahead of the
            implementation with the suite green. Clients treat a missing value as empty.
        basePrice:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number, so no client loses precision.
          example: '45.00'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventInput:
      type: object
      required: [name, locationId, startsAt, endsAt, basePrice]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId:
          {
            type: string,
            format: uuid,
            description: Must reference an existing venue; otherwise 404.,
          }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Must be strictly after `startsAt`. }
        totalTicketCapacity:
          type: integer
          minimum: 1
          description: |
            Must not exceed the venue's `seatingCapacity`. Feature 007: optional; when left out it
            is the venue's `seatingCapacity`.
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: |
            Feature 016. Optional; left out or `null` means no limit. Must not exceed the event's
            `totalTicketCapacity` (`400` otherwise).
        basePrice:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }

    EventUpdate:
      type: object
      minProperties: 1
      description: Partial update; supply only the fields being changed.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        locationId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        totalTicketCapacity: { type: integer, minimum: 1 }
        maxTicketsPerCustomer:
          type: [integer, 'null']
          minimum: 1
          description: Feature 016. `null` clears the limit.
        basePrice: { type: string, pattern: '^\d+(\.\d{1,2})?$' }

    EventImage:
      description: |
        Feature 014. One picture of an event: what a client needs to load it from
        `getEventImage` and to order it, never its content.
      type: object
      required: [id, position, contentType, byteSize]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Never reused. An image's content never changes; a new picture is a new id.
        position:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 is the event's cover. An event's positions are always 1 to n, no gaps.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: Detected from the file's content when it was added.
        byteSize: { type: integer, minimum: 1, maximum: 5242880 }

    EventImageUpload:
      description: Feature 014. The `multipart/form-data` body of `uploadEventImage`.
      type: object
      required: [file]
      additionalProperties: false
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: |
            One JPEG, PNG, or WebP picture, at most 5,242,880 bytes. Its file name and declared
            type are ignored.

    EventImageOrder:
      description: Feature 014. Every image of the event, each once, in the new order.
      type: object
      required: [imageIds]
      additionalProperties: false
      properties:
        imageIds:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }

    TicketTier:
      description: One kind of ticket for an event, such as General or VIP (feature 004).
      type: object
      required: [id, eventId, name, price, quantity, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100, example: VIP }
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
          description: Decimal string in USD, never a JSON number.
          example: '120.00'
        quantity:
          type: integer
          minimum: 0
          example: 500
          description: |
            Typed for a general-admission event. Feature 007: for an event with reserved seating,
            the seats in the sections mapped to this tier; 0 when none are.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketTierInput:
      type: object
      required: [name, price]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: Trimmed; unique within the event ignoring case.,
          }
        price:
          { type: string, pattern: '^\d+(\.\d{1,2})?$', description: Non-negative decimal string. }
        quantity:
          type: integer
          minimum: 1
          description: |
            The event's tiers together may not exceed its `totalTicketCapacity`. Required without
            reserved seating; omitted with it (feature 007).

    TicketTierUpdate:
      type: object
      minProperties: 1
      description: Partial update; supply only the fields being changed.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        price: { type: string, pattern: '^\d+(\.\d{1,2})?$' }
        quantity: { type: integer, minimum: 1 }

    Ticket:
      description: One seat. The code is unique and unguessable (feature 005).
      type: object
      required: [id, code, status, checkedInAt, seat]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z2-9]{12}$', example: 7KQ2M9XWAB4C }
        status: { type: string, enum: [VALID, VOID] }
        checkedInAt: { type: [string, 'null'], format: date-time }
        seat:
          description: Feature 007. The seat this ticket is for; `null` for general admission.
          oneOf:
            - $ref: '#/components/schemas/SeatLabel'
            - type: 'null'

    Order:
      description: One customer's purchase for one event (feature 005).
      type: object
      required:
        [
          id,
          eventId,
          tierId,
          tierName,
          customerUsername,
          quantity,
          unitPrice,
          totalPrice,
          status,
          createdAt,
          refundedAt,
          tickets,
        ]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        tierId:
          type: [string, 'null']
          format: uuid
          description: '`null` for an event sold without tiers.'
        tierName: { type: [string, 'null'] }
        customerUsername: { type: string, example: customer1 }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        unitPrice: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        totalPrice: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        status: { type: string, enum: [CONFIRMED, REFUNDED] }
        createdAt: { type: string, format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }

    OrderInput:
      type: object
      required: [quantity]
      properties:
        tierId:
          type: string
          format: uuid
          description: Required for an event with tiers; omitted for one without.
        quantity: { type: integer, minimum: 1, maximum: 10 }
        requestId:
          type: string
          format: uuid
          description: |
            Feature 006. A new random id for each confirmation the customer makes, reused only to
            repeat that same confirmation. Optional; see `createOrder`.
        seats:
          type: array
          minItems: 1
          maxItems: 10
          description: Feature 007. Required for reserved seating, one per ticket; see `createOrder`.
          items: { $ref: '#/components/schemas/SeatChoice' }

    MyOrder:
      description: One of the signed-in customer's orders, with a summary of its event (feature 006).
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [event]
          properties:
            event: { $ref: '#/components/schemas/OrderEvent' }

    OrderEvent:
      description: The parts of an event My tickets shows next to an order (feature 006).
      type: object
      required: [id, name, startsAt, endsAt, status, location]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Season Opener }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        location:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: KFC Yum! Center }

    Availability:
      description: |
        Tickets left for an event and its tiers, and whether sales are closed (feature 006).
        Valid tickets only. Guidance, not a reservation.
      type: object
      required: [eventId, ticketsLeft, salesClosed, tiers]
      properties:
        eventId: { type: string, format: uuid }
        customerLimit:
          oneOf:
            - $ref: '#/components/schemas/CustomerLimit'
            - type: 'null'
          description: |
            Feature 016. The caller's standing against the event's `maxTicketsPerCustomer`;
            `null` when the event has no limit or the caller is not a customer. Always sent once
            016 is implemented; optional for the same reason as `Event.maxTicketsPerCustomer`.
            Clients treat a missing value as `null`.
        ticketsLeft:
          type: integer
          minimum: 0
          description: The event's ticket capacity minus its valid tickets.
        salesClosed:
          type: [string, 'null']
          enum: [CANCELLED, STARTED, null]
          description: '`null` while tickets can be ordered; otherwise why they cannot.'
        tiers:
          type: array
          description: One entry per tier, in the order `listTicketTiers` returns; empty without tiers.
          items: { $ref: '#/components/schemas/TierAvailability' }

    CustomerLimit:
      type: object
      description: Feature 016. One customer's own standing against an event's limit.
      required: [limit, held, remaining]
      properties:
        limit: { type: integer, minimum: 1, description: The event's `maxTicketsPerCustomer`. }
        held:
          type: integer
          minimum: 0
          description: The caller's valid tickets for the event, across all their orders.
        remaining:
          type: integer
          minimum: 0
          description: |
            How many more the caller may get under the limit, `limit - held`, never below 0. Tickets
            left for the event may still be fewer.

    TierAvailability:
      type: object
      required: [tierId, ticketsLeft]
      properties:
        tierId: { type: string, format: uuid }
        ticketsLeft:
          type: integer
          minimum: 0
          description: The tier's quantity minus its valid tickets, never more than the event has left.

    Section:
      description: One block of a venue's seating layout (feature 007).
      type: object
      required: [id, name, rows, seatsPerRow]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 50, example: A }
        rows: { type: integer, minimum: 1, maximum: 100, example: 10 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 200, example: 20 }

    SectionInput:
      type: object
      required: [name, rows, seatsPerRow]
      properties:
        name: { type: string, minLength: 1, maxLength: 50, example: A }
        rows: { type: integer, minimum: 1, maximum: 100 }
        seatsPerRow: { type: integer, minimum: 1, maximum: 200 }

    LayoutInput:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          maxItems: 50
          description: In display order. Names unique ignoring case.
          items: { $ref: '#/components/schemas/SectionInput' }

    SeatingLayout:
      description: A venue's sections, in display order (feature 007).
      type: object
      required: [locationId, totalSeats, sections]
      properties:
        locationId: { type: string, format: uuid }
        totalSeats: { type: integer, minimum: 0 }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }

    SeatPosition:
      type: object
      required: [row, seat]
      properties:
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }

    SeatChoice:
      description: A seat a customer chooses when ordering (feature 007).
      type: object
      required: [sectionId, row, seat]
      properties:
        sectionId: { type: string, format: uuid }
        row: { type: integer, minimum: 1 }
        seat: { type: integer, minimum: 1 }

    SeatLabel:
      description: A sold seat, by its section's name when sold (feature 007).
      type: object
      required: [section, row, seat]
      properties:
        section: { type: string, example: A }
        row: { type: integer, minimum: 1, example: 3 }
        seat: { type: integer, minimum: 1, example: 7 }

    SeatMapSection:
      type: object
      required: [sectionId, name, rows, seatsPerRow, tierId, sold, taken]
      properties:
        sectionId: { type: string, format: uuid }
        name: { type: string }
        rows: { type: integer, minimum: 1 }
        seatsPerRow: { type: integer, minimum: 1 }
        tierId:
          type: [string, 'null']
          format: uuid
          description: This section's tier for the event; `null` when unmapped.
        sold: { type: integer, minimum: 0 }
        taken:
          type: array
          description: Seats held by valid tickets. Never says by whom.
          items: { $ref: '#/components/schemas/SeatPosition' }

    SeatMap:
      description: An event's seats, sold or open (feature 007).
      type: object
      required: [eventId, reservedSeating, sections]
      properties:
        eventId: { type: string, format: uuid }
        reservedSeating: { type: boolean }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SeatMapSection' }

    SeatingInput:
      type: object
      required: [reservedSeating, sections]
      properties:
        reservedSeating: { type: boolean }
        sections:
          type: array
          description: The complete set of mappings; sections left out become unmapped.
          items:
            type: object
            required: [sectionId, tierId]
            properties:
              sectionId: { type: string, format: uuid }
              tierId: { type: string, format: uuid }

    Cancellation:
      type: object
      required: [event, ordersRefunded, ticketsVoided]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        ordersRefunded: { type: integer, minimum: 0 }
        ticketsVoided: { type: integer, minimum: 0 }

    TierSales:
      type: object
      required: [tierId, name, price, quantity, ticketsSold, revenue]
      properties:
        tierId: { type: string, format: uuid }
        name: { type: string }
        price: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        quantity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }

    EventSales:
      type: object
      required:
        [
          eventId,
          name,
          venueName,
          startsAt,
          status,
          ticketCapacity,
          ticketsSold,
          checkedIn,
          revenue,
          tiers,
        ]
      properties:
        eventId: { type: string, format: uuid }
        name: { type: string }
        venueName: { type: string }
        startsAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, CANCELLED] }
        ticketCapacity: { type: integer, minimum: 1 }
        ticketsSold: { type: integer, minimum: 0 }
        checkedIn: { type: integer, minimum: 0 }
        revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/TierSales' }

    SalesReport:
      type: object
      required: [generatedAt, totals, events]
      properties:
        generatedAt: { type: string, format: date-time }
        totals:
          type: object
          required: [events, ticketCapacity, ticketsSold, checkedIn, revenue]
          properties:
            events: { type: integer, minimum: 0, description: Scheduled events. }
            ticketCapacity:
              { type: integer, minimum: 0, description: Capacity of scheduled events. }
            ticketsSold: { type: integer, minimum: 0 }
            checkedIn: { type: integer, minimum: 0 }
            revenue: { type: string, pattern: '^\d+\.\d{2}$', example: '45.00' }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventSales' }

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Every non-2xx response uses this shape. `code` is the stable machine-readable
        discriminator clients branch on; `message` is human-readable and may change.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION_FAILED
                - NOT_FOUND
                - SCHEDULING_CONFLICT
                - VENUE_HAS_EVENTS
                - CAPACITY_EXCEEDED
                - TIER_NAME_TAKEN
                - SOLD_OUT
                - EVENT_CANCELLED
                - EVENT_HAS_ORDERS
                - TIER_HAS_ORDERS
                - SALES_CLOSED
                - REQUEST_ID_REUSED
                - SEAT_TAKEN
                - LAYOUT_IN_USE
                - TICKET_LIMIT_REACHED
                - ADDRESS_NOT_FOUND
                - ADDRESS_AMBIGUOUS
                - ADDRESS_SERVICE_UNAVAILABLE
                - IMAGE_LIMIT_REACHED
                - IMAGE_TOO_LARGE
                - IMAGE_TYPE_NOT_ALLOWED
                - IMAGES_CHANGED
            message: { type: string }
            details: { type: object, additionalProperties: true }

  responses:
    Unauthenticated:
      description: |
        No token, or the token is malformed, expired, signed by an unknown key, from another
        issuer, or for another audience. The message does not say which check failed.
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: UNAUTHENTICATED
              message: A valid access token is required.

    Forbidden:
      description: The token is valid, but the caller lacks a role this operation requires.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: FORBIDDEN
              message: This action requires the queuepass-admin role.
              details:
                requiredRoles: [queuepass-admin]

    ValidationFailed:
      description: Request shape or field validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: Request validation failed.
              details:
                fields:
                  endsAt: must be later than startsAt
                  seatingCapacity: must be a positive whole number

    AddressRejected:
      description: |
        Request shape or field validation failed (`VALIDATION_FAILED`), or, for a venue address
        (feature 013), the address service found no match (`ADDRESS_NOT_FOUND`) or more than one
        (`ADDRESS_AMBIGUOUS`, with up to 5 matches in `details.candidates`, each in the one-line form
        `STREET, CITY, ST ZIP`, or as the service returned it when it cannot be split). A match the
        Backend cannot split is reported as `ADDRESS_NOT_FOUND`. Nothing was saved.
        After either address refusal, the client may resend the same request with
        `acceptUnverifiedAddress: true` to save the venue as not verified.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            validationFailed:
              summary: A field is missing or malformed
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                  details:
                    fields: ['zip must be 5 digits, or 5 digits, a hyphen, and 4 digits']
            addressNotFound:
              summary: The address service found no such US address
              value:
                error:
                  code: ADDRESS_NOT_FOUND
                  message: "We couldn't find 1 Nowhere Blvd, Louisville, KY 40202 as a US address. Check the street, city, state, and ZIP code."
                  details:
                    address: '1 Nowhere Blvd, Louisville, KY 40202'
            addressAmbiguous:
              summary: The address matches more than one US address
              value:
                error:
                  code: ADDRESS_AMBIGUOUS
                  message: '100 Main St, Springfield, IL 62701 matches more than one US address. Enter one of these.'
                  details:
                    address: '100 Main St, Springfield, IL 62701'
                    candidates:
                      [
                        '100 N MAIN ST, SPRINGFIELD, IL 62701',
                        '100 S MAIN ST, SPRINGFIELD, IL 62701',
                      ]

    AddressServiceUnavailable:
      description: |
        Feature 013: the address service could not be reached, did not answer within 5 seconds,
        or answered with an error, so the address could not be verified. Nothing was saved. The
        same request may succeed later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: ADDRESS_SERVICE_UNAVAILABLE
              message: "We can't verify the address right now. Nothing was saved. Try again in a minute."

    ImageTooLarge:
      description: Feature 014. The image is over 5 MB (5,242,880 bytes). Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TOO_LARGE
              message: An image can be at most 5 MB.
              details:
                maxBytes: 5242880

    ImageTypeNotAllowed:
      description: |
        Feature 014. The file's content is not a JPEG, PNG, or WebP picture, whatever its name or
        declared type. Nothing was stored.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: IMAGE_TYPE_NOT_ALLOWED
              message: This file is not a JPG, PNG, or WebP picture.
              details:
                allowed: [image/jpeg, image/png, image/webp]

    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: NOT_FOUND
              message: No venue exists with id 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40.

    Conflict:
      description: |
        The request violates a business rule; `code` says which. For `SCHEDULING_CONFLICT`,
        `details.conflictingEvent` names the event responsible. It is `null` only when a
        concurrent request won the race and the database constraint refused this write.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            schedulingConflict:
              summary: Venue already committed during this window
              value:
                error:
                  code: SCHEDULING_CONFLICT
                  message: "KFC Yum! Center is already committed from 18:00 to 21:00 by 'Season Opener'. Events at the same venue must be at least 60 minutes apart."
                  details:
                    bufferMinutes: 60
                    conflictingEvent:
                      id: 7c2f1b5e-1f3a-4f9e-9a2d-0c9b1d2e3f40
                      name: Season Opener
                      startsAt: '2026-10-01T18:00:00-04:00'
                      endsAt: '2026-10-01T21:00:00-04:00'
            schedulingConflictRace:
              summary: Lost a concurrent write race
              value:
                error:
                  code: SCHEDULING_CONFLICT
                  message: This venue was committed for an overlapping window by another request. Reload and try again.
                  details:
                    bufferMinutes: 60
                    conflictingEvent: null
            capacityExceeded:
              summary: Ticket capacity above the venue's seating capacity
              value:
                error:
                  code: CAPACITY_EXCEEDED
                  message: 'Ticket capacity 25000 exceeds the seating capacity of KFC Yum! Center (22090).'
                  details:
                    seatingCapacity: 22090
                    requestedTicketCapacity: 25000
            tierCapacityExceeded:
              summary: Tier quantities would exceed the event's ticket capacity
              value:
                error:
                  code: CAPACITY_EXCEEDED
